<style>

}

.empty{
    background:white;

    padding:50px;
    text-align:center;

}

.footer{

}

@media print{

    body{
        background:white;

    .filter-box,
    .footer,
    .message{

        max-width:none;
        margin:0;
        padding:0;
    }

    .card-area{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:10mm;
    }

    .kartu{
        box-shadow:none;
        break-inside:avoid;
        page-break-inside:avoid;
        border:1px solid #000;
    }

}

/* ================= RESPONSIVE ================= */

@media(max-width:800px){

    .filter-grid{
        grid-template-columns:1fr;
    }

    .card-area{
        grid-template-columns:1fr;
    }

}

<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <div>

        <h1>🪪 KARTU UJIAN</h1>

        <p>
            RUANG EXAM — SMP Negeri 3 Sibolga
        </p>

    </div>

    <div class="header-buttons">

        <button
            class="btn btn-back"
            onclick="kembaliDashboard()">

            ← Dashboard

        </button>

        <button
            class="btn btn-print"
            onclick="cetakKartu()">

            🖨️ Cetak

        </button>

    </div>

</header>


<main class="container">

    <div
        id="message"
        class="message">
    </div>


    <!-- ================= FILTER ================= -->

    <section class="filter-box">

        <div class="filter-grid">

            <div class="field">

                <label>
                    PILIH UJIAN
                </label>

                <select
                    id="filterUjian"
                    onchange="filterSiswa()">

                    <option value="">
                        Semua Ujian
                    </option>

                </select>

            </div>


            <div class="field">

                <label>
                    PILIH KELAS
                </label>

                <select
                    id="filterKelas"
                    onchange="filterSiswa()">

                    <option value="">
                        Semua Kelas
                    </option>

                </select>

            </div>


            <div class="field">

                <label>
                    CARI SISWA
                </label>

                <input
                    id="searchSiswa"
                    type="text"
                    placeholder="🔎 Nama atau NISN..."
                    oninput="filterSiswa()">

            </div>

        </div>


        <div class="action-area">

            <div
                class="action-left"
                id="jumlahKartu">

                0 kartu

            </div>


            <div class="action-buttons">

                <button
                    class="action-btn btn-preview"
                    onclick="tampilkanSemua()">

                    🔄 Tampilkan Semua

                    🖨️ Cetak Kartu

    </section>


    <!-- ================= KARTU ================= -->

    <section

            ⏳ Memuat data siswa dan ujian...

        </div>

    </section>

</main>


<footer class="footer">

    Dibuat oleh Mr. Rahmat Batubara, S.T.P

</footer>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://sztfucrmjexoalyiwwnq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_j724cUM7NNHl8wbxq9ZHKw_FLFJAuGn";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   SESSION ADMIN
===================================================== */

const sessionRaw =
    localStorage.getItem("exam_user");


if(!sessionRaw){

    window.location.href =
        "login.html";

}


try{

    const user =
        JSON.parse(sessionRaw);


    if(user.role !== "admin"){

        localStorage.removeItem(
            "exam_user"
        );

        window.location.href =
            "login.html";

    }

}catch(error){

    localStorage.removeItem(
        "exam_user"
    );

    window.location.href =
        "login.html";

}


/* =====================================================
   DATA
===================================================== */

let semuaSiswa = [];
let semuaUjian = [];
let dataTampil = [];


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type){

    const el =
        document.getElementById(
            "message"
        );

    el.textContent =
        text;

    el.className =
        "message " + type;

}

function hideMessage(){

    const el =
        document.getElementById(
            "message"
        );

    el.textContent = "";

    el.className =
        "message";

}


/* =====================================================
   LOAD DATA
===================================================== */

async function loadData(){

    hideMessage();


    const area =
        document.getElementById(
            "cardArea"
        );


    area.innerHTML = `
        <div class="empty">
            ⏳ Memuat data siswa dan ujian...
        </div>
    `;


    try{

        /* ================= SISWA ================= */

        const siswaHasil =
            await supabaseClient
            .from("siswa")
            .select(`
                id,
                nama,
                nisn,
                kelas
            `)
            .order(
                "nama",
                {ascending:true}
            );


        if(siswaHasil.error){

            throw siswaHasil.error;

        }


        semuaSiswa =
            siswaHasil.data || [];


        /* ================= UJIAN ================= */

        const ujianHasil =
            await supabaseClient
            .from("ujian")
            .select("*")
            .order(
                "created_at",
                {ascending:false}
            );


        if(ujianHasil.error){

            throw ujianHasil.error;

        }


        semuaUjian =
            ujianHasil.data || [];


        isiFilter();


        filterSiswa();


    }catch(error){

        console.error(error);


        area.innerHTML = `
            <div class="empty">

                ❌ Gagal memuat data.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>
        `;


        showMessage(
            "Gagal memuat data: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   FILTER
===================================================== */

function isiFilter(){

    const ujianSelect =
        document.getElementById(
            "filterUjian"
        );


    ujianSelect.innerHTML = `
        <option value="">
            Semua Ujian
        </option>
    `;


    semuaUjian.forEach(
        ujian=>{

            ujianSelect.innerHTML += `
                <option value="${escapeHtml(
                    ujian.id
                )}">

                    ${escapeHtml(
                        ujian.judul || "-"
                    )}

                </option>
            `;

        }
    );


    const kelasSelect =
        document.getElementById(
            "filterKelas"
        );


    const kelas =
        [
            ...new Set(
                semuaSiswa
                .map(
                    s =>
                    String(
                        s.kelas || ""
                    ).trim()
                )
                .filter(Boolean)
            )
        ]
        .sort();


    kelasSelect.innerHTML = `
        <option value="">
            Semua Kelas
        </option>
    `;


    kelas.forEach(
        k=>{

            kelasSelect.innerHTML += `
                <option value="${escapeHtml(k)}">
                    ${escapeHtml(k)}
                </option>
            `;

        }
    );

}


/* =====================================================
   FILTER SISWA
===================================================== */

function filterSiswa(){

    const ujianId =
        document.getElementById(
            "filterUjian"
        ).value;


    const kelas =
        document.getElementById(
            "filterKelas"
        ).value;


    const search =
        document.getElementById(
            "searchSiswa"
        ).value
        .toLowerCase()
        .trim();


    let hasil =
        [...semuaSiswa];


    if(kelas){

        hasil =
            hasil.filter(
                s =>
                String(
                    s.kelas || ""
                ) === kelas
            );

    }


    if(search){

        hasil =
            hasil.filter(
                s => {

                    const teks =
                        (
                            s.nama +
                            " " +
                            s.nisn
                        )
                        .toLowerCase();

                    return teks.includes(
                        search
                    );

                }
            );

    }


    dataTampil =
        hasil;


    tampilkanKartu(
        hasil,
        ujianId
    );

}


/* =====================================================
   TAMPILKAN SEMUA
===================================================== */

function tampilkanSemua(){

    document
    .getElementById(
        "filterUjian"
    )
    .value = "";


    document
    .getElementById(
        "filterKelas"
    )
    .value = "";


    document
    .getElementById(
        "searchSiswa"
    )
    .value = "";


    filterSiswa();

}


/* =====================================================
   TAMPILKAN KARTU
===================================================== */

function tampilkanKartu(
    siswaList,
    ujianId
){

    const area =
        document.getElementById(
            "cardArea"
        );


    document
    .getElementById(
        "jumlahKartu"
    )
    .textContent =
        siswaList.length +
        " kartu";


    if(!siswaList.length){

        area.innerHTML = `
            <div class="empty">

                👨‍🎓 Tidak ada siswa
                yang sesuai.

            </div>
        `;

        return;

    }


    let ujianTerpilih =
        semuaUjian.find(
            u =>
            u.id === ujianId
        );


    /*
     * Jika tidak memilih ujian,
     * gunakan ujian terbaru.
     */

    if(!ujianTerpilih){

        ujianTerpilih =
            semuaUjian[0] || null;

    }


    area.innerHTML =
        siswaList.map(
            siswa =>
            buatKartu(
                siswa,
                ujianTerpilih
            )
        ).join("");

}


/* =====================================================
   BUAT KARTU
===================================================== */

function buatKartu(
    siswa,
    ujian
){

    const tanggal =
        ujian &&
        (
            ujian.tanggal_ujian ||
            ujian.tanggal ||
            ujian.created_at
        );


    const tanggalText =
        formatTanggal(
            tanggal
        );


    /*
     * Token hanya ditampilkan jika
     * kolom token memang tersedia
     * pada tabel ujian.
     */

    const token =
        ujian &&
        (
            ujian.token ||
            ujian.kode_token ||
            ujian.token_ujian
        );


    const tokenHTML =
        token
        ?
        `
            <div class="token">
                ${escapeHtml(token)}
            </div>
        `
        :
        `
            <div class="no-token">
                Token belum tersedia
            </div>
        `;


    return `

    <article class="kartu">

        <div class="kartu-header">

            <div class="school">
                SMP NEGERI 3 SIBOLGA
            </div>

            <h2>
                KARTU PESERTA UJIAN
            </h2>

            <div class="exam">
                ${
                    ujian
                    ?
                    escapeHtml(
                        ujian.judul || "-"
                    )
                    :
                    "Belum ada ujian"
                }
            </div>

        </div>


        <div class="kartu-body">

            <div class="identitas">

                <div class="label">
                    Nama
                </div>

                <div class="colon">
                    :
                </div>

                <div class="value">
                    ${escapeHtml(
                        siswa.nama || "-"
                    )}
                </div>


                <div class="label">
                    NISN
                </div>

                <div class="colon">
                    :
                </div>

                <div class="value">
                    ${escapeHtml(
                        siswa.nisn || "-"
                    )}
                </div>


                <div class="label">
                    Kelas
                </div>

                <div class="colon">
                    :
                </div>

                <div class="value">
                    ${escapeHtml(
                        siswa.kelas || "-"
                    )}
                </div>


                <div class="label">
                    Tanggal
                </div>

                <div class="colon">
                    :
                </div>

                <div class="value">
                    ${tanggalText}
                </div>


                <div class="label">
                    Durasi
                </div>

                <div class="colon">
                    :
                </div>

                <div class="value">
                    ${
                        ujian
                        ?
                        (
                            Number(
                                ujian.durasi_menit
                            ) || 0
                        ) +
                        " menit"
                        :
                        "-"
                    }
                </div>

            </div>


            <div class="token-box">

                <div class="token-title">
                    TOKEN UJIAN
                </div>

                ${tokenHTML}

            </div>

        </div>


        <div class="kartu-footer">

            <span>
                RUANG EXAM
            </span>

            <span>
                Dibuat oleh
                Mr. Rahmat Batubara, S.T.P
            </span>

        </div>

    </article>

    `;

}


/* =====================================================
   CETAK
===================================================== */

function cetakKartu(){

    if(!dataTampil.length){

        alert(
            "Tidak ada kartu yang dapat dicetak."
        );

        return;

    }


    window.print();

}


/* =====================================================
   FORMAT TANGGAL
===================================================== */

function formatTanggal(
    value
){

    if(!value){

        return "-";

    }


    const date =
        new Date(value);


    if(
        isNaN(
            date.getTime()
        )
    ){

        return String(value);

    }


    return date.toLocaleDateString(
        "id-ID",
        {
            day:"2-digit",
            month:"long",
            year:"numeric"
        }
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   DASHBOARD
===================================================== */

function kembaliDashboard(){

    window.location.href =
        "admin.html";

}


/* =====================================================
   START
===================================================== */

loadData();

</script>

</body>
</html>
