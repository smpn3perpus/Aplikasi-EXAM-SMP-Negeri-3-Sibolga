  <script>

    // =====================================================
    // SUPABASE
    // =====================================================

    const SUPABASE_URL =
      'https://sztfucrmjexoalyiwwnq.supabase.co';

    const SUPABASE_ANON_KEY =
      'sb_publishable_j724cUM7NNHl8wbxq9ZHKw_FLFJAuGn';

    const { createClient } = window.supabase;

    const supabaseClient =
      createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    // =====================================================
    // AMBIL DATA GURU YANG SEDANG LOGIN
    // =====================================================

    async function loadGuru() {

      const status =
        document.getElementById('statusKoneksi');

      const nama =
        document.getElementById('guruName');

      const identitas =
        document.getElementById('guruIdentitas');


      try {

        // -------------------------------------------------
        // CEK SESSION
        // -------------------------------------------------

        const {
          data: {
            session
          }
        } =
          await supabaseClient.auth.getSession();


        if (!session || !session.user) {

          alert(
            'Sesi login tidak ditemukan.\n\nSilakan login kembali.'
          );

          window.location.href =
            'index.html';

          return;

        }


        const userId =
          session.user.id;


        // -------------------------------------------------
        // CARI DATA GURU BERDASARKAN USER_ID
        // -------------------------------------------------

        const {
          data: guru,
          error
        } =
          await supabaseClient
            .from('guru_master')
            .select(
              'id,nama,nip_nik,is_active,user_id'
            )
            .eq(
              'user_id',
              userId
            )
            .maybeSingle();


        if (error) {

          console.error(
            'Guru master error:',
            error
          );

          status.innerText =
            'Database bermasalah ❌';

          status.className =
            'text-sm font-medium px-3 py-1 rounded-full bg-red-100 text-red-800';

          alert(
            'Gagal membaca data guru_master:\n\n' +
            error.message
          );

          return;

        }


        if (!guru) {

          status.innerText =
            'Data guru belum terhubung ❌';

          status.className =
            'text-sm font-medium px-3 py-1 rounded-full bg-red-100 text-red-800';

          alert(
            'Data guru_master belum terhubung dengan akun login ini.\n\n' +
            'User ID akun:\n' +
            userId +
            '\n\n' +
            'Silakan hubungi Admin untuk menghubungkan akun guru.'
          );

          return;

        }


        // -------------------------------------------------
        // TAMPILKAN DATA GURU
        // -------------------------------------------------

        nama.innerText =
          guru.nama || 'Guru';

        identitas.innerText =
          'NIP / NIK: ' +
          (guru.nip_nik || '-');


        status.innerText =
          'Guru Terhubung ✅';

        status.className =
          'text-sm font-medium px-3 py-1 rounded-full bg-emerald-100 text-emerald-800';


        console.log(
          'DATA GURU:',
          guru
        );

      }

      catch (err) {

        console.error(err);

        status.innerText =
          'Terjadi kesalahan ❌';

        alert(
          'Terjadi kesalahan:\n\n' +
          err.message
        );

      }

    }


    // =====================================================
    // LOGOUT
    // =====================================================

    document
      .getElementById('btnLogout')
      .addEventListener(
        'click',
        async function() {

          await supabaseClient.auth.signOut();

          window.location.href =
            'index.html';

        }
      );


    // =====================================================
    // JALANKAN
    // =====================================================

    loadGuru();

  </script>
