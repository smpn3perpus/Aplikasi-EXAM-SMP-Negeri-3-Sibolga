<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lembar Ujian - EXAM SMPN 3 Sibolga</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col justify-between">

  <!-- Header Ujian -->
  <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-50">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
      <div>
        <h1 class="text-base font-bold" id="namaUjianHeader">Ujian Online SMPN 3 Sibolga</h1>
        <p class="text-xs text-indigo-200" id="infoSiswaHeader">Siswa: - | Token: -</p>
      </div>
      <div class="bg-indigo-800 px-4 py-2 rounded-lg border border-indigo-700 text-center">
        <p class="text-xs text-indigo-200">Sisa Waktu</p>
        <p id="timer" class="text-lg font-mono font-bold text-yellow-300">00:00:00</p>
      </div>
    </div>
  </header>

  <!-- Lembar Soal -->
  <main class="container mx-auto px-4 py-6 max-w-3xl flex-grow">
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-4 border-b pb-3">
        <span class="text-sm font-semibold text-slate-600" id="nomorSoal">Soal No. 1</span>
        <span class="text-xs font-semibold px-2.5 py-1 rounded bg-blue-100 text-blue-800">Pilihan Ganda</span>
      </div>

      <!-- Pertanyaan -->
      <div id="teksSoal" class="text-base text-slate-800 mb-6 leading-relaxed">
        Memuat pertanyaan...
      </div>

      <!-- Pilihan Jawaban -->
      <div class="space-y-3" id="containerPilihan">
        <!-- Pilihan jawaban di-render secara dinamis -->
      </div>
    </div>

    <!-- Tombol Navigasi -->
    <div class="flex justify-between items-center mt-6">
      <button id="btnPrev" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-5 py-2.5 rounded-lg text-sm font-semibold transition">
        &larr; Sebelumnya
      </button>
      <button id="btnNext" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg text-sm font-semibold transition">
        Berikutnya &rarr;
      </button>
      <button id="btnFinish" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-lg text-sm font-semibold transition hidden">
        Selesai & Kirim
      </button>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-200 text-slate-600 text-xs text-center py-3">
    EXAM SMP Negeri 3 Sibolga &copy; 2026
  </footer>

  <script>
    const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT_URL.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>
</body>
</html>
