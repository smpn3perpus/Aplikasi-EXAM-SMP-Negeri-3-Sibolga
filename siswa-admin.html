<body>

<header class="header">

    <div>
        <h1>👨‍🎓 DAFTAR SISWA</h1>
        <p>RUANG EXAM — SMP Negeri 3 Sibolga</p>
    </div>

    <div class="header-buttons">

        <button
            class="btn btn-back"
            onclick="kembaliDashboard()">
            ← Dashboard
        </button>

        <button
            class="btn btn-refresh"
            onclick="loadSiswa()">
            🔄 Refresh

</header>


<main class="container">

    <div id="message" class="message"></div>


    <div class="toolbar">

        <div class="search">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Cari nama, NISN, atau kelas..."
                oninput="filterSiswa()">

            class="btn btn-add"

    <div class="modal-box">

        <h2 id="modalTitle">
            Tambah Siswa
        </h2>

        <div class="form-group">

            <label>
                Nama Siswa
            </label>

            <input
                type="text"
                id="nama"

        </div>


        <div class="form-group">

            <label>
                NISN
            </label>

            <input
                type="text"
                id="nisn"

        </div>


        <div class="form-group">

            <label>
                Kelas
            </label>

            <input

            </label>

        <div class="modal-buttons">

            <button

                Batal

                onclick="simpanSiswa()">
                💾 Simpan
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://sztfucrmjexoalyiwwnq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_j724cUM7NNHl8wbxq9ZHKw_FLFJAuGn";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   SESSION ADMIN
===================================================== */

const sessionRaw =
    localStorage.getItem("exam_user");


if(!sessionRaw){

    window.location.href =
        "login.html";

}


let currentUser = null;

try{

    currentUser =
        JSON.parse(sessionRaw);

    if(currentUser.role !== "admin"){

        localStorage.removeItem(
            "exam_user"
        );

        window.location.href =
            "login.html";

    }

}catch(error){

    localStorage.removeItem(
        "exam_user"
    );

    window.location.href =
        "login.html";

}


/* =====================================================
   DATA
===================================================== */

let semuaSiswa = [];

let editId = null;


/* =====================================================
   PESAN
===================================================== */

function showMessage(text,type){

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message " + type;

}

function hideMessage(){

    const message =
        document.getElementById("message");

    message.textContent = "";

    message.className =
        "message";

}


/* =====================================================
   LOAD SISWA
===================================================== */

async function loadSiswa(){

    hideMessage();

    const body =
        document.getElementById("siswaBody");

    body.innerHTML = `
        <tr>
            <td colspan="5" class="empty">
                ⏳ Memuat data siswa...
            </td>
        </tr>
    `;


    try{

        const { data,error } =
            await supabaseClient
            .from("siswa")
            .select("id,nama,nisn,kelas,password,created_at")
            .order("nama",{ascending:true});


        if(error){

            console.error(error);

            body.innerHTML = `
                <tr>
                    <td colspan="5" class="empty">
                        Gagal memuat data siswa.
                    </td>
                </tr>
            `;

            showMessage(
                "Gagal mengambil data siswa: " +
                error.message,
                "error"
            );

            return;

        }


        semuaSiswa =
            data || [];

        tampilkanSiswa(
            semuaSiswa
        );


    }catch(error){

        console.error(error);

        showMessage(
            "Terjadi kesalahan sistem: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   TAMPILKAN SISWA
===================================================== */

function tampilkanSiswa(data){

    const body =
        document.getElementById("siswaBody");


    if(!data.length){

        body.innerHTML = `
            <tr>
                <td colspan="5" class="empty">
                    Belum ada data siswa.
                </td>
            </tr>
        `;

        return;

    }


    body.innerHTML =
        data.map((siswa,index)=>{

            return `

                <tr>

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        <strong>
                            ${escapeHtml(siswa.nama || "-")}
                        </strong>
                    </td>

                    <td>
                        ${escapeHtml(siswa.nisn || "-")}
                    </td>

                    <td>
                        ${escapeHtml(siswa.kelas || "-")}
                    </td>

                    <td>

                        <div class="action">

                            <button
                                class="edit"
                                onclick="editSiswa('${siswa.id}')">
                                ✏️ Edit
                            </button>

                            <button
                                class="reset"
                                onclick="resetPassword('${siswa.id}')">
                                🔑 Reset
                            </button>

                            <button
                                class="delete"
                                onclick="hapusSiswa('${siswa.id}')">
                                🗑️ Hapus
                            </button>

                        </div>

                    </td>

                </tr>

            `;

        }).join("");

}


/* =====================================================
   SEARCH
===================================================== */

function filterSiswa(){

    const keyword =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    if(!keyword){

        tampilkanSiswa(
            semuaSiswa
        );

        return;

    }


    const hasil =
        semuaSiswa.filter(siswa => {

            return (

                (siswa.nama || "")
                .toLowerCase()
                .includes(keyword)

                ||

                (siswa.nisn || "")
                .toLowerCase()
                .includes(keyword)

                ||

                (siswa.kelas || "")
                .toLowerCase()
                .includes(keyword)

            );

        });


    tampilkanSiswa(
        hasil
    );

}


/* =====================================================
   TAMBAH
===================================================== */

function bukaTambah(){

    editId = null;

    document.getElementById(
        "modalTitle"
    ).textContent =
        "Tambah Siswa";


    document.getElementById(
        "nama"
    ).value = "";

    document.getElementById(
        "nisn"
    ).value = "";

    document.getElementById(
        "kelas"
    ).value = "";

    document.getElementById(
        "password"
    ).value = "";


    document.getElementById(
        "password"
    ).placeholder =
        "Password siswa";


    document.getElementById(
        "modal"
    ).style.display =
        "flex";

}


/* =====================================================
   EDIT
===================================================== */

function editSiswa(id){

    const siswa =
        semuaSiswa.find(
            item => item.id === id
        );


    if(!siswa){

        showMessage(
            "Data siswa tidak ditemukan.",
            "error"
        );

        return;

    }


    editId = id;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Edit Siswa";


    document.getElementById(
        "nama"
    ).value =
        siswa.nama || "";


    document.getElementById(
        "nisn"
    ).value =
        siswa.nisn || "";


    document.getElementById(
        "kelas"
    ).value =
        siswa.kelas || "";


    document.getElementById(
        "password"
    ).value =
        "";


    document.getElementById(
        "password"
    ).placeholder =
        "Kosongkan jika tidak diubah";


    document.getElementById(
        "modal"
    ).style.display =
        "flex";

}


/* =====================================================
   SIMPAN
===================================================== */

async function simpanSiswa(){

    const nama =
        document.getElementById("nama")
        .value
        .trim();

    const nisn =
        document.getElementById("nisn")
        .value
        .trim();

    const kelas =
        document.getElementById("kelas")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;


    if(!nama || !nisn || !kelas){

        alert(
            "Nama, NISN, dan kelas wajib diisi."
        );

        return;

    }


    try{

        /* TAMBAH */

        if(!editId){

            if(!password){

                alert(
                    "Password wajib diisi saat menambah siswa."
                );

                return;

            }


            const { data,error } =
                await supabaseClient
                .from("siswa")
                .insert({

                    nama:nama,

                    nisn:nisn,

                    kelas:kelas,

                    password:password

                })
                .select();


            if(error){

                console.error(error);

                alert(
                    "Gagal menambah siswa:\n" +
                    error.message
                );

                return;

            }


            showMessage(
                "Siswa berhasil ditambahkan.",
                "success"
            );

        }


        /* EDIT */

        else{

            const updateData = {

                nama:nama,

                nisn:nisn,

                kelas:kelas

            };


            if(password){

                updateData.password =
                    password;

            }


            const { error } =
                await supabaseClient
                .from("siswa")
                .update(updateData)
                .eq("id",editId);


            if(error){

                console.error(error);

                alert(
                    "Gagal mengubah siswa:\n" +
                    error.message
                );

                return;

            }


            showMessage(
                "Data siswa berhasil diperbarui.",
                "success"
            );

        }


        tutupModal();

        await loadSiswa();


    }catch(error){

        console.error(error);

        alert(
            "Terjadi kesalahan:\n" +
            error.message
        );

    }

}


/* =====================================================
   RESET PASSWORD
===================================================== */

async function resetPassword(id){

    const siswa =
        semuaSiswa.find(
            item => item.id === id
        );


    if(!siswa){

        return;

    }


    const passwordBaru =
        prompt(
            "Masukkan password baru untuk " +
            siswa.nama
        );


    if(passwordBaru === null){

        return;

    }


    if(!passwordBaru.trim()){

        alert(
            "Password tidak boleh kosong."
        );

        return;

    }


    try{

        const { error } =
            await supabaseClient
            .from("siswa")
            .update({

                password:
                    passwordBaru.trim()

            })
            .eq("id",id);


        if(error){

            console.error(error);

            alert(
                "Gagal reset password:\n" +
                error.message
            );

            return;

        }


        showMessage(
            "Password " +
            siswa.nama +
            " berhasil diubah.",
            "success"
        );


        await loadSiswa();


    }catch(error){

        alert(
            "Terjadi kesalahan:\n" +
            error.message
        );

    }

}


/* =====================================================
   HAPUS
===================================================== */

async function hapusSiswa(id){

    const siswa =
        semuaSiswa.find(
            item => item.id === id
        );


    if(!siswa){

        return;

    }


    const yakin =
        confirm(
            "Hapus siswa \"" +
            siswa.nama +
            "\"?\n\n" +
            "Data yang dihapus tidak dapat dikembalikan."
        );


    if(!yakin){

        return;

    }


    try{

        const { error } =
            await supabaseClient
            .from("siswa")
            .delete()
            .eq("id",id);


        if(error){

            console.error(error);

            alert(
                "Gagal menghapus siswa:\n" +
                error.message
            );

            return;

        }


        showMessage(
            "Siswa berhasil dihapus.",
            "success"
        );


        await loadSiswa();


    }catch(error){

        alert(
            "Terjadi kesalahan:\n" +
            error.message
        );

    }

}


/* =====================================================
   MODAL
===================================================== */

function tutupModal(){

    document.getElementById(
        "modal"
    ).style.display =
        "none";

    editId = null;

}


/* =====================================================
   DASHBOARD
===================================================== */

function kembaliDashboard(){

    window.location.href =
        "admin.html";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   LOAD AWAL
===================================================== */

loadSiswa();

</script>

</body>
</html>
```
