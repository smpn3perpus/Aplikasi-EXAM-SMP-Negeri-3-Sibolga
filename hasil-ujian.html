<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasil Ujian - EXAM SMPN 3 Sibolga</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- Header -->
  <header class="bg-slate-900 text-white shadow-md">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold">Rekapitulasi Hasil Ujian</h1>
        <p class="text-xs text-slate-400">Aplikasi EXAM SMP Negeri 3 Sibolga</p>
      </div>
      <button onclick="history.back()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
        Kembali
      </button>
    </div>
  </header>

  <!-- Konten Utama -->
  <main class="container mx-auto px-4 py-6">
    <!-- Filter & Statistik Ringkas -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="w-full md:w-1/3">
        <label class="block text-xs font-semibold text-slate-500 mb-1">Pilih Ujian / Mata Pelajaran</label>
        <select id="filterUjian" class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="all">Semua Ujian</option>
        </select>
      </div>
      <div class="flex gap-4 w-full md:w-auto justify-end">
        <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
          Cetak Rekap (PDF)
        </button>
      </div>
    </div>

    <!-- Tabel Hasil Ujian -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-lg font-bold text-slate-800 mb-4">Daftar Nilai Siswa</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm border-collapse">
          <thead>
            <tr class="bg-slate-100 text-slate-600 border-b">
              <th class="p-3">NISN / ID</th>
              <th class="p-3">Nama Siswa</th>
              <th class="p-3">Mata Pelajaran</th>
              <th class="p-3 text-center">Benar</th>
              <th class="p-3 text-center">Salah</th>
              <th class="p-3 text-center">Nilai Akhir</th>
            </tr>
          </thead>
          <tbody id="listHasil">
            <tr class="border-b">
              <td class="p-3 text-slate-500 text-center" colspan="6">Belum ada data nilai yang terekam.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT_URL.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>
</body>
</html>
