<!DOCTYPE html>

<body>

  <div class="login-box">

    <div class="logo">EX</div>

    <h1>LOGIN UJIAN</h1>

    <div class="school">
      SMP Negeri 3 Sibolga
    </div>

    <div class="roles">
      <button class="role-btn active" data-role="admin">
        Admin
      </button>

      <button class="role-btn" data-role="guru">
        Guru
      </button>

      <button class="role-btn" data-role="siswa">
        Siswa
      </button>
    </div>

    <form id="loginForm">

      <label id="identifierLabel">
        Username Admin
      </label>

      <input
        id="identifier"
        type="text"
        placeholder="Masukkan username"
        autocomplete="username"
        required
      >

      <label>
        Password
      </label>

      <div class="password-wrap">

        <input
          id="password"
          type="password"
          placeholder="Masukkan password"
          autocomplete="current-password"
          required
        >

        <button
          type="button"
          class="show-password"
          id="showPassword"
        >
          👁
        </button>

      </div>

      <button
        type="submit"
        class="login-btn"
        id="loginButton"
      >
        SIGN IN
      </button>

      <div
        id="message"
        class="message"
      ></div>

    </form>

    <div class="info">
      Sistem Ujian Online<br>
      SMP Negeri 3 Sibolga
    </div>

  </div>


<script>

  /*
   * =========================================
   * KONFIGURASI SUPABASE
   * =========================================
   */

  const SUPABASE_URL =
    "https://sztfucrmjexoalyiwwnq.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_j724cUM7NNHl8wbxq9ZHKw_FLFJAuGn";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  /*
   * =========================================
   * ELEMENT
   * =========================================
   */

  const loginForm =
    document.getElementById("loginForm");

  const identifierInput =
    document.getElementById("identifier");

  const passwordInput =
    document.getElementById("password");

  const identifierLabel =
    document.getElementById("identifierLabel");

  const loginButton =
    document.getElementById("loginButton");

  const message =
    document.getElementById("message");

  const showPassword =
    document.getElementById("showPassword");


  let selectedRole = "admin";


  /*
   * =========================================
   * PILIH ROLE
   * =========================================
   */

  document.querySelectorAll(".role-btn")
    .forEach(button => {

      button.addEventListener("click", () => {

        document
          .querySelectorAll(".role-btn")
          .forEach(btn =>
            btn.classList.remove("active")
          );

        button.classList.add("active");

        selectedRole =
          button.dataset.role;


        if (selectedRole === "admin") {

          identifierLabel.textContent =
            "Username Admin";

          identifierInput.placeholder =
            "Masukkan username";

        }

        else if (selectedRole === "guru") {

          identifierLabel.textContent =
            "NIP / NIK";

          identifierInput.placeholder =
            "Masukkan NIP / NIK";

        }

        else {

          identifierLabel.textContent =
            "NISN";

          identifierInput.placeholder =
            "Masukkan NISN";

        }

      });

    });


  /*
   * =========================================
   * LIHAT PASSWORD
   * =========================================
   */

  showPassword.addEventListener("click", () => {

    if (passwordInput.type === "password") {

      passwordInput.type = "text";
      showPassword.textContent = "🙈";

    } else {

      passwordInput.type = "password";
      showPassword.textContent = "👁";

    }

  });


  /*
   * =========================================
   * PESAN
   * =========================================
   */

  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;

  }


  /*
   * =========================================
   * LOGIN
   * =========================================
   */

  loginForm.addEventListener("submit", async (event) => {

    event.preventDefault();


    const identifier =
      identifierInput.value.trim();

    const password =
      passwordInput.value;


    if (!identifier || !password) {

      showMessage(
        "Username/NIP/NISN dan password wajib diisi.",
        "error"
      );

      return;

    }


    loginButton.disabled = true;

    loginButton.textContent =
      "MEMPROSES...";


    try {


      /*
       * ADMIN
       *
       * Admin menggunakan:
       * admin1
       * admin2
       *
       * Email Auth:
       * admin1@smp3.id
       * admin2@smp3.id
       */

      if (selectedRole === "admin") {

        const email =
          identifier.toLowerCase() +
          "@smp3.id";


        const { data, error } =
          await supabaseClient.auth
            .signInWithPassword({

              email: email,

              password: password

            });


        if (error) {

          throw error;

        }


        if (!data.user) {

          throw new Error(
            "Akun Admin tidak ditemukan."
          );

        }


        localStorage.setItem(
          "exam_role",
          "admin"
        );

        localStorage.setItem(
          "exam_user_id",
          data.user.id
        );


        showMessage(
          "Login Admin berhasil. Membuka dashboard...",
          "success"
        );


        setTimeout(() => {

          window.location.href =
            "admin.html";

        }, 700);


        return;

      }


      /*
       * GURU / SISWA
       *
       * Untuk sementara belum diaktifkan
       * karena akun Auth Guru/Siswa belum ada.
       */

      showMessage(
        "Login Guru/Siswa belum diaktifkan. Kita selesaikan akun Auth Guru/Siswa setelah login Admin berhasil.",
        "error"
      );


    }

    catch (error) {

      console.error(error);

      showMessage(
        error.message ||
        "Login gagal. Periksa username dan password.",
        "error"
      );

    }

    finally {

      loginButton.disabled = false;

      loginButton.textContent =
        "SIGN IN";

    }

  });

</script>

</body>
</html>
