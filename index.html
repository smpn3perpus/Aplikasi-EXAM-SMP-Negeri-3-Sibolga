<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - EXAM SMPN 3 Sibolga</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md border border-slate-200">
    <!-- Logo & Title -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-blue-900">EXAM SMPN 3 Sibolga</h1>
      <p class="text-xs text-slate-500 mt-1">Sistem Ujian & Pengelolaan Nilai Online</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email / Akun</label>
        <input type="email" id="emailInput" required placeholder="admin@smpn3sibolga.sch.id" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Kata Sandi</label>
        <input type="password" id="passwordInput" required placeholder="••••••••" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
      </div>
      
      <button type="submit" id="btnLogin" class="w-full bg-blue-900 hover:bg-blue-800 text-white py-2.5 rounded-lg text-sm font-semibold transition">
        Masuk Sistem
      </button>
    </form>

    <div id="alertMsg" class="mt-4 text-xs text-center hidden p-2 rounded-lg"></div>
  </div>

  <script>
    // Sesuaikan dengan URL & Anon Key Supabase Anda
    const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT_URL.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;
      const alertMsg = document.getElementById('alertMsg');

      alertMsg.className = 'mt-4 text-xs text-center p-2 rounded-lg bg-blue-100 text-blue-700 block';
      alertMsg.textContent = 'Memverifikasi akun...';

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        alertMsg.className = 'mt-4 text-xs text-center p-2 rounded-lg bg-red-100 text-red-700 block';
        alertMsg.textContent = 'Gagal masuk: ' + error.message;
        return;
      }

      alertMsg.className = 'mt-4 text-xs text-center p-2 rounded-lg bg-emerald-100 text-emerald-700 block';
      alertMsg.textContent = 'Login berhasil! Mengalihkan ke halaman Admin...';

      setTimeout(() => {
        window.location.href = 'admin.html';
      }, 1200);
    });
  </script>
</body>
</html>
