<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EXAM SMPN 3 Sibolga - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-blue-900">EXAM SMPN 3 Sibolga</h1>
      <p class="text-sm text-gray-500">Sistem Ujian & Pengelolaan Nilai Online</p>
    </div>

    <form onsubmit="prosesLogin(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email / Akun</label>
        <input type="email" id="email" required placeholder="nama@guru.smp.belajar.id" 
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Kata Sandi</label>
        <input type="password" id="password" required placeholder="••••••••" 
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <button type="submit" id="btn-login"
        class="w-full bg-blue-900 hover:bg-blue-800 text-white font-semibold py-2.5 rounded-lg transition">
        Masuk Sistem
      </button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://sztfucrmjexoalyiwwnq.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_j724cUM7NNHl8wbxq9ZHKw_FLFJAuGn';

    const { createClient } = window.supabase;
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function prosesLogin(event) {
      event.preventDefault();
      const btn = document.getElementById('btn-login');
      btn.innerText = 'Memproses...';
      btn.disabled = true;

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (authError) {
        alert('Gagal Login: ' + authError.message);
        btn.innerText = 'Masuk Sistem';
        btn.disabled = false;
        return;
      }

      const userId = authData.user.id;
      const { data: profile, error: profileError } = await supabase
        .from('profiles')
        .select('role')
        .eq('user_id', userId)
        .single();

      if (profileError || !profile) {
        alert('Data role tidak ditemukan di tabel profiles!');
        btn.innerText = 'Masuk Sistem';
        btn.disabled = false;
        return;
      }

      // Pengarahan Otomatis Berdasarkan Peran Akun
      if (profile.role === 'admin') window.location.href = 'admin.html';
      else if (profile.role === 'guru') window.location.href = 'guru.html';
      else if (profile.role === 'siswa') window.location.href = 'siswa.html';
      else alert('Role akun tidak terdaftar!');
    }
  </script>
</body>
</html>
