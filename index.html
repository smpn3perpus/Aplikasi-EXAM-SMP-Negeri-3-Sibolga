<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EXAM SMPN 3 Sibolga</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-blue-900">EXAM SMPN 3 Sibolga</h1>
      <p class="text-sm text-gray-500">Sistem Ujian & Pengelolaan Nilai</p>
    </div>

    <!-- Pilihan Tab Navigasi -->
    <div class="flex border-b mb-6">
      <button id="tab-login" onclick="switchTab('login')" class="w-1/2 py-2 font-semibold text-blue-900 border-b-2 border-blue-900">Masuk</button>
      <button id="tab-aktivasi" onclick="switchTab('aktivasi')" class="w-1/2 py-2 font-semibold text-gray-400">Aktivasi Siswa</button>
    </div>

    <!-- Form 1: Login (Admin / Guru / Siswa Terdaftar) -->
    <form id="form-login" onsubmit="prosesLogin(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email / ID Akun</label>
        <input type="text" id="login-id" required placeholder="Email atau NISN@smpn3.id" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Kata Sandi</label>
        <input type="password" id="login-pass" required placeholder="••••••••" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <button type="submit" id="btn-login" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-semibold py-2.5 rounded-lg">Masuk Sistem</button>
    </form>

    <!-- Form 2: Aktivasi Siswa Baru (Bikin Password Sendiri) -->
    <form id="form-aktivasi" onsubmit="prosesAktivasiSiswa(event)" class="space-y-4 hidden">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Masukkan NISN</label>
        <input type="text" id="akt-nisn" required placeholder="Contoh: 0081234567" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Buat Kata Sandi Baru</label>
        <input type="password" id="akt-pass" minlength="6" required placeholder="Minimal 6 Karakter" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <button type="submit" id="btn-aktivasi" class="w-full bg-green-700 hover:bg-green-800 text-white font-semibold py-2.5 rounded-lg">Aktivasi & Buat Akun</button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://sztfucrmjexoalyiwwnq.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_j724cUM7NNHl8wbxq9ZHKw_FLFJAuGn';
    const { createClient } = window.supabase;
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function switchTab(tab) {
      if (tab === 'login') {
        document.getElementById('form-login').classList.remove('hidden');
        document.getElementById('form-aktivasi').classList.add('hidden');
        document.getElementById('tab-login').className = "w-1/2 py-2 font-semibold text-blue-900 border-b-2 border-blue-900";
        document.getElementById('tab-aktivasi').className = "w-1/2 py-2 font-semibold text-gray-400";
      } else {
        document.getElementById('form-login').classList.add('hidden');
        document.getElementById('form-aktivasi').classList.remove('hidden');
        document.getElementById('tab-aktivasi').className = "w-1/2 py-2 font-semibold text-blue-900 border-b-2 border-blue-900";
        document.getElementById('tab-login').className = "w-1/2 py-2 font-semibold text-gray-400";
      }
    }

    async function prosesLogin(e) {
      e.preventDefault();
      let inputId = document.getElementById('login-id').value.trim();
      const password = document.getElementById('login-pass').value.trim();

      // Format email jika login pakai NISN
      if (!inputId.includes('@')) inputId = `${inputId}@smpn3.id`;

      const { data, error } = await supabase.auth.signInWithPassword({ email: inputId, password: password });
      if (error) return alert('Gagal Login: ' + error.message);

      const { data: profile } = await supabase.from('profiles').select('role').eq('user_id', data.user.id).single();
      if (profile?.role === 'admin') window.location.href = 'admin.html';
      else if (profile?.role === 'guru') window.location.href = 'guru.html';
      else if (profile?.role === 'siswa') window.location.href = 'siswa.html';
      else alert('Role tidak ditemukan');
    }

    async function prosesAktivasiSiswa(e) {
      e.preventDefault();
      const nisn = document.getElementById('akt-nisn').value.trim();
      const password = document.getElementById('akt-pass').value.trim();
      const email = `${nisn}@smpn3.id`;

      // Cek apakah NISN terdaftar di master siswa
      const { data: siswa, error } = await supabase.from('siswa_master').select('*').eq('nisn', nisn).single();
      if (error || !siswa) return alert('NISN tidak terdaftar di sistem! Hubungi Admin.');
      if (siswa.is_active) return alert('NISN ini sudah memiliki password. Silakan langsung Login.');

      // Pendaftaran Akun Auth Baru untuk Siswa
      const { data: auth, error: authErr } = await supabase.auth.signUp({ email: email, password: password });
      if (authErr) return alert('Gagal Aktivasi: ' + authErr.message);

      // Simpan Ke Profiles & Update Status Master
      await supabase.from('profiles').insert([{ user_id: auth.user.id, nama: siswa.nama, role: 'siswa', nisn_nip: nisn }]);
      await supabase.from('siswa_master').update({ is_active: true }).eq('nisn', nisn);

      alert('Aktivasi Berhasil! Silakan masuk menggunakan NISN dan Password Anda.');
      switchTab('login');
    }
  </script>
</body>
</html>
