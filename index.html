<script>

  // =====================================================
  // SUPABASE
  // =====================================================

  const SUPABASE_URL =
    'https://sztfucrmjexoalyiwwnq.supabase.co';

  const SUPABASE_ANON_KEY =
    'sb_publishable_j724cUM7NNHl8wbxq9ZHKw_FLFJAuGn';

  const { createClient } = window.supabase;

  const supabaseClient =
    createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  // =====================================================
  // TAB
  // =====================================================

  function switchTab(tab) {

    const signin =
      document.getElementById('signin-section');

    const signup =
      document.getElementById('signup-section');

    const forgot =
      document.getElementById('forgot-section');

    const tabSignin =
      document.getElementById('tab-signin');

    const tabSignup =
      document.getElementById('tab-signup');

    forgot.classList.add('hidden');


    if (tab === 'signin') {

      signin.classList.remove('hidden');
      signup.classList.add('hidden');

      tabSignin.className =
        'w-1/2 py-3 font-bold tab-active';

      tabSignup.className =
        'w-1/2 py-3 font-bold tab-inactive';

    } else {

      signin.classList.add('hidden');
      signup.classList.remove('hidden');

      tabSignin.className =
        'w-1/2 py-3 font-bold tab-inactive';

      tabSignup.className =
        'w-1/2 py-3 font-bold tab-active';

    }

  }


  // =====================================================
  // LOGIN PLACEHOLDER
  // =====================================================

  function ubahLoginPlaceholder() {

    const role =
      document.getElementById('login-role').value;

    const label =
      document.getElementById('login-id-label');

    const input =
      document.getElementById('login-id');


    if (role === 'admin') {

      label.innerText = 'Email Admin';

      input.placeholder =
        'Contoh: admin1@smp3.id';

    }

    else if (role === 'guru') {

      label.innerText = 'NIP / NIK';

      input.placeholder =
        'Masukkan NIP / NIK';

    }

    else {

      label.innerText = 'NISN';

      input.placeholder =
        'Masukkan NISN';

    }

  }


  // =====================================================
  // LOGIN
  // =====================================================

  async function prosesLogin() {

    const role =
      document.getElementById('login-role').value;

    const identitas =
      document.getElementById('login-id').value.trim();

    const password =
      document.getElementById('login-pass').value;


    if (!identitas || !password) {

      alert(
        'Silakan isi ID akun dan password.'
      );

      return;

    }


    let email = identitas;


    // Guru / siswa menggunakan identitas@smp3.id

    if (role !== 'admin' && !email.includes('@')) {

      email =
        identitas + '@smp3.id';

    }


    const btn =
      document.getElementById('btn-login');

    btn.disabled = true;
    btn.innerText = 'MEMERIKSA...';


    try {

      const { data, error } =
        await supabaseClient.auth
          .signInWithPassword({

            email: email,

            password: password

          });


      if (error) {

        alert(
          'Login gagal:\n\n' +
          error.message
        );

        return;

      }


      if (!data.user) {

        alert(
          'Akun tidak ditemukan.'
        );

        return;

      }


      // ===============================================
      // PROFILE
      // ===============================================

      const { data: profile, error: profileError } =
        await supabaseClient
          .from('profiles')
          .select('*')
          .eq('user_id', data.user.id)
          .maybeSingle();


      if (profileError) {

        alert(
          'Gagal membaca profil:\n\n' +
          profileError.message
        );

        await supabaseClient.auth.signOut();

        return;

      }


      if (!profile) {

        alert(
          'Profil akun belum tersedia.\n\n' +
          'Hubungi Admin.'
        );

        await supabaseClient.auth.signOut();

        return;

      }


      // ===============================================
      // VALIDASI ROLE
      // ===============================================

      if (profile.role !== role) {

        alert(
          'Akun ini terdaftar sebagai ' +
          String(profile.role).toUpperCase() +
          ', bukan ' +
          role.toUpperCase() +
          '.'
        );

        await supabaseClient.auth.signOut();

        return;

      }


      // ===============================================
      // REDIRECT
      // ===============================================

      if (role === 'admin') {

        window.location.href =
          'admin.html';

      }

      else if (role === 'guru') {

        window.location.href =
          'guru.html';

      }

      else {

        window.location.href =
          'siswa.html';

      }

    }

    finally {

      btn.disabled = false;
      btn.innerText = 'SIGN IN';

    }

  }


  // =====================================================
  // FORM SIGN UP
  // =====================================================

  function ubahFormSignup() {

    const role =
      document.getElementById('signup-role').value;

    const guru =
      document.getElementById('form-guru');

    const siswa =
      document.getElementById('form-siswa');


    if (role === 'guru') {

      guru.classList.remove('hidden');
      siswa.classList.add('hidden');

    }

    else {

      guru.classList.add('hidden');
      siswa.classList.remove('hidden');

    }

  }


  // =====================================================
  // SIGN UP
  // =====================================================

  async function prosesSignup() {

    const role =
      document.getElementById('signup-role').value;

    const password =
      document.getElementById('signup-password').value;

    const confirm =
      document.getElementById('signup-password-confirm').value;


    if (password.length < 6) {

      alert(
        'Password minimal 6 karakter.'
      );

      return;

    }


    if (password !== confirm) {

      alert(
        'Konfirmasi password tidak sama.'
      );

      return;

    }


    let identitas = '';
    let table = '';
    let field = '';


    // ===============================================
    // GURU
    // ===============================================

    if (role === 'guru') {

      identitas =
        document.getElementById('signup-nip')
          .value.trim();

      if (!identitas) {

        alert(
          'Masukkan NIP atau NIK.'
        );

        return;

      }

      table = 'guru_master';

      // KOLOM DATABASE YANG BENAR
      field = 'nip_nik';

    }


    // ===============================================
    // SISWA
    // ===============================================

    else {

      identitas =
        document.getElementById('signup-nisn')
          .value.trim();

      if (!identitas) {

        alert(
          'Masukkan NISN.'
        );

        return;

      }

      table = 'siswa_master';

      field = 'nisn';

    }


    const btn =
      document.getElementById('btn-signup');

    btn.disabled = true;
    btn.innerText = 'MEMERIKSA...';


    try {

      // =============================================
      // CARI DATA MASTER
      // =============================================

      const { data: master, error: masterError } =
        await supabaseClient
          .from(table)
          .select('*')
          .eq(field, identitas)
          .maybeSingle();


      if (masterError) {

        alert(
          'Gagal memeriksa database:\n\n' +
          masterError.message
        );

        return;

      }


      if (!master) {

        alert(
          (role === 'guru'
            ? 'NIP/NIK'
            : 'NISN') +
          ' tidak ditemukan dalam database sekolah.\n\n' +
          'Silakan hubungi Admin.'
        );

        return;

      }


      // =============================================
      // SUDAH AKTIF
      // =============================================

      if (master.is_active === true) {

        alert(
          'Akun ini sudah pernah didaftarkan.\n\n' +
          'Silakan gunakan SIGN IN atau Lupa Password.'
        );

        return;

      }


      const nama =
        master.nama || '';


      const email =
        identitas + '@smp3.id';


      // =============================================
      // BUAT SUPABASE AUTH
      // =============================================

      btn.innerText =
        'MEMBUAT AKUN...';


      const { data: authData, error: authError } =
        await supabaseClient.auth
          .signUp({

            email: email,

            password: password

          });


      if (authError) {

        alert(
          'Gagal membuat akun:\n\n' +
          authError.message
        );

        return;

      }


      if (!authData.user) {

        alert(
          'Akun belum berhasil dibuat.'
        );

        return;

      }


      // =============================================
      // BUAT PROFILE
      // =============================================

      const { error: profileError } =
        await supabaseClient
          .from('profiles')
          .insert({

            user_id: authData.user.id,

            nama: nama,

            role: role,

            nisn_nip: identitas

          });


      if (profileError) {

        alert(
          'Akun Auth berhasil dibuat tetapi profile gagal disimpan:\n\n' +
          profileError.message
        );

        return;

      }


      // =============================================
      // UPDATE MASTER
      // =============================================

      const { error: updateError } =
        await supabaseClient
          .from(table)
          .update({

            is_active: true,

            user_id: authData.user.id

          })
          .eq(field, identitas);


      if (updateError) {

        alert(
          'Akun berhasil dibuat tetapi data master gagal diperbarui:\n\n' +
          updateError.message
        );

        return;

      }


      await supabaseClient.auth.signOut();


      alert(
        'SIGN UP BERHASIL! 🎉\n\n' +

        'Akun ' +
        role.toUpperCase() +
        ' berhasil dibuat.\n\n' +

        'Silakan SIGN IN menggunakan ' +

        (role === 'guru'
          ? 'NIP/NIK'
          : 'NISN') +

        ' dan password yang baru dibuat.'
      );


      document.getElementById(
        'signup-password'
      ).value = '';

      document.getElementById(
        'signup-password-confirm'
      ).value = '';

      switchTab('signin');

    }

    finally {

      btn.disabled = false;
      btn.innerText = 'SIGN UP';

    }

  }


  // =====================================================
  // LUPA PASSWORD
  // =====================================================

  function showForgotPassword() {

    document.getElementById(
      'signin-section'
    ).classList.add('hidden');

    document.getElementById(
      'signup-section'
    ).classList.add('hidden');

    document.getElementById(
      'forgot-section'
    ).classList.remove('hidden');

  }


  function showSignin() {

    document.getElementById(
      'forgot-section'
    ).classList.add('hidden');

    document.getElementById(
      'signin-section'
    ).classList.remove('hidden');

  }


  // =====================================================
  // FORGOT ROLE
  // =====================================================

  document.getElementById('forgot-role')
    .addEventListener(
      'change',
      function() {

        const label =
          document.getElementById(
            'forgot-id-label'
          );

        const input =
          document.getElementById(
            'forgot-id'
          );


        if (this.value === 'guru') {

          label.innerText =
            'NIP / NIK';

          input.placeholder =
            'Masukkan NIP / NIK';

        }

        else {

          label.innerText =
            'NISN';

          input.placeholder =
            'Masukkan NISN';

        }

      }
    );


  // =====================================================
  // PROSES LUPA PASSWORD
  // =====================================================

  async function prosesLupaPassword() {

    const role =
      document.getElementById(
        'forgot-role'
      ).value;

    const identitas =
      document.getElementById(
        'forgot-id'
      ).value.trim();


    if (!identitas) {

      alert(
        'Masukkan ' +
        (role === 'guru'
          ? 'NIP/NIK.'
          : 'NISN.')
      );

      return;

    }


    const table =
      role === 'guru'
        ? 'guru_master'
        : 'siswa_master';


    const field =
      role === 'guru'
        ? 'nip_nik'
        : 'nisn';


    const btn =
      document.getElementById(
        'btn-forgot'
      );

    btn.disabled = true;
    btn.innerText =
      'MEMERIKSA...';


    try {

      // =============================================
      // CEK MASTER
      // =============================================

      const { data: master, error } =
        await supabaseClient
          .from(table)
          .select('user_id,' + field + ',is_active')
          .eq(field, identitas)
          .maybeSingle();


      if (error) {

        alert(
          'Gagal memeriksa data:\n\n' +
          error.message
        );

        return;

      }


      if (!master) {

        alert(
          (role === 'guru'
            ? 'NIP/NIK'
            : 'NISN') +
          ' tidak ditemukan.'
        );

        return;

      }


      if (!master.user_id) {

        alert(
          'Akun ini belum melakukan SIGN UP.\n\n' +
          'Silakan daftar terlebih dahulu.'
        );

        return;

      }


      const email =
        identitas + '@smp3.id';


      btn.innerText =
        'MENGIRIM LINK...';


      // =============================================
      // RESET PASSWORD
      // =============================================

      const { error: resetError } =
        await supabaseClient.auth
          .resetPasswordForEmail(
            email,
            {
              redirectTo:
                window.location.origin +
                '/reset-password.html'
            }
          );


      if (resetError) {

        alert(
          'Gagal mengirim link reset:\n\n' +
          resetError.message
        );

        return;

      }


      alert(
        'Link reset password sudah dikirim.\n\n' +
        'Silakan periksa email akun Anda.'
      );

    }

    finally {

      btn.disabled = false;

      btn.innerText =
        'KIRIM LINK RESET PASSWORD';

    }

  }


  // =====================================================
  // DEFAULT
  // =====================================================

  ubahLoginPlaceholder();

  ubahFormSignup();

</script>

</body>
</html>
