<!-- Pustaka Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // Konfigurasi Supabase
  const SUPABASE_URL = 'https://sztfucrmjexoalyiwwnq.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_j724cUM7NNHl8wbxq9ZHKw_FLFJAuGn';

  const { createClient } = window.supabase;
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Fungsi Login Otomatis Berdasarkan Role
  async function prosesLogin(event) {
    event.preventDefault(); // Mencegah reload halaman

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    // 1. Verifikasi Email & Password ke Supabase Auth
    const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (authError) {
      alert('Login Gagal: ' + authError.message);
      return;
    }

    // 2. Ambil Role Pengguna dari Tabel Profiles
    const userId = authData.user.id;
    const { data: profile, error: profileError } = await supabase
      .from('profiles')
      .select('nama, role')
      .eq('user_id', userId)
      .single();

    if (profileError || !profile) {
      alert('Login Berhasil, tetapi data profil/role belum terdaftar di tabel profiles!');
      return;
    }

    // 3. Pengarahan Halaman Otomatis Sesuai Role
    if (profile.role === 'admin') {
      window.location.href = 'admin.html';
    } else if (profile.role === 'guru') {
      window.location.href = 'guru.html';
    } else if (profile.role === 'siswa') {
      window.location.href = 'siswa.html';
    } else {
      alert('Role tidak dikenali: ' + profile.role);
    }
  }
</script>
