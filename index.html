```html
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EXAM - Sistem Ujian Online</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

}

    width:100%;

}

    text-align:center;

}

.logo-icon{
    width:75px;
    height:75px;
    margin:auto;
    border-radius:20px;
    background:#2563eb;
    color:white;

    align-items:center;
    justify-content:center;
    font-size:32px;
    font-weight:bold;
}

.logo h1{
    margin-top:15px;
    color:#172554;
    font-size:28px;
}

.logo p{
    margin-top:6px;
    color:#64748b;
    font-size:14px;
}

.tabs{
    display:flex;
    gap:4px;
    background:#f1f5f9;
    padding:4px;
    border-radius:12px;
    margin-bottom:22px;
}

.tabs button{
    flex:1;
    border:0;
    padding:12px 5px;
    border-radius:9px;
    background:transparent;
    color:#64748b;

    cursor:pointer;
}

    background:#2563eb;

}

    margin-bottom:17px;

.form-group label{
    display:block;

}

    width:100%;
    padding:13px 14px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    outline:none;
    font-size:15px;
}

    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.12);

    position:relative;

    padding-right:48px;

</head>

<body>

<div class="container">

    <div class="logo">
        <div class="logo-icon">EX</div>
        <h1>EXAM</h1>
        <p>Sistem Ujian Online</p>
    </div>

    <div class="tabs">

        <button
            id="guruTab"
            class="active"
            onclick="setRole('guru')">
            👨‍🏫 Guru
        </button>

        <button
            id="siswaTab"
            onclick="setRole('siswa')">
            👨‍🎓 Siswa
        </button>

        <button
            id="adminTab"
            onclick="setRole('admin')">
            🔐 Admin
        </button>

    </div>

    <div id="message" class="message"></div>

    <form id="loginForm">

        <div class="form-group">

            <label id="usernameLabel">
                NIP / NIK
            </label>

            <input
                type="text"
                id="username"
                placeholder="Masukkan NIP / NIK"
                autocomplete="username"
                required
            >

        </div>

        <div class="form-group">

            <label>Password</label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Masukkan password"
                    autocomplete="current-password"
                    required
                >

                <span
                    class="eye"
                    id="eye"
                    onclick="togglePassword()">
                    👁️
                </span>

            </div>

        </div>

        <button
            type="submit"
            class="login-btn"
            id="loginBtn">
            Masuk
        </button>

    </form>

    <div class="info" id="loginInfo">
        👨‍🏫 <b>Login Guru</b><br>
        Gunakan NIP/NIK sebagai username dan password Anda.
    </div>

    <div class="footer">
        Sistem Ujian Online<br>
        SMP Negeri 3 Sibolga<br><br>
        <b>Dibuat oleh Mr. Rahmat Batubara, S.T.P</b>
    </div>

</div>

<script>

/* =================================================
   KONFIGURASI SUPABASE
   ================================================= */

const SUPABASE_URL =
    "https://sztfucrmjexoalyiwwnq.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_j724cUM7NNHl8wbxq9ZHKw_FLFJAuGn";


/* =================================================
   VARIABEL
   ================================================= */

let currentRole = "guru";


/* =================================================
   PILIH ROLE
   ================================================= */

function setRole(role){

    currentRole = role;

    document.getElementById("guruTab")
        .classList.remove("active");

    document.getElementById("siswaTab")
        .classList.remove("active");

    document.getElementById("adminTab")
        .classList.remove("active");


    if(role === "guru"){

        document.getElementById("guruTab")
            .classList.add("active");

        document.getElementById("usernameLabel")
            .textContent = "NIP / NIK";

        document.getElementById("username")
            .placeholder = "Masukkan NIP / NIK";

        document.getElementById("loginInfo")
            .innerHTML =
            "👨‍🏫 <b>Login Guru</b><br>" +
            "Gunakan NIP/NIK sebagai username dan password Anda.";

    }


    else if(role === "siswa"){

        document.getElementById("siswaTab")
            .classList.add("active");

        document.getElementById("usernameLabel")
            .textContent = "NISN";

        document.getElementById("username")
            .placeholder = "Masukkan NISN";

        document.getElementById("loginInfo")
            .innerHTML =
            "👨‍🎓 <b>Login Siswa</b><br>" +
            "Gunakan NISN sebagai username dan password Anda.";

    }


    else{

        document.getElementById("adminTab")
            .classList.add("active");

        document.getElementById("usernameLabel")
            .textContent = "Username Admin";

        document.getElementById("username")
            .placeholder = "Masukkan username admin";

        document.getElementById("loginInfo")
            .innerHTML =
            "🔐 <b>Login Admin</b><br>" +
            "Masukkan username dan password admin.";

    }


    clearMessage();

    document.getElementById("username").focus();
}


/* =================================================
   TAMPILKAN PASSWORD
   ================================================= */

function togglePassword(){

    const password =
        document.getElementById("password");

    const eye =
        document.getElementById("eye");


    if(password.type === "password"){

        password.type = "text";
        eye.textContent = "🙈";

    }
    else{

        password.type = "password";
        eye.textContent = "👁️";

    }
}


/* =================================================
   PESAN
   ================================================= */

function showMessage(text,type){

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message " + type;
}


function clearMessage(){

    const message =
        document.getElementById("message");

    message.textContent = "";

    message.className = "message";
}


/* =================================================
   LOGIN
   ================================================= */

async function login(){

    const username =
        document.getElementById("username")
        .value.trim();

    const password =
        document.getElementById("password")
        .value;

    const button =
        document.getElementById("loginBtn");


    if(!username || !password){

        showMessage(
            "Username dan password wajib diisi.",
            "error"
        );

        return;
    }


    button.disabled = true;
    button.textContent = "Memproses...";


    try{

        let table = "";
        let column = "";
        let dashboard = "";


        if(currentRole === "guru"){

            table = "guru";
            column = "nip";
            dashboard = "dashboard-guru.html";

        }


        else if(currentRole === "siswa"){

            table = "siswa";
            column = "nisn";
            dashboard = "dashboard-siswa.html";

        }


        else{

            table = "admin";
            column = "username";
            dashboard = "admin.html";

        }


        /*
        =============================================
        CARI AKUN
        =============================================
        */

        const url =
            SUPABASE_URL +
            "/rest/v1/" +
            table +
            "?" +
            column +
            "=eq." +
            encodeURIComponent(username) +
            "&select=*";


        const response =
            await fetch(
                url,
                {
                    method:"GET",

                    headers:{
                        "apikey":
                            SUPABASE_ANON_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_ANON_KEY
                    }
                }
            );


        if(!response.ok){

            const errorText =
                await response.text();

            console.error(errorText);

            throw new Error(
                "Database tidak dapat diakses."
            );
        }


        const data =
            await response.json();


        if(!data || data.length === 0){

            showMessage(
                "Akun tidak ditemukan. Periksa NIP/NIK/NISN Anda.",
                "error"
            );

            return;
        }


        /*
        =============================================
        AKUN DITEMUKAN
        =============================================
        */

        const account = data[0];


        /*
        =============================================
        SIMPAN DATA LOGIN
        =============================================
        */

        localStorage.setItem(
            "exam_role",
            currentRole
        );

        localStorage.setItem(
            "exam_user",
            JSON.stringify(account)
        );


        showMessage(
            "Akun ditemukan. Membuka dashboard...",
            "success"
        );


        setTimeout(function(){

            window.location.href =
                dashboard;

        },700);

    }


    catch(error){

        console.error(error);

        showMessage(
            error.message ||
            "Terjadi kesalahan saat login.",
            "error"
        );

    }


    finally{

        button.disabled = false;
        button.textContent = "Masuk";

    }

}


/* =================================================
   FORM LOGIN
   ================================================= */

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        function(event){

            event.preventDefault();

            login();

        }
    );


/* =================================================
   DEFAULT
   ================================================= */

setRole("guru");

</script>

</body>
</html>
