  </div>

<script>

  // ==================================================
  // SUPABASE
  // ==================================================

  const SUPABASE_URL =
    'https://sztfucrmjexoalyiwwnq.supabase.co';

  const SUPABASE_ANON_KEY =
    'sb_publishable_j724cUM7NNHl8wbxq9ZHKw_FLFJAuGn';

  const { createClient } = window.supabase;

  const supabaseClient =
    createClient(SUPABASE_URL, SUPABASE_ANON_KEY);



  // ==================================================
  // TAB
  // ==================================================

  function switchTab(tab) {

    document.getElementById('signin-section')
      .classList.toggle('hidden', tab !== 'signin');

    document.getElementById('signup-section')
      .classList.toggle('hidden', tab !== 'signup');

    document.getElementById('forgot-section')
      .classList.add('hidden');


    document.getElementById('tab-signin').className =
      tab === 'signin'
        ? 'w-1/2 py-3 font-bold tab-active'
        : 'w-1/2 py-3 font-bold tab-inactive';


    document.getElementById('tab-signup').className =
      tab === 'signup'
        ? 'w-1/2 py-3 font-bold tab-active'
        : 'w-1/2 py-3 font-bold tab-inactive';

  }



  // ==================================================
  // SIGN IN
  // ==================================================

  async function prosesLogin() {

    const role =
      document.getElementById('login-role').value;

    let id =
      document.getElementById('login-id').value.trim();

    const password =
      document.getElementById('login-pass').value;


    if (!id || !password) {

      alert('Silakan isi ID akun dan password.');

      return;

    }


    // Login menggunakan email jika Admin
    // Guru/Siswa menggunakan NIP/NISN@smpn3.id

    if (!id.includes('@')) {

      id = id + '@smpn3.id';

    }


    const btn =
      document.getElementById('btn-login');

    btn.disabled = true;
    btn.innerText = 'Memproses...';


    const { data, error } =
      await supabaseClient.auth.signInWithPassword({

        email: id,
        password: password

      });


    if (error) {

      alert('Login gagal: ' + error.message);

      btn.disabled = false;
      btn.innerText = 'SIGN IN';

      return;

    }


    // Ambil profile

    const { data: profile, error: profileError } =
      await supabaseClient
        .from('profiles')
        .select('*')
        .eq('user_id', data.user.id)
        .single();


    if (profileError || !profile) {

      alert('Profil akun tidak ditemukan.');

      await supabaseClient.auth.signOut();

      btn.disabled = false;
      btn.innerText = 'SIGN IN';

      return;

    }


    // Pastikan role sesuai pilihan

    if (profile.role !== role) {

      alert(
        'Akun ini bukan akun ' +
        role.toUpperCase() +
        '.'
      );

      await supabaseClient.auth.signOut();

      btn.disabled = false;
      btn.innerText = 'SIGN IN';

      return;

    }


    // Arahkan sesuai role

    if (role === 'admin') {

      window.location.href = 'admin.html';

    }

    else if (role === 'guru') {

      window.location.href = 'guru.html';

    }

    else if (role === 'siswa') {

      window.location.href = 'siswa.html';

    }

  }



  // ==================================================
  // FORM SIGN UP
  // ==================================================

  function ubahFormSignup() {

    const role =
      document.getElementById('signup-role').value;


    document.getElementById('form-guru')
      .classList.toggle('hidden', role !== 'guru');

    document.getElementById('form-siswa')
      .classList.toggle('hidden', role !== 'siswa');

  }



  // ==================================================
  // SIGN UP GURU / SISWA
  // ==================================================

  async function prosesSignup() {

    const role =
      document.getElementById('signup-role').value;

    const password =
      document.getElementById('signup-password').value;

    const confirmPassword =
      document.getElementById('signup-password-confirm').value;


    if (password.length < 6) {

      alert('Password minimal 6 karakter.');

      return;

    }


    if (password !== confirmPassword) {

      alert('Konfirmasi password tidak sama.');

      return;

    }


    let identitas;
    let masterData;
    let email;


    // ==================================================
    // GURU - VALIDASI NIP
    // ==================================================

    if (role === 'guru') {

      identitas =
        document.getElementById('signup-nip').value.trim();


      if (!identitas) {

        alert('Masukkan NIP.');

        return;

      }


      const { data, error } =
        await supabaseClient
          .from('guru_master')
          .select('*')
          .eq('nip', identitas)
          .single();


      if (error || !data) {

        alert(
          'NIP tidak ditemukan dalam database sekolah.\n\n' +
          'Silakan hubungi Admin.'
        );

        return;

      }


      masterData = data;

      email = identitas + '@smpn3.id';

    }


    // ==================================================
    // SISWA - VALIDASI NISN
    // ==================================================

    else {

      identitas =
        document.getElementById('signup-nisn').value.trim();


      if (!identitas) {

        alert('Masukkan NISN.');

        return;

      }


      const { data, error } =
        await supabaseClient
          .from('siswa_master')
          .select('*')
          .eq('nisn', identitas)
          .single();


      if (error || !data) {

        alert(
          'NISN tidak ditemukan dalam database sekolah.\n\n' +
          'Silakan hubungi Admin.'
        );

        return;

      }


      masterData = data;

      email = identitas + '@smpn3.id';

    }


    // ==================================================
    // CEK APAKAH SUDAH AKTIF
    // ==================================================

    if (masterData.is_active === true) {

      alert(
        'Akun ini sudah pernah melakukan SIGN UP.\n\n' +
        'Silakan gunakan SIGN IN atau Lupa Password.'
      );

      return;

    }


    // ==================================================
    // BUAT AKUN SUPABASE AUTH
    // ==================================================

    const { data: authData, error: authError } =
      await supabaseClient.auth.signUp({

        email: email,

        password: password

      });


    if (authError) {

      alert(
        'Gagal membuat akun:\n' +
        authError.message
      );

      return;

    }


    if (!authData.user) {

      alert(
        'Akun belum berhasil dibuat.'
      );

      return;

    }


    // ==================================================
    // SIMPAN PROFILE
    // ==================================================

    const nama =
      masterData.nama || '';


    const { error: profileError } =
      await supabaseClient
        .from('profiles')
        .insert({

          user_id: authData.user.id,

          nama: nama,

          role: role,

          nisn_nip: identitas

        });


    if (profileError) {

      alert(
        'Akun berhasil dibuat tetapi profile gagal disimpan:\n' +
        profileError.message
      );

      return;

    }


    // ==================================================
    // UPDATE MASTER
    // ==================================================

    const table =
      role === 'guru'
        ? 'guru_master'
        : 'siswa_master';


    const field =
      role === 'guru'
        ? 'nip'
        : 'nisn';


    await supabaseClient
      .from(table)
      .update({

        is_active: true

      })
      .eq(field, identitas);


    alert(
      'SIGN UP BERHASIL!\n\n' +
      'Akun ' + role.toUpperCase() +
      ' sudah dibuat.\n\n' +
      'Silakan SIGN IN menggunakan ' +
      (role === 'guru' ? 'NIP' : 'NISN') +
      ' dan password yang baru dibuat.'
    );


    // Logout agar user masuk melalui form login

    await supabaseClient.auth.signOut();

    switchTab('signin');

  }



  // ==================================================
  // LUPA PASSWORD
  // ==================================================

  function showForgotPassword() {

    document.getElementById('signin-section')
      .classList.add('hidden');

    document.getElementById('signup-section')
      .classList.add('hidden');

    document.getElementById('forgot-section')
      .classList.remove('hidden');

  }



  function showSignin() {

    switchTab('signin');

  }



  // ==================================================
  // PROSES LUPA PASSWORD
  // ==================================================

  async function prosesLupaPassword() {

    const role =
      document.getElementById('forgot-role').value;

    const identitas =
      document.getElementById('forgot-id').value.trim();


    if (!identitas) {

      alert(
        'Masukkan NIP atau NISN.'
      );

      return;

    }


    let email;


    // Validasi identitas sebelum mengirim reset

    if (role === 'guru') {

      const { data, error } =
        await supabaseClient
          .from('guru_master')
          .select('nip')
          .eq('nip', identitas)
          .single();


      if (error || !data) {

        alert(
          'NIP tidak ditemukan.'
        );

        return;

      }


      email =
        identitas + '@smpn3.id';

    }

    else {

      const { data, error } =
        await supabaseClient
          .from('siswa_master')
          .select('nisn')
          .eq('nisn', identitas)
          .single();


      if (error || !data) {

        alert(
          'NISN tidak ditemukan.'
        );

        return;

      }


      email =
        identitas + '@smpn3.id';

    }


    const { error } =
      await supabaseClient.auth
        .resetPasswordForEmail(email, {

          redirectTo:
            window.location.origin +
            '/reset-password.html'

        });


    if (error) {

      alert(
        'Gagal mengirim link reset:\n' +
        error.message
      );

      return;

    }


    alert(
      'Link reset password sudah dikirim.\n\n' +
      'Silakan periksa email akun Anda.'
    );

  }



  // ==================================================
  // DEFAULT
  // ==================================================

  ubahFormSignup();

</script>
