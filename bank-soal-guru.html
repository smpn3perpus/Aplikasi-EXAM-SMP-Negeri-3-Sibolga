function showMessage(text, type) {

}


function hideMessage() {

    const el = document.getElementById("message");

    el.className = "message";
    el.textContent = "";
}


/*
   Escape teks biasa.
*/

function esc(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function escAttr(value) {
    return esc(value);
}


/*
   Bersihkan HTML menjadi teks biasa.
   Digunakan untuk membaca isi kolom soal.
*/

function stripHTML(html) {

    const div = document.createElement("div");

    div.innerHTML = String(html ?? "");

    return (div.textContent || div.innerText || "")
        .replace(/\s+/g, " ")
        .trim();
}


/*
   Normalisasi teks untuk analisis.
*/

function cleanText(value) {

    return stripHTML(value)
        .toLowerCase()
        .replace(/\s+/g, " ")
        .trim();
}


function countAny(text, words) {

    return words.reduce(
        (total, word) =>
            total + (text.includes(word) ? 1 : 0),
        0
    );
}

/* =========================================================
   DETEKSI LITERASI
   =========================================================

   SANGAT PENTING:

   Literasi HANYA dibaca dari:
       q.pertanyaan

   Tidak membaca:
       row.literasi
       literasi_soal
       stimulus database
       gambar stimulus database

   Jika HTML soal berisi teks bacaan, tabel, gambar,
   dialog, data, grafik, artikel, wacana, dll,
   maka dapat dianggap literasi.
   ========================================================= */

function detectLiterasi(q) {

    /*
       HANYA INI YANG DIBACA.
    */

    const html =
        String(q.pertanyaan || "");

    const text =
        cleanText(html);


    /*
       1. HTML memiliki elemen visual/data
       di DALAM KOLOM SOAL.
    */

    const hasHTMLLiteracyElement =

        /<img\b/i.test(html) ||

        /<table\b/i.test(html) ||

        /<figure\b/i.test(html) ||

        /<svg\b/i.test(html) ||

        /<canvas\b/i.test(html);


    if (hasHTMLLiteracyElement) {
        return true;
    }


    /*
       2. Frasa literasi pada isi SOAL.
    */

    const literacyWords = [

        "bacalah",
        "bacalah teks berikut",
        "cermati teks",
        "cermatilah teks",
        "perhatikan teks",
        "simak teks",

        "berdasarkan bacaan",
        "berdasarkan teks",
        "berdasarkan paragraf",
        "berdasarkan informasi",
        "berdasarkan wacana",
        "berdasarkan artikel",

        "teks berikut",
        "bacaan berikut",
        "paragraf berikut",
        "artikel berikut",
        "wacana berikut",
        "kutipan berikut",

        "perhatikan tabel",
        "berdasarkan tabel",
        "tabel berikut",

        "perhatikan grafik",
        "berdasarkan grafik",
        "grafik berikut",

        "perhatikan diagram",
        "berdasarkan diagram",
        "diagram berikut",

        "perhatikan gambar",
        "berdasarkan gambar",
        "gambar berikut",

        "ilustrasi berikut",
        "kasus berikut",

        "dialog berikut",
        "dialogue berikut",
        "percakapan berikut",
        "conversation berikut",

        "read the text",
        "read the following text",
        "based on the text",
        "according to the passage",
        "according to the text",
        "based on the information",
        "look at the table",
        "look at the picture",
        "read the dialogue",
        "following passage"
    ];


    if (
        countAny(
            text,
            literacyWords
        ) > 0
    ) {
        return true;
    }


    /*
       3. Deteksi pola bacaan langsung.

       Contoh:
       "Rina pergi ke sekolah..."
       kemudian pertanyaan meminta informasi
       dari bacaan tersebut.

       Panjang saja tidak otomatis selalu literasi.
       Digunakan bersama indikator struktur teks.
    */

    const hasReadingStructure =

        text.includes("berdasarkan") &&
        text.length >= 180;


    if (hasReadingStructure) {
        return true;
    }


    /*
       4. Dialog / percakapan dalam kolom soal.
    */

    const hasDialogue =

        /(^|\s)[a-z]{2,20}\s*:/i.test(
            stripHTML(html)
        ) &&

        (
            text.includes("dialog") ||
            text.includes("percakapan") ||
            text.includes("conversation")
        );


    if (hasDialogue) {
        return true;
    }


    /*
       Tidak ada indikator literasi.
    */

    return false;
}


/* =========================================================
   KESUKARAN
   =========================================================

   C1-C2 = Mudah
   C3    = Sedang
   C4-C5 = Sedang
   C6    = Sukar

   Tidak ada lagi persentase minimum.
   ========================================================= */

function detectDifficulty(levelData) {

    if (!levelData) {
        return "Mudah";
    }

    if (
        levelData.c === "C1" ||
        levelData.c === "C2"
    ) {
        return "Mudah";
    }

    if (
        levelData.c === "C3" ||
        levelData.c === "C4" ||
        levelData.c === "C5"
    ) {
        return "Sedang";
    }

    if (levelData.c === "C6") {
        return "Sukar";
    }

    return "Mudah";
}


/* =========================================================
   PERKAYA DATA SOAL
   ========================================================= */

function enrichQuestions() {

    /*
       Maksimal 25 soal.

       Sortir nomor terlebih dahulu.
    */

    const sorted =
        [...semuaSoal].sort(
            (a, b) =>
                Number(a.nomor || 0) -
                Number(b.nomor || 0)
        );


    /*
       HANYA 25 SOAL PERTAMA.
    */

    const limited =
        sorted.slice(
            0,
            MAX_SOAL
        );


    return limited.map(q => {

        const level =
            detectLevel(q);

        /*
           Literasi HANYA dari q.pertanyaan.
        */

        const literasi =
            detectLiterasi(q);

        /*
           Kesukaran berdasarkan C-level.
        */

        const difficulty =
            detectDifficulty(level);


        return {

            ...q,

            analisisLevel:
                level.level,

            analisisC:
                level.c,

            analisisLiterasi:
                literasi,

            analisisDifficulty:
                difficulty
        };
    });
}

        */

        {
            name:

            ok:

                sukar > 0,

            detail:
                `Mudah ${mudah} • Sedang ${sedang} • Sukar ${sukar}`
        }

    ];


    /*
       Semua indikator harus terpenuhi
       agar status LAYAK.
    */

    const semuaTerpenuhi =
        checks.every(
            item => item.ok
        );


    const jumlahTerpenuhi =
        checks.filter(
            item => item.ok
        ).length;


    let status;


    if (semuaTerpenuhi) {

        status = "LAYAK";

    } else if (jumlahTerpenuhi >= 5) {

        status = "PERLU PERBAIKAN";

    } else {

        status = "BELUM LAYAK";
    }


    return {

        qs,

        total,

        lots,

        mots,

        hots,

        mudah,

        sedang,

        sukar,

        literasi,

        checks,

        jumlahTerpenuhi,

        status
    };
}

                ${pct(a.hots).toFixed(1)}%

        <div class="progress-row">

            <span>Mudah + Sedang</span>

                <i style="
                    width:${Math.min(
                        100,
                        pct(a.mudah + a.sedang)
                    )}%;
                "></i>

            </div>

            <b>
                ${pct(a.mudah + a.sedang).toFixed(1)}%
            </b>

        </div>


        <div class="progress-row">

            <span>Sukar</span>

            <div class="progress sukar">

                <i style="
                    width:${Math.min(
                        100,
                        pct(a.sukar)

                "></i>

            </div>

            <b>
                ${pct(a.sukar).toFixed(1)}%
            </b>

        </div>

            <div class="progress literasi">

                <i style="

                "></i>

/* =========================================================
   RENDER DAFTAR SOAL
   ========================================================= */

function renderQuestions() {

    const list =
        document.getElementById(
            "questionList"
        );


    if (
        !hasilAnalisis ||
        !hasilAnalisis.qs.length
    ) {

        list.innerHTML =
            `<div class="empty">
                📝 Belum ada soal.
            </div>`;

        return;
    }


    const input =
        document.getElementById(
            "searchInput"
        );


    const filterLevel =
        document.getElementById(
            "filterLevel"
        );


    const filterDifficulty =
        document.getElementById(
            "filterDifficulty"
        );


    const keyword =
        cleanText(
            input?.value || ""
        );


    const fl =
        filterLevel?.value || "";


    const fd =
        filterDifficulty?.value || "";


    const data =
        hasilAnalisis.qs.filter(q => {

            const searchText =
                cleanText(
                    `${q.nomor} ${q.pertanyaan}`
                );


            return (

                (
                    !keyword ||
                    searchText.includes(keyword)
                )

                &&

                (
                    !fl ||
                    q.analisisLevel === fl
                )

                &&

                (
                    !fd ||
                    q.analisisDifficulty === fd
                )
            );
        });


    if (!data.length) {

        list.innerHTML =
            `<div class="empty">
                Tidak ada soal yang sesuai filter.
            </div>`;

        return;
    }


    list.innerHTML =
        data.map(q => {

            const levelClass =
                q.analisisLevel === "HOTS"
                    ? "c-hot"
                    : q.analisisLevel === "MOTS"
                        ? "c-mid"
                        : "c-low";


            const diffClass =
                q.analisisDifficulty === "Sukar"
                    ? "diff-hard"
                    : q.analisisDifficulty === "Sedang"
                        ? "diff-mid"
                        : "diff-easy";


            /*
               PENTING:

               Jangan mengambil stimulus database
               untuk menentukan literasi.

               Badge literasi berasal dari:
                   q.pertanyaan
            */

            return `

                <article class="question">

                    <div class="qhead">

                        <div class="qnum">

                            Soal ${esc(q.nomor)}

                        </div>


                        <div class="badges">

                            <span class="
                                badge
                                ${levelClass}
                            ">

                                ${q.analisisLevel}
                                •
                                ${q.analisisC}

                            </span>


                            <span class="
                                badge
                                ${diffClass}
                            ">

                                ${q.analisisDifficulty}

                            </span>


                            <span class="
                                badge
                                ${q.analisisLiterasi
                                    ? "lit"
                                    : "nol"}
                            ">

                                ${q.analisisLiterasi
                                    ? "📖 Literasi"
                                    : "Non-Literasi"}

                            </span>

                        </div>

                    </div>


                    <div class="qtext">

                        ${renderQuestionHTML(
                            q.pertanyaan
                        )}

                        ${
                            q.gambar_soal
                                ? `
                                    <img
                                        src="${escAttr(
                                            q.gambar_soal
                                        )}"
                                        alt="Gambar soal"
                                    >
                                  `
                                : ""
                        }

                    </div>


                    ${
                        q.analisisLiterasi
                            ? `
                                <div style="
                                    margin-top:10px;
                                    padding:8px 10px;
                                    border-radius:8px;
                                    background:#faf5ff;
                                    color:#7e22ce;
                                    font-size:11px;
                                ">
                                    📖 Literasi terdeteksi
                                    dari isi HTML kolom soal.
                                </div>
                              `
                            : ""
                    }

                </article>
            `;

        }).join("");
}


/* =========================================================
   RENDER HTML SOAL
   =========================================================

   Pertanyaan dapat berupa HTML.
   Script/iframe/object/embed dibuang.
   ========================================================= */

function renderQuestionHTML(value) {

    const html =
        String(value ?? "");


    /*
       Jika bukan HTML,
       tampilkan sebagai teks aman.
    */

    if (!/<[a-z][\s\S]*>/i.test(html)) {

        return esc(html)
            .replace(/\n/g, "<br>");
    }


    /*
       Sanitasi HTML.
    */

    const template =
        document.createElement(
            "template"
        );


    template.innerHTML =
        html;


    template.content
        .querySelectorAll(
            "script,iframe,object,embed"
        )
        .forEach(
            el => el.remove()
        );


    /*
       Hapus event handler seperti onclick.
    */

    template.content
        .querySelectorAll("*")
        .forEach(el => {

            [...el.attributes]
                .forEach(attr => {

                    if (
                        attr.name
                            .toLowerCase()
                            .startsWith("on")
                    ) {

                        el.removeAttribute(
                            attr.name
                        );
                    }


                    /*
                       Blokir javascript:
                       pada src/href.
                    */

                    if (
                        (
                            attr.name === "src" ||
                            attr.name === "href"
                        ) &&
                        /^javascript:/i.test(
                            attr.value
                        )
                    ) {

                        el.removeAttribute(
                            attr.name
                        );
                    }

                });
        });


    const div =
        document.createElement(
            "div"
        );


    div.appendChild(
        template.content.cloneNode(true)
    );


    return div.innerHTML;
}
