function esc(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")

function escAttr(value) {

/*
   Bersihkan HTML menjadi teks biasa.

function stripHTML(html) {

    const div =
        document.createElement("div");

    div.innerHTML =
        String(html ?? "");

    return (
        div.textContent ||
        div.innerText ||
        ""
    )
        .replace(/\s+/g, " ")
        .trim();
}


/*
   Normalisasi teks untuk analisis.
*/

function cleanText(value) {

        .toLowerCase()

function countAny(text, words) {

        (total, word) =>

            (

            ),

    );
}

/* =========================================================
   DETEKSI LITERASI
   =========================================================

   Literasi HANYA dari:
       q.pertanyaan

   Tidak membaca:
       row.literasi
       literasi database
       stimulus database
       gambar stimulus database

   HTML di dalam kolom soal tetap dibaca.
   ========================================================= */

function detectLiterasi(q) {

    const html =
        String(q.pertanyaan || "");

    const text =
        cleanText(html);


    /*
       1. Elemen HTML visual/data
       yang terdapat langsung di kolom SOAL.
    */

    const hasHTMLLiteracyElement =

        /<img\b/i.test(html) ||

        /<table\b/i.test(html) ||

        /<figure\b/i.test(html) ||

        /<svg\b/i.test(html) ||

        /<canvas\b/i.test(html);


    if (hasHTMLLiteracyElement) {
        return true;
    }


    /*
       2. Frasa literasi.
    */

    const literacyWords = [

        "bacalah",
        "bacalah teks berikut",
        "cermati teks",
        "cermatilah teks",
        "perhatikan teks",
        "simak teks",

        "berdasarkan bacaan",
        "berdasarkan teks",
        "berdasarkan paragraf",
        "berdasarkan informasi",
        "berdasarkan wacana",
        "berdasarkan artikel",

        "teks berikut",
        "bacaan berikut",
        "paragraf berikut",
        "artikel berikut",
        "wacana berikut",
        "kutipan berikut",

        "perhatikan tabel",
        "berdasarkan tabel",
        "tabel berikut",

        "perhatikan grafik",
        "berdasarkan grafik",
        "grafik berikut",

        "perhatikan diagram",
        "berdasarkan diagram",
        "diagram berikut",

        "perhatikan gambar",
        "berdasarkan gambar",
        "gambar berikut",

        "ilustrasi berikut",
        "kasus berikut",

        "dialog berikut",
        "dialogue berikut",
        "percakapan berikut",
        "conversation berikut",

        "read the text",
        "read the following text",
        "based on the text",
        "according to the passage",
        "according to the text",
        "based on the information",
        "look at the table",
        "look at the picture",
        "read the dialogue",
        "following passage"
    ];


    if (
        countAny(
            text,
            literacyWords
        ) > 0
    ) {

        return true;
    }


    /*
       3. Struktur bacaan.
       Panjang teks + kata "berdasarkan".
    */

    const hasReadingStructure =

        text.includes("berdasarkan") &&
        text.length >= 180;


    if (hasReadingStructure) {
        return true;
    }


    /*
       4. Dialog.
    */

    const hasDialogue =

        /(^|\s)[a-z]{2,20}\s*:/i.test(
            stripHTML(html)
        ) &&

        (
            text.includes("dialog") ||
            text.includes("percakapan") ||
            text.includes("conversation")
        );


    if (hasDialogue) {
        return true;
    }


    return false;
}


/* =========================================================
   KESUKARAN
   =========================================================

   C1-C2 = Mudah
   C3-C5 = Sedang
   C6    = Sukar

   CATATAN:
   Sukar tetap dihitung sebagai HASIL ANALISIS,
   tetapi TIDAK menjadi target wajib.
   ========================================================= */

function detectDifficulty(levelData) {

    if (!levelData) {
        return "Mudah";
    }

    if (
        levelData.c === "C1" ||
        levelData.c === "C2"
    ) {

        return "Mudah";
    }

    if (
        levelData.c === "C3" ||
        levelData.c === "C4" ||
        levelData.c === "C5"
    ) {

        return "Sedang";
    }

    if (levelData.c === "C6") {
        return "Sukar";
    }

    return "Mudah";
}


/* =========================================================
   PERKAYA DATA SOAL
   ========================================================= */

function enrichQuestions() {

    /*
       Sortir berdasarkan nomor.
    */

    const sorted =
        [...semuaSoal].sort(
            (a, b) =>
                Number(a.nomor || 0) -
                Number(b.nomor || 0)
        );


    /*
       Maksimal 25 soal.

       Jika hanya tersedia 10,
       maka hanya 10 yang dianalisis.
    */

    const limited =
        sorted.slice(
            0,
            MAX_SOAL
        );


    return limited.map(q => {

        const level =
            detectLevel(q);

        const literasi =
            detectLiterasi(q);

        const difficulty =
            detectDifficulty(level);

        return {

            ...q,

            analisisLevel:
                level.level,

            analisisC:
                level.c,

            analisisLiterasi:
                literasi,

            analisisDifficulty:
                difficulty
        };
    });
}


/* =========================================================

   1. LOTS/MOTS
   2. HOTS
   3. Literasi
   4. Mudah
   5. Sedang
   6. Jumlah 25 soal

   TIDAK ADA TARGET SUKAR.
   ========================================================= */

function buatAnalisis() {

    const qs =
        enrichQuestions();

    const total =
        qs.length;


    /*
       LOTS + MOTS DIGABUNG.
    */

    const lots =
        qs.filter(
            q =>
                q.analisisLevel ===
                "LOTS"
        ).length;

    const mots =
        qs.filter(
            q =>
                q.analisisLevel ===
                "MOTS"
        ).length;

        lots + mots;


    /*
       HOTS = C4-C6.
    */

    const hots =
        qs.filter(
            q =>
                q.analisisLevel ===
                "HOTS"
        ).length;


    /*
       Kesukaran tetap dihitung
       sebagai informasi analisis.
    */

    const mudah =
        qs.filter(
            q =>
                q.analisisDifficulty ===
                "Mudah"
        ).length;


    const sedang =
        qs.filter(
            q =>
                q.analisisDifficulty ===
                "Sedang"
        ).length;


    const sukar =
        qs.filter(
            q =>
                q.analisisDifficulty ===
                "Sukar"
        ).length;


    /*
       Literasi hanya dari isi soal.
    */

    const literasi =
        qs.filter(
            q =>
                q.analisisLiterasi === true
        ).length;


    /*
       ======================================================
       TARGET FINAL
       ====================================================== */

    const checks = [

        {
            name:
                "Ada soal LOTS/MOTS",

            ok:
                lotsMots > 0,

            detail:
                `${lotsMots} soal LOTS/MOTS`

            ok:
                hots > 0,

                literasi > 0,

            detail:
                `${literasi} soal literasi`
        },

            ok:
                mudah > 0,

            detail:
                `${mudah} soal Mudah`
        },


        {
            name:

            ok:
                sedang > 0,

            detail:

            ok:
                total === 25,

            detail:
                `${total} / 25 soal`

    /*
       Semua 6 target harus ada
       untuk status LAYAK.
    */

    const semuaTerpenuhi =
        checks.every(
            item => item.ok
        );


    const jumlahTerpenuhi =
        checks.filter(
            item => item.ok
        ).length;


    let status;


    if (semuaTerpenuhi) {

        status = "LAYAK";

    } else if (jumlahTerpenuhi >= 4) {

        status = "PERLU PERBAIKAN";

    } else {

        status = "BELUM LAYAK";
    }


    return {

        qs,

        total,

        lots,

        mots,

        lotsMots,

        hots,

        mudah,

        sedang,

        sukar,

        literasi,

        checks,

        jumlahTerpenuhi,

        status
    };
}

function renderQuestions() {

    const list =
        document.getElementById(
            "questionList"
        );


    if (
        !hasilAnalisis ||
        !hasilAnalisis.qs.length
    ) {

        list.innerHTML =
            `
            <div class="empty">
                📝 Belum ada soal.
            </div>
            `;

        return;
    }


    const input =
        document.getElementById(
            "searchInput"
        );


    const filterLevel =
        document.getElementById(
            "filterLevel"
        );


    const filterDifficulty =
        document.getElementById(
            "filterDifficulty"
        );


    const keyword =
        cleanText(
            input?.value || ""
        );


    const fl =
        filterLevel?.value || "";


    const fd =
        filterDifficulty?.value || "";


    const data =
        hasilAnalisis.qs.filter(q => {

            const searchText =
                cleanText(
                    `${q.nomor} ${q.pertanyaan}`
                );


            return (

                (
                    !keyword ||
                    searchText.includes(
                        keyword
                    )
                )

                &&

                (
                    !fl ||
                    q.analisisLevel === fl
                )

                &&

                (
                    !fd ||
                    q.analisisDifficulty === fd
                )
            );
        });


    if (!data.length) {

        list.innerHTML =
            `
            <div class="empty">
                Tidak ada soal yang sesuai filter.
            </div>
            `;

        return;
    }


    list.innerHTML =
        data.map(q => {

            const levelClass =
                q.analisisLevel === "HOTS"
                    ? "c-hot"
                    : q.analisisLevel === "MOTS"
                        ? "c-mid"
                        : "c-low";


            const diffClass =
                q.analisisDifficulty === "Sukar"
                    ? "diff-hard"
                    : q.analisisDifficulty === "Sedang"
                        ? "diff-mid"
                        : "diff-easy";


            return `

                <article class="question">

                    <div class="qhead">

                        <div class="qnum">

                            Soal ${esc(q.nomor)}

                        </div>


                        <div class="badges">

                            <span class="
                                badge
                                ${levelClass}
                            ">

                                ${q.analisisLevel}

                                ${q.analisisC}

                            </span>


                            <span class="
                                badge
                                ${diffClass}
                            ">

                                ${q.analisisDifficulty}

                            </span>


                            <span class="
                                badge
                                ${q.analisisLiterasi
                                    ? "lit"
                                    : "nol"}
                            ">

                                ${q.analisisLiterasi
                                    ? "📖 Literasi"
                                    : "Non-Literasi"}

                            </span>

                        </div>

                    </div>


                    <div class="qtext">

                        ${renderQuestionHTML(
                            q.pertanyaan
                        )}

                        ${
                            q.gambar_soal
                                ? `
                                    <img
                                        src="${escAttr(
                                            q.gambar_soal
                                        )}"
                                        alt="Gambar soal"
                                    >
                                  `
                                : ""
                        }

                    </div>


                    ${
                        q.analisisLiterasi
                            ? `
                                <div style="
                                    margin-top:10px;
                                    padding:8px 10px;
                                    border-radius:8px;
                                    background:#faf5ff;
                                    color:#7e22ce;
                                    font-size:11px;
                                ">
                                    📖 Literasi terdeteksi
                                    dari isi HTML kolom soal.
                                </div>
                              `
                            : ""
                    }

                </article>
            `;

        }).join("");
}


/* =========================================================
   RENDER HTML SOAL
   ========================================================= */

function renderQuestionHTML(value) {

    const html =
        String(value ?? "");


    /*
       Jika bukan HTML,
       tampilkan sebagai teks aman.
    */

    if (!/<[a-z][\s\S]*>/i.test(html)) {

        return esc(html)
            .replace(
                /\n/g,
                "<br>"
            );
    }


    /*
       Sanitasi HTML.
    */

    const template =
        document.createElement(
            "template"
        );


    template.innerHTML =
        html;


    template.content
        .querySelectorAll(
            "script,iframe,object,embed"
        )
        .forEach(
            el => el.remove()
        );


    /*
       Hapus event handler.
    */

    template.content
        .querySelectorAll("*")
        .forEach(el => {

            [...el.attributes]
                .forEach(attr => {

                    if (
                        attr.name
                            .toLowerCase()
                            .startsWith("on")
                    ) {

                        el.removeAttribute(
                            attr.name
                        );
                    }


                    /*
                       Blokir javascript:
                       pada src/href.
                    */

                    if (
                        (
                            attr.name === "src" ||
                            attr.name === "href"
                        ) &&
                        /^javascript:/i.test(
                            attr.value
                        )
                    ) {

                        el.removeAttribute(
                            attr.name
                        );
                    }

                });
        });


    const div =
        document.createElement(
            "div"
        );


    div.appendChild(
        template.content.cloneNode(
            true
        )
    );


    return div.innerHTML;
}
