<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Siswa - EXAM SMPN 3 Sibolga</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <header class="bg-indigo-900 text-white shadow-md">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold">Portal Ujian Siswa</h1>
        <p class="text-xs text-indigo-200">SMP Negeri 3 Sibolga</p>
      </div>
      <button id="btnLogout" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
        Keluar
      </button>
    </div>
  </header>

  <main class="container mx-auto px-4 py-6 max-w-4xl">
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6">
      <h3 class="text-base font-bold text-slate-800 mb-2">Masuk Ruang Ujian</h3>
      <p class="text-xs text-slate-500 mb-4">Minta Token Ujian kepada Guru Pengawas sebelum memulai.</p>
      
      <form id="tokenForm" class="flex flex-col sm:flex-row gap-3">
        <input type="text" id="tokenInput" placeholder="Masukkan 6 Digit Token" required class="flex-1 px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 uppercase tracking-widest font-mono text-center font-bold text-lg outline-none">
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-lg text-sm font-semibold transition">
          Mulai Ujian
        </button>
      </form>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://sztfucrmjexoalyiwwnq.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_j724cUM7NNHl8wbxq9ZHKw_FLFJAuGn';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('tokenForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const token = document.getElementById('tokenInput').value.trim();
      if (token) {
        window.location.href = `exam.html?token=${token}`;
      }
    });

    document.getElementById('btnLogout').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
