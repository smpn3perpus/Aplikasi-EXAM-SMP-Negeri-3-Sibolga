<body class="bg-slate-100 min-h-screen text-slate-800">

  <header class="bg-emerald-800 text-white shadow-md">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold">Kelola Bank Soal</h1>
        <p class="text-xs text-emerald-200">Aplikasi EXAM SMP Negeri 3 Sibolga</p>
      </div>
      <a href="guru.html" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
        Kembali
      </a>
    </div>
  </header>

  <main class="container mx-auto px-4 py-6">
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6">
      <h2 class="text-lg font-bold text-slate-800 mb-4">Input Soal Baru</h2>
      <form id="soalForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Pertanyaan Soal</label>
          <textarea id="pertanyaan" rows="3" required placeholder="Tuliskan butir soal di sini..." class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div><input type="text" id="optA" placeholder="Pilihan A" class="w-full px-4 py-2 border rounded-lg text-sm"></div>
          <div><input type="text" id="optB" placeholder="Pilihan B" class="w-full px-4 py-2 border rounded-lg text-sm"></div>
          <div><input type="text" id="optC" placeholder="Pilihan C" class="w-full px-4 py-2 border rounded-lg text-sm"></div>
          <div><input type="text" id="optD" placeholder="Pilihan D" class="w-full px-4 py-2 border rounded-lg text-sm"></div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Kunci Jawaban</label>
          <select id="kunci" class="w-full px-4 py-2 border rounded-lg text-sm">
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
          </select>
        </div>

        <button type="submit" class="bg-emerald-700 hover:bg-emerald-800 text-white px-6 py-2.5 rounded-lg text-sm font-semibold transition">
          Simpan Soal
        </button>
      </form>
    </div>
  </main>

</body>
