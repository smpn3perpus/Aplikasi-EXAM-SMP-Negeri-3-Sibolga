<body>

<header class="header">

    <div>
        <h1>📚 MATA PELAJARAN</h1>
        <p>RUANG EXAM — SMP Negeri 3 Sibolga</p>
    </div>

    <div class="header-buttons">

        <button
            class="btn btn-back"
            onclick="kembaliDashboard()">
            ← Dashboard
        </button>

        <button
            class="btn btn-refresh"
            onclick="loadMapel()">
            🔄 Refresh
        </button>

    </div>

</header>


<main class="container">

    <div id="message" class="message"></div>

    <div class="summary">

        <strong id="jumlahMapel">0</strong>

        <span>
            Total Mata Pelajaran
        </span>

    </div>


    <div class="toolbar">

        <div class="search">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Cari mata pelajaran..."
                oninput="filterMapel()">

        </div>

        <button
            class="btn btn-add"
            onclick="bukaTambah()">

            ➕ Tambah Mata Pelajaran

        </button>

    </div>


    <div class="table-box">

        <table>

            <thead>

                <tr>
                    <th>No</th>
                    <th>Mata Pelajaran</th>
                    <th>Dibuat</th>
                    <th>Aksi</th>
                </tr>

            </thead>

            <tbody id="mapelBody">

                <tr>
                    <td
                        colspan="4"
                        class="empty">
                        ⏳ Memuat data...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</main>


<footer class="footer">

    RUANG EXAM Online<br>

    Dibuat oleh Mr. Rahmat Batubara, S.T.P

</footer>


<!-- MODAL -->

<div
    class="modal"
    id="modal">

    <div class="modal-box">

        <h2 id="modalTitle">
            Tambah Mata Pelajaran
        </h2>

        <div class="form-group">

            <label>
                Nama Mata Pelajaran
            </label>

            <input
                type="text"
                id="namaMapel"
                maxlength="150"
                placeholder="Contoh: Prakarya">

        </div>

        <div class="modal-buttons">

            <button
                class="btn cancel"
                onclick="tutupModal()">

                Batal

            </button>

            <button
                class="btn save"
                onclick="simpanMapel()">

                💾 Simpan

            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://sztfucrmjexoalyiwwnq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_j724cUM7NNHl8wbxq9ZHKw_FLFJAuGn";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   CEK LOGIN ADMIN
===================================================== */

const sessionRaw =
    localStorage.getItem("exam_user");

if(!sessionRaw){

    window.location.href = "login.html";

}

try{

    const user =
        JSON.parse(sessionRaw);

    if(user.role !== "admin"){

        localStorage.removeItem("exam_user");

        window.location.href =
            "login.html";

    }

}catch(error){

    localStorage.removeItem("exam_user");

    window.location.href =
        "login.html";

}


/* =====================================================
   DATA
===================================================== */

let semuaMapel = [];

let editId = null;


/* =====================================================
   PESAN
===================================================== */

function showMessage(text,type){

    const el =
        document.getElementById("message");

    el.textContent = text;

    el.className =
        "message " + type;

    setTimeout(()=>{

        el.className = "message";

        el.textContent = "";

    },3000);

}


/* =====================================================
   LOAD DATA
===================================================== */

async function loadMapel(){

    const body =
        document.getElementById("mapelBody");

    body.innerHTML = `
        <tr>
            <td colspan="4" class="empty">
                ⏳ Memuat mata pelajaran...
            </td>
        </tr>
    `;

    try{

        const {data,error} =
            await supabaseClient
            .from("mata_pelajaran")
            .select("id,nama,created_at")
            .order("nama",{ascending:true});

        if(error){

            throw error;

        }

        semuaMapel =
            data || [];

        document.getElementById(
            "jumlahMapel"
        ).textContent =
            semuaMapel.length;

        tampilkanMapel(
            semuaMapel
        );

    }catch(error){

        console.error(error);

        body.innerHTML = `
            <tr>
                <td colspan="4" class="empty">
                    ❌ Gagal memuat data.
                </td>
            </tr>
        `;

        showMessage(
            "Gagal mengambil data: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   TAMPILKAN DATA
===================================================== */

function tampilkanMapel(data){

    const body =
        document.getElementById(
            "mapelBody"
        );

    if(!data.length){

        body.innerHTML = `
            <tr>
                <td colspan="4" class="empty">
                    📚 Belum ada mata pelajaran.
                </td>
            </tr>
        `;

        return;

    }

    body.innerHTML =
        data.map((item,index)=>{

            return `

                <tr>

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        <strong>
                            ${escapeHtml(item.nama)}
                        </strong>
                    </td>

                    <td>
                        ${formatTanggal(item.created_at)}
                    </td>

                    <td>

                        <div class="action">

                            <button
                                class="edit"
                                onclick="editMapel('${item.id}')">

                                ✏️ Edit

                            </button>

                            <button
                                class="delete"
                                onclick="hapusMapel('${item.id}')">

                                🗑️ Hapus

                            </button>

                        </div>

                    </td>

                </tr>

            `;

        }).join("");

}


/* =====================================================
   FILTER
===================================================== */

function filterMapel(){

    const keyword =
        document.getElementById(
            "searchInput"
        ).value
        .toLowerCase()
        .trim();

    const hasil =
        semuaMapel.filter(item =>
            (item.nama || "")
            .toLowerCase()
            .includes(keyword)
        );

    tampilkanMapel(hasil);

}


/* =====================================================
   TAMBAH
===================================================== */

function bukaTambah(){

    editId = null;

    document.getElementById(
        "modalTitle"
    ).textContent =
        "Tambah Mata Pelajaran";

    document.getElementById(
        "namaMapel"
    ).value = "";

    document.getElementById(
        "modal"
    ).style.display =
        "flex";

    setTimeout(()=>{

        document.getElementById(
            "namaMapel"
        ).focus();

    },100);

}


/* =====================================================
   EDIT
===================================================== */

function editMapel(id){

    const item =
        semuaMapel.find(
            x => x.id === id
        );

    if(!item){

        alert(
            "Data mata pelajaran tidak ditemukan."
        );

        return;

    }

    editId = id;

    document.getElementById(
        "modalTitle"
    ).textContent =
        "Edit Mata Pelajaran";

    document.getElementById(
        "namaMapel"
    ).value =
        item.nama || "";

    document.getElementById(
        "modal"
    ).style.display =
        "flex";

}


/* =====================================================
   SIMPAN
===================================================== */

async function simpanMapel(){

    const nama =
        document.getElementById(
            "namaMapel"
        ).value.trim();

    if(!nama){

        alert(
            "Nama mata pelajaran wajib diisi."
        );

        return;

    }

    try{

        /* ================================
           EDIT
        ================================= */

        if(editId){

            const {error} =
                await supabaseClient
                .from("mata_pelajaran")
                .update({
                    nama:nama
                })
                .eq("id",editId);

            if(error){

                throw error;

            }

            showMessage(
                "Mata pelajaran berhasil diperbarui.",
                "success"
            );

        }

        /* ================================
           TAMBAH
        ================================= */

        else{

            const {error} =
                await supabaseClient
                .from("mata_pelajaran")
                .insert({
                    nama:nama
                });

            if(error){

                if(error.code === "23505"){

                    alert(
                        "Mata pelajaran tersebut sudah ada."
                    );

                    return;

                }

                throw error;

            }

            showMessage(
                "Mata pelajaran berhasil ditambahkan.",
                "success"
            );

        }

        tutupModal();

        await loadMapel();

    }catch(error){

        console.error(error);

        alert(
            "Gagal menyimpan:\n" +
            error.message
        );

    }

}


/* =====================================================
   HAPUS
===================================================== */

async function hapusMapel(id){

    const item =
        semuaMapel.find(
            x => x.id === id
        );

    if(!item){

        return;

    }

    const yakin =
        confirm(
            "Hapus mata pelajaran:\n\n" +
            item.nama +
            "\n\n" +
            "Data yang dihapus tidak dapat dikembalikan."
        );

    if(!yakin){

        return;

    }

    try{

        const {error} =
            await supabaseClient
            .from("mata_pelajaran")
            .delete()
            .eq("id",id);

        if(error){

            throw error;

        }

        showMessage(
            "Mata pelajaran berhasil dihapus.",
            "success"
        );

        await loadMapel();

    }catch(error){

        console.error(error);

        alert(
            "Gagal menghapus:\n" +
            error.message
        );

    }

}


/* =====================================================
   MODAL
===================================================== */

function tutupModal(){

    document.getElementById(
        "modal"
    ).style.display =
        "none";

    editId = null;

}


/* =====================================================
   FORMAT TANGGAL
===================================================== */

function formatTanggal(value){

    if(!value){

        return "-";

    }

    try{

        return new Date(value)
        .toLocaleString(
            "id-ID",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }catch(error){

        return "-";

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   KEMBALI
===================================================== */

function kembaliDashboard(){

    window.location.href =
        "admin.html";

}


/* =====================================================
   KLIK LUAR MODAL
===================================================== */

document
.getElementById("modal")
.addEventListener(
    "click",
    function(e){

        if(e.target === this){

            tutupModal();

        }

    }
);


/* =====================================================
   LOAD AWAL
===================================================== */

loadMapel();

</script>

</body>
</html>
