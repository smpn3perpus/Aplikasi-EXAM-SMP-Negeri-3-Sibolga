<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal & Token Ujian - EXAM SMPN 3 Sibolga</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <header class="bg-blue-900 text-white shadow-md">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold">Kelola Jadwal & Token Ujian</h1>
        <p class="text-xs text-blue-200">Aplikasi EXAM SMP Negeri 3 Sibolga</p>
      </div>
      <a href="guru.html" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
        Kembali
      </a>
    </div>
  </header>

  <main class="container mx-auto px-4 py-6">
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6">
      <h2 class="text-lg font-bold text-slate-800 mb-4">Buat Jadwal Ujian Baru</h2>
      <form id="ujianForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Nama Ujian</label>
          <input type="text" id="namaUjian" required placeholder="Contoh: PTS Matematika Kelas 8" class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Mata Pelajaran</label>
          <input type="text" id="mapel" required placeholder="Contoh: Matematika" class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Durasi (Menit)</label>
          <input type="number" id="durasi" required placeholder="60" class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Token Ujian</label>
          <div class="flex gap-2">
            <input type="text" id="token" required placeholder="6 DIGIT" class="w-full px-4 py-2 border rounded-lg text-sm font-mono uppercase font-bold text-center focus:ring-2 focus:ring-blue-500 outline-none">
            <button type="button" onclick="generateToken()" class="bg-slate-200 hover:bg-slate-300 px-3 py-2 rounded-lg text-xs font-semibold text-slate-700">Acak</button>
          </div>
        </div>
        <div class="md:col-span-2">
          <button type="submit" class="bg-blue-900 hover:bg-blue-800 text-white px-6 py-2.5 rounded-lg text-sm font-semibold transition">
            Simpan Ujian
          </button>
        </div>
      </form>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://sztfucrmjexoalyiwwnq.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_j724cUM7NNHl8wbxq9ZHKw_FLFJAuGn';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function generateToken() {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let res = '';
      for (let i = 0; i < 6; i++) {
        res += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      document.getElementById('token').value = res;
    }
  </script>
</body>
</html>
