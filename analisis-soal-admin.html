function escapeHTML(value){
    if(value === null || value === undefined) return "";

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function stripHTML(value){
    if(!value) return "";

    const div = document.createElement("div");
    div.innerHTML = String(value);

    return div.textContent || div.innerText || "";
}

function normalizeText(value){
    return stripHTML(value)
        .toLowerCase()
        .replace(/\s+/g," ")
        .trim();
}

function skorKKO(teks){

    const t = normalizeText(teks);

    for(const level of ["C6","C5","C4","C3","C2","C1"]){

        const daftar = KKO[level];

        for(const kko of daftar){

            if(t.includes(kko.toLowerCase())){
                return level;
            }
        }
    }

    return "C1";
}

function kategoriKognitif(level){

    if(level === "C1" || level === "C2"){
        return "LOTS";
    }

    if(level === "C3"){
        return "MOTS";
    }

    return "HOTS";
}

/* =========================================================
   KUNCI JAWABAN
========================================================= */

function getKunciJawaban(soal){

    const fields = [
        "kunci_jawaban",
        "kunciJawaban",
        "jawaban_benar",
        "jawabanBenar",
        "correct_answer",
        "correctAnswer",
        "answer_key",
        "answerKey",
        "kunci",
        "answer"
    ];

    for(const field of fields){

        if(
            soal &&
            soal[field] !== undefined &&
            soal[field] !== null &&
            String(soal[field]).trim() !== ""
        ){
            return String(soal[field]).trim();
        }
    }

    return "";
}

function normalisasiKunci(kunci){

    if(!kunci) return "";

    let x = normalizeText(kunci);

    x = x.replace(/^jawaban\s*/,"");
    x = x.replace(/^opsi\s*/,"");

    if(/^[abcd]$/.test(x)){
        return x.toUpperCase();
    }

    if(x.startsWith("a.")) return "A";
    if(x.startsWith("b.")) return "B";
    if(x.startsWith("c.")) return "C";
    if(x.startsWith("d.")) return "D";

    return x;
}

function getPilihan(soal){

    return {
        A: soal?.pilihan_a ??
           soal?.pilihanA ??
           "",

        B: soal?.pilihan_b ??
           soal?.pilihanB ??
           "",

        C: soal?.pilihan_c ??
           soal?.pilihanC ??
           "",

        D: soal?.pilihan_d ??
           soal?.pilihanD ??
           ""
    };
}

/* =========================================================
   KESUKARAN
   TIDAK TERGANTUNG LANGSUNG PADA C1-C6
========================================================= */

function tingkatKesukaran(soal,kognitif,literasi){

    const html = soal?.pertanyaan || "";
    const teks = normalizeText(html);

    const pilihan = getPilihan(soal);

    let score = 0;

    /*
       KKO hanya menjadi salah satu indikator.
       Tidak ada ketentuan:
       C1-C2 = mudah
       C3 = sedang
       C4-C5 = sedang
       C6 = sukar
    */

    const bobotKKO = {
        C1:0,
        C2:1,
        C3:1,
        C4:2,
        C5:2,
        C6:2
    };

    score += bobotKKO[kognitif] || 0;

    if(literasi){
        score += 1;
    }

    const panjangSoal = teks.length;

    if(panjangSoal > 250){
        score += 1;
    }

    if(panjangSoal > 500){
        score += 1;
    }

    const kontekstual = [
        "situasi",
        "kasus",
        "permasalahan",
        "masalah",
        "kondisi",
        "seorang siswa",
        "seorang guru",
        "dalam kehidupan",
        "dalam kegiatan",
        "perhatikan",
        "berdasarkan data",
        "berdasarkan informasi",
        "jika",
        "apabila",
        "apakah solusi",
        "what would",
        "why",
        "how"
    ];

    if(kontekstual.some(x => teks.includes(x))){
        score += 1;
    }

    const kunci = normalisasiKunci(getKunciJawaban(soal));

    let jawabanBenar = "";

    if(["A","B","C","D"].includes(kunci)){
        jawabanBenar = normalizeText(pilihan[kunci]);
    }else if(kunci){
        jawabanBenar = normalizeText(kunci);
    }

    if(jawabanBenar){

        /*
           Bila jawaban langsung ditemukan di pertanyaan,
           tingkat kesukaran diturunkan.
        */
        if(
            jawabanBenar.length > 3 &&
            teks.includes(jawabanBenar)
        ){
            score -= 3;
        }

        /*
           Jawaban sangat pendek biasanya lebih mudah.
        */
        if(jawabanBenar.length > 0 && jawabanBenar.length < 20){
            score -= 1;
        }

        const semuaPilihan = Object.values(pilihan)
            .map(x => normalizeText(x))
            .filter(Boolean);

        const panjang = semuaPilihan.map(x => x.length);

        if(panjang.length >= 2){

            const min = Math.min(...panjang);
            const max = Math.max(...panjang);

            if(max - min <= 25){
                score += 1;
            }

            /*
               Distraktor yang panjang dan mirip membuat
               jawaban lebih sulit dibedakan.
            */
            const jumlahPanjang = panjang.filter(x => x >= 50).length;

            if(jumlahPanjang >= 3){
                score += 1;
            }
        }

        const kataPenalaran = [
            "alasan",
            "mengapa",
            "bagaimana",
            "solusi",
            "strategi",
            "dampak",
            "akibat",
            "pertimbangan",
            "paling tepat",
            "paling efektif",
            "most appropriate",
            "best solution",
            "reason",
            "strategy",
            "impact"
        ];

        if(kataPenalaran.some(x => teks.includes(x))){
            score += 2;
        }

    }else{

        /*
           Bila kunci tidak tersedia, gunakan karakteristik
           pilihan sebagai indikator tambahan.
        */
        const semuaPilihan = Object.values(pilihan)
            .map(x => normalizeText(x))
            .filter(Boolean);

        if(semuaPilihan.length >= 2){

            const panjang = semuaPilihan.map(x => x.length);
            const min = Math.min(...panjang);
            const max = Math.max(...panjang);

            if(max - min <= 25){
                score += 1;
            }
        }
    }

    const hafalanLangsung = [
        "apa pengertian",
        "siapa",
        "kapan",
        "di mana",
        "dimana",
        "sebutkan",
        "istilah",
        "nama dari",
        "what is",
        "who is",
        "when",
        "where"
    ];

    if(
        hafalanLangsung.some(x => teks.includes(x)) &&
        !literasi
    ){
        score -= 2;
    }

    if(score <= 2){
        return "Mudah";
    }

    if(score <= 5){
        return "Sedang";
    }

    return "Sukar";
}

/* =========================================================
   ANALISIS SATU SOAL
========================================================= */

function analisisSoal(soal){

    const pertanyaan =
        soal?.pertanyaan || "";

    const literasi =
        cariLiterasi(soal);

    const kognitif =
        skorKKO(pertanyaan);

    const kategori =
        kategoriKognitif(kognitif);

    const kesukaran =
        tingkatKesukaran(
            soal,
            kognitif,
            literasi
        );

    return {
        ...soal,
        kognitif,
        kategori,
        kesukaran,
        literasi: literasi
            ? "Literasi"
            : "Non-Literasi"
    };
}

        */

        const {data:guruData,error:guruError} =
            await supabaseClient
                .from("guru")
                .select("*");

        if(guruError){
            throw guruError;
        }

        semuaGuru = guruData || [];

        /*
           ==================================================
           2. AMBIL SEMUA UJIAN
           TIDAK ADA FILTER guru_id
           ==================================================
        */

        const {data:ujianData,error:ujianError} =
            await supabaseClient
                .from("ujian")
                .select("*")
                .order("created_at",{ascending:false});

        if(ujianError){
            throw ujianError;
        }

        semuaUjian = ujianData || [];

        /*
           ==================================================
           3. AMBIL SEMUA SOAL
           TIDAK ADA FILTER GURU
           ==================================================
        */

        const {data:soalData,error:soalError} =
            await supabaseClient
                .from("soal")
                .select("*")
                .order("ujian_id",{ascending:true})
                .order("nomor",{ascending:true});

        if(soalError){
            throw soalError;
        }

        /*
           ==================================================
           4. BUAT MAP GURU
           ==================================================
        */

        const guruMap = {};

        semuaGuru.forEach(guru => {

            const id =
                guru.id ??
                guru.guru_id;

            if(id){
                guruMap[String(id)] =
                    guru.nama ??
                    guru.nama_guru ??
                    guru.name ??
                    guru.username ??
                    guru.nip ??
                    "-";
            }
        });

        /*
           ==================================================
           5. MAP UJIAN
           ==================================================
        */

        const ujianMap = {};

        semuaUjian.forEach(ujian => {

            const id =
                ujian.id;

            if(id){

                const guruId =
                    ujian.guru_id ??
                    ujian.guruId ??
                    ujian.teacher_id ??
                    ujian.teacherId ??
                    ujian.created_by ??
                    ujian.createdBy ??
                    ujian.pembuat_id ??
                    ujian.pembuatId ??
                    ujian.user_id ??
                    ujian.userId;

                let namaGuru = "-";

                if(guruId && guruMap[String(guruId)]){
                    namaGuru =
                        guruMap[String(guruId)];
                }

                ujianMap[String(id)] = {
                    ...ujian,
                    namaGuru
                };
            }
        });

        /*
           ==================================================
           6. MAKSIMAL 25 SOAL PER BANK SOAL
           ==================================================
        */

        const jumlahPerBank = {};

        const hasil = [];

        (soalData || []).forEach(soal => {

            const ujianId =
                soal.ujian_id;

            if(!ujianId){
                return;
            }

            const key =
                String(ujianId);

            if(!jumlahPerBank[key]){
                jumlahPerBank[key] = 0;
            }

            /*
               MAKSIMAL 25 SOAL PER BANK.
               BUKAN 25 SOAL GABUNGAN.
            */
            if(jumlahPerBank[key] >= 25){
                return;
            }

            jumlahPerBank[key]++;

            const ujian =
                ujianMap[key] || {};

            hasil.push(
                analisisSoal({
                    ...soal,
                    namaGuru:
                        ujian.namaGuru || "-",
                    namaUjian:
                        ujian.judul ??
                        ujian.nama ??
                        ujian.nama_ujian ??
                        ujian.title ??
                        "Bank Soal",
                    mataPelajaran:
                        ujian.mata_pelajaran ??
                        ujian.mataPelajaran ??
                        ujian.mapel ??
                        ujian.subject ??
                        "-"
                })
            );
        });

        semuaData = hasil;

        renderGuruFilter();
        renderUjianFilter();
        renderAll();

    }catch(error){

        console.error(error);

        showError(
            "Gagal memuat data: " +
            (error.message || error)
        );
    }
}

/* =========================================================
   ERROR
========================================================= */

function showError(message){

    document.getElementById("errorBox").innerHTML =
        `<div class="error">
            <strong>Terjadi kesalahan:</strong><br>
            ${escapeHTML(message)}
        </div>`;

    document.getElementById("summary").innerHTML = "";
}

/* =========================================================
   FILTER GURU
========================================================= */

function renderGuruFilter(){

    const select =
        document.getElementById("guruFilter");

    const namaGuru =
        [...new Set(
            semuaData
                .map(x => x.namaGuru)
                .filter(Boolean)
        )]
        .sort((a,b) =>
            String(a).localeCompare(
                String(b),
                "id"
            )
        );

    select.innerHTML =
        `<option value="">Semua Guru</option>`;

    namaGuru.forEach(nama => {

        const option =
            document.createElement("option");

        option.value = nama;
        option.textContent = nama;

        select.appendChild(option);
    });
}

/* =========================================================
   FILTER BANK SOAL
========================================================= */

function renderUjianFilter(){

    const select =
        document.getElementById("ujianFilter");

    const map = {};

    semuaData.forEach(soal => {

        const id =
            soal.ujian_id;

        if(id && !map[String(id)]){

            map[String(id)] = {
                id,
                namaUjian:
                    soal.namaUjian,
                namaGuru:
                    soal.namaGuru
            };
        }
    });

    select.innerHTML =
        `<option value="">Semua Bank Soal</option>`;

    Object.values(map)
        .sort((a,b) =>
            String(a.namaUjian)
                .localeCompare(
                    String(b.namaUjian),
                    "id"
                )
        )
        .forEach(item => {

            const option =
                document.createElement("option");

            option.value =
                String(item.id);

            option.textContent =
                `${item.namaUjian} — ${item.namaGuru}`;

            select.appendChild(option);
        });
}

/* =========================================================
   FILTER DATA
========================================================= */

function getFilteredData(){

    const ujian =
        document.getElementById("ujianFilter").value;

    const guru =
        document.getElementById("guruFilter").value;

    const kognitif =
        document.getElementById("kognitifFilter").value;

    const kategori =
        document.getElementById("kategoriFilter").value;

    const kesukaran =
        document.getElementById("kesukaranFilter").value;

    const literasi =
        document.getElementById("literasiFilter").value;

    const search =
        normalizeText(
            document.getElementById("searchInput").value
        );

    return semuaData.filter(soal => {

        if(
            ujian &&
            String(soal.ujian_id) !== String(ujian)
        ){
            return false;
        }

        if(
            guru &&
            String(soal.namaGuru) !== String(guru)
        ){
            return false;
        }

        if(
            kognitif &&
            soal.kognitif !== kognitif
        ){
            return false;
        }

        if(
            kategori &&
            soal.kategori !== kategori
        ){
            return false;
        }

        if(
            kesukaran &&
            soal.kesukaran !== kesukaran
        ){
            return false;
        }

        if(
            literasi &&
            soal.literasi !== literasi
        ){
            return false;
        }

        if(search){

            const gabungan =
                normalizeText(
                    `${soal.pertanyaan || ""}
                     ${soal.namaGuru || ""}
                     ${soal.namaUjian || ""}
                     ${soal.mataPelajaran || ""}`
                );

            if(!gabungan.includes(search)){
                return false;
            }
        }

        return true;
    });
}

/* =========================================================
   RENDER SEMUA
========================================================= */

function renderAll(){

    const data =
        getFilteredData();

    renderSummary(data);
    renderEligibility(data);
    renderDifficulty(data);
    renderCognitive(data);
    renderMatrix(data);
    renderQuestionList(data);
}

/* =========================================================

========================================================= */

            x.kategori === "HOTS"
        ).length;

        data.filter(x =>
            x.literasi === "Literasi"
        ).length;

    const sukar =
        data.filter(x =>

        </div>

        <div class="card">

            <div class="card-value">${lots}</div>
        </div>

        <div class="card">
            <div class="card-title">MOTS</div>
            <div class="card-value orange">${mots}</div>
        </div>

        <div class="card">
            <div class="card-title">HOTS</div>
            <div class="card-value purple">${hots}</div>
        </div>

        <div class="card">
            <div class="card-title">LITERASI</div>
            <div class="card-value green">${literasi}</div>
        </div>

        <div class="card">
            <div class="card-title">SUKAR</div>
            <div class="card-value red">${sukar}</div>
        </div>

    `;
}

/* =========================================================
   KELOMPOK BANK SOAL
========================================================= */

function groupByBank(data){

    const groups = {};

    data.forEach(soal => {

        const key =
            String(soal.ujian_id);

        if(!groups[key]){
            groups[key] = [];
        }

        groups[key].push(soal);
    });

    return groups;
}

/* =========================================================
   ELIGIBILITY
   TOTAL HARUS TEPAT 25
========================================================= */

function renderEligibility(data){

    const groups =
        groupByBank(data);

    const entries =
        Object.values(groups);

    if(entries.length === 0){

        document.getElementById("eligibility").innerHTML =
            `<div class="empty">
                Tidak ada bank soal yang sesuai filter.
             </div>`;

        return;
    }

    let html =
        `<div class="eligibility">`;

    entries.forEach(bank => {

        const total =
            bank.length;

        const lots =
            bank.filter(x =>
                x.kategori === "LOTS"
            ).length;

        const hots =
            bank.filter(x =>
                x.kategori === "HOTS"
            ).length;

        const literasi =
            bank.filter(x =>
                x.literasi === "Literasi"
            ).length;

        const mudah =
            bank.filter(x =>
                x.kesukaran === "Mudah"
            ).length;

        const sedang =
            bank.filter(x =>
                x.kesukaran === "Sedang"
            ).length;

        const sukar =
            bank.filter(x =>
                x.kesukaran === "Sukar"
            ).length;

        const layak =
            total === 25 &&
            (lots + bank.filter(x =>
                x.kategori === "MOTS"
            ).length) >= 1 &&
            hots >= 1 &&
            literasi >= 1 &&
            mudah >= 1 &&
            sedang >= 1 &&
            sukar >= 1;

        html += `
            <div
                class="bank-block"
                style="grid-column:1/-1"
            >

                <div class="bank-header">

                    <div>
                        <div class="bank-title">
                            ${escapeHTML(
                                bank[0].namaUjian
                            )}
                        </div>

                        <div
                            class="teacher-name"
                            style="margin-top:4px"
                        >
                            Guru:
                            ${escapeHTML(
                                bank[0].namaGuru
                            )}
                        </div>
                    </div>

                    <div>
                        <span class="badge ${
                            layak
                            ? "green-bg"
                            : "red-bg"
                        }">
                            ${layak
                                ? "LAYAK"
                                : "BELUM LAYAK"}
                        </span>
                    </div>

                </div>

                <div style="padding:15px">

                    <div class="bank-info">

                        <span class="badge blue-bg">
                            Total: ${total}/25
                        </span>

                        <span class="badge">
                            LOTS/MOTS: ${lots + bank.filter(x =>
                                x.kategori === "MOTS"
                            ).length}
                        </span>

                        <span class="badge purple-bg">
                            HOTS: ${hots}
                        </span>

                        <span class="badge green-bg">
                            Literasi: ${literasi}
                        </span>

                        <span class="badge">
                            Mudah: ${mudah}
                        </span>

                        <span class="badge orange-bg">
                            Sedang: ${sedang}
                        </span>

                        <span class="badge red-bg">
                            Sukar: ${sukar}
                        </span>

                    </div>

                    <div
                        style="
                            margin-top:12px;
                            font-size:13px;
                            color:#475569;
                        "
                    >
                        Syarat:
                        maksimal 25 soal,
                        total tepat 25,
                        LOTS/MOTS minimal 1,
                        HOTS minimal 1,
                        Literasi minimal 1,
                        Mudah minimal 1,
                        Sedang minimal 1,
                        Sukar minimal 1.
                    </div>

                </div>

            </div>
        `;
    });

    html += `</div>`;

    document.getElementById("eligibility").innerHTML =
        html;
}

/* =========================================================
   DIFFICULTY
========================================================= */

    const mudah =

        ).length;

    const sedang =
        data.filter(x =>

        ).length;

    const sukar =

        ).length;

        <div class="summary">

            <div class="card">

                    MUDAH
                </div>
                <div class="card-value green">
                    ${mudah}

/* =========================================================
   COGNITIVE
========================================================= */

function renderCognitive(data){

    const total =
        data.length || 1;

    const levels =
        ["C1","C2","C3","C4","C5","C6"];

    let html =
        `<div class="summary">`;

    levels.forEach(level => {

        const jumlah =
            data.filter(x =>
                x.kognitif === level
            ).length;

        html += `
            <div class="card">
                <div class="card-title">
                    ${level}
                </div>

                <div class="card-value purple">
                    ${jumlah}
                </div>

                <div style="
                    font-size:12px;
                    color:#64748b;
                ">
                    ${(jumlah / total * 100).toFixed(1)}%
                </div>
            </div>
        `;
    });

    html += `</div>`;

    document.getElementById("cognitive").innerHTML =
        html;
}

/* =========================================================
   MATRIX
========================================================= */

function renderMatrix(data){

    const combinations = [
        ["LOTS","Mudah"],
        ["MOTS","Mudah"],
        ["HOTS","Mudah"],
        ["LOTS","Sedang"],
        ["MOTS","Sedang"],
        ["HOTS","Sedang"],
        ["LOTS","Sukar"],
        ["MOTS","Sukar"],
        ["HOTS","Sukar"]
    ];

    let html =
        `<div class="matrix">`;

    combinations.forEach(([kategori,kesukaran]) => {

        const jumlah =
            data.filter(x =>
                x.kategori === kategori &&
                x.kesukaran === kesukaran
            ).length;

        html += `
            <div class="matrix-card">

                <div>
                    <strong style="font-size:16px">
                        ${kategori}
                    </strong>
                </div>

                <div
                    style="
                        color:#64748b;
                        margin-top:4px;
                    "
                >
                    ${kesukaran}
                </div>

                <strong>
                    ${jumlah}
                </strong>

            </div>
        `;
    });

    html += `</div>`;

    document.getElementById("matrix").innerHTML =
        html;
}

   DETAIL SOAL

                                <th>Kesukaran</th>

                        </thead>

        `;

        bank.forEach((soal,index) => {

                    ? "purple-bg"
                    : soal.kategori === "MOTS"
                        ? "orange-bg"
                        : "blue-bg";

            const kelasKesukaran =
                soal.kesukaran === "Sukar"
                    ? "red-bg"
                    : soal.kesukaran === "Sedang"
                        ? "orange-bg"
                        : "green-bg";

            const teksPertanyaan =
                stripHTML(
                    soal.pertanyaan || ""
                );

                    <td>

                        )}

                        <span class="badge ${kelasKognitif}">

                        <span class="badge ${kelasKesukaran}">
                            ${soal.kesukaran}
                        </span>
                    </td>

                    <td>
                        <span class="badge ${
                            soal.literasi === "Literasi"
                            ? "green-bg"
                            : ""
                        }">
                            ${soal.literasi}
                        </span>
                    </td>

                </tr>
            `;
        });

        html += `
                        </tbody>

                    </table>

                </div>

            </div>
        `;
    });

    document.getElementById("questionList").innerHTML =
        html;
}

========================================================= */

[
