function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function stripHTML(value){

    if(!value){
        return "";
    }

    const div =
        document.createElement("div");

    div.innerHTML =
        String(value);

    return (
        div.textContent ||
        div.innerText ||
        ""
    );
}


function normalizeText(value){

    return stripHTML(value)
        .toLowerCase()
        .replace(/\s+/g," ")
        .trim();
}

function getKunciJawaban(soal){

    const fields = [

        "kunci_jawaban",
        "kunciJawaban",
        "jawaban_benar",
        "jawabanBenar",
        "correct_answer",
        "correctAnswer",
        "answer_key",
        "answerKey",
        "kunci",
        "answer"

    ];

    for(
        const field of fields
    ){

        if(
            soal &&
            soal[field] !== undefined &&
            soal[field] !== null &&
            String(
                soal[field]
            ).trim() !== ""
        ){

            return String(
                soal[field]
            ).trim();

        }

    }

    return "";
}


function normalisasiKunci(kunci){

    if(!kunci){
        return "";
    }

    let x =
        normalizeText(kunci);

    x =
        x.replace(
            /^jawaban\s*/,
            ""
        );

    x =
        x.replace(
            /^opsi\s*/,
            ""
        );

    if(
        /^[abcd]$/.test(x)
    ){

        return x.toUpperCase();

    }

    if(
        x.startsWith("a.")
    ){

        return "A";

    }

    if(
        x.startsWith("b.")
    ){

        return "B";

    }

    if(
        x.startsWith("c.")
    ){

        return "C";

    }

    if(
        x.startsWith("d.")
    ){

        return "D";

    }

    return x;
}

    }


    if(score <= 2){

        return "Mudah";

    }


    if(score <= 5){

        return "Sedang";

    }


    return "Sukar";
}


/* =========================================================
   ANALISIS SOAL
========================================================= */

function analisisSoal(soal,ujian){

    const pertanyaan =
        soal?.pertanyaan || "";


    const literasi =
        cariLiterasi(soal);


    const kognitif =
        skorKKO(
            pertanyaan
        );


    const kategori =
        kategoriKognitif(
            kognitif
        );


    const kesukaran =
        tingkatKesukaran(
            soal,
            kognitif,
            literasi
        );


    return {

        ...soal,

        kognitif,

        kategori,

        kesukaran,

        literasi:
            literasi
                ? "Literasi"
                : "Non-Literasi",

        namaUjian:
            ujian?.judul ??
            ujian?.nama ??
            ujian?.nama_ujian ??
            ujian?.title ??
            "Bank Soal",

        mataPelajaran:
            ujian?.mata_pelajaran ??
            ujian?.mataPelajaran ??
            ujian?.mapel ??
            ujian?.subject ??
            "-",

        namaGuru:
            ujian?.namaGuru ??
            "-"

    };
}


/* =========================================================
   LOAD DATA ADMIN
   SEMUA GURU
   SEMUA MATA PELAJARAN
========================================================= */

async function loadData(){

    try{

        document.getElementById(
            "summary"
        ).innerHTML = `

            <div
                class="card"
                style="grid-column:1/-1"
            >

                <div class="loading">

                    Memuat seluruh data
                    bank soal...

                </div>

            </div>

        `;


        /* ================================================
           SEMUA GURU
        ================================================= */

        const {
            data:guruData,
            error:guruError
        } =
            await db
                .from("guru")
                .select("*");


        if(guruError){

            throw guruError;

        }


        semuaGuru =
            guruData || [];


        /* ================================================
           SEMUA UJIAN
           TIDAK FILTER GURU
           TIDAK FILTER MATA PELAJARAN
        ================================================= */

        const {
            data:ujianData,
            error:ujianError
        } =
            await db
                .from("ujian")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending:false
                    }
                );


        if(ujianError){

            throw ujianError;

        }


        semuaUjian =
            ujianData || [];


        /* ================================================
           MAP GURU
        ================================================= */

        const guruMap = {};


        semuaGuru.forEach(
            guru => {

                const id =
                    guru.id ??
                    guru.guru_id;


                if(id){

                    guruMap[
                        String(id)
                    ] =

                        guru.nama ??
                        guru.nama_guru ??
                        guru.name ??
                        guru.username ??
                        guru.nip ??
                        guru.nik ??
                        "-";

                }

            }
        );


        /* ================================================
           MAP UJIAN + GURU
        ================================================= */

        const ujianMap = {};


        semuaUjian.forEach(
            ujian => {

                const id =
                    ujian.id;


                if(!id){

                    return;

                }


                const guruId =

                    ujian.guru_id ??
                    ujian.guruId ??
                    ujian.teacher_id ??
                    ujian.teacherId ??
                    ujian.created_by ??
                    ujian.createdBy ??
                    ujian.pembuat_id ??
                    ujian.pembuatId ??
                    ujian.user_id ??
                    ujian.userId;


                let namaGuru =
                    "-";


                if(
                    guruId &&
                    guruMap[
                        String(guruId)
                    ]
                ){

                    namaGuru =
                        guruMap[
                            String(guruId)
                        ];

                }


                /*
                   Bila ujian menyimpan nama guru
                   langsung, gunakan juga.
                */

                namaGuru =

                    ujian.namaGuru ??
                    ujian.nama_guru ??
                    ujian.guru_nama ??
                    namaGuru;


                ujianMap[
                    String(id)
                ] = {

                    ...ujian,

                    namaGuru

                };

            }
        );


        /* ================================================
           AMBIL SEMUA SOAL
        ================================================= */

        const {
            data:soalData,
            error:soalError
        } =
            await db
                .from("soal")
                .select("*")
                .order(
                    "ujian_id",
                    {
                        ascending:true
                    }
                )
                .order(
                    "nomor",
                    {
                        ascending:true
                    }
                );


        if(soalError){

            throw soalError;

        }


        /* ================================================
           MAKSIMAL 25 SOAL PER BANK
        ================================================= */

        const jumlahPerBank = {};

        const hasil = [];


        (soalData || [])
            .forEach(
                soal => {

                    const ujianId =
                        soal.ujian_id;


                    if(!ujianId){

                        return;

                    }


                    const key =
                        String(ujianId);


                    /*
                       Soal hanya diproses jika
                       bank ujiannya ada.
                    */

                    const ujian =
                        ujianMap[key];


                    if(!ujian){

                        return;

                    }


                    if(
                        !jumlahPerBank[key]
                    ){

                        jumlahPerBank[key] =
                            0;

                    }


                    /*
                       MAKSIMAL 25
                       UNTUK SETIAP BANK SOAL
                    */

                    if(
                        jumlahPerBank[key] >= 25
                    ){

                        return;

                    }


                    jumlahPerBank[key]++;


                    hasil.push(
                        analisisSoal(
                            soal,
                            ujian
                        )
                    );

                }
            );


        semuaData =
            hasil;


        renderGuruFilter();

        renderUjianFilter();

        renderAll();


    }
    catch(error){

        console.error(
            "ERROR ANALISIS ADMIN:",
            error
        );


        showError(
            "Gagal memuat data: " +
            (
                error.message ||
                error
            )
        );

    }

}

/* =========================================================
   FILTER DATA
========================================================= */

function getFilteredData(){

    const ujian =
        document.getElementById(
            "ujianFilter"
        ).value;


    const guru =
        document.getElementById(
            "guruFilter"
        ).value;


    const kognitif =
        document.getElementById(
            "kognitifFilter"
        ).value;


    const kategori =
        document.getElementById(
            "kategoriFilter"
        ).value;


    const kesukaran =
        document.getElementById(
            "kesukaranFilter"
        ).value;


    const literasi =
        document.getElementById(
            "literasiFilter"
        ).value;


    const search =
        normalizeText(

            document.getElementById(
                "searchInput"
            ).value

        );


    return semuaData.filter(
        soal => {

            if(
                ujian &&
                String(
                    soal.ujian_id
                ) !== String(ujian)
            ){

                return false;

            }


            if(
                guru &&
                String(
                    soal.namaGuru
                ) !== String(guru)
            ){

                return false;

            }


            if(
                kognitif &&
                soal.kognitif !== kognitif
            ){

                return false;

            }


            if(
                kategori &&
                soal.kategori !== kategori
            ){

                return false;

            }


            if(
                kesukaran &&
                soal.kesukaran !== kesukaran
            ){

                return false;

            }


            if(
                literasi &&
                soal.literasi !== literasi
            ){

                return false;

            }


            if(search){

                const gabungan =
                    normalizeText(

                        `${soal.pertanyaan || ""}
                         ${soal.namaGuru || ""}
                         ${soal.namaUjian || ""}
                         ${soal.mataPelajaran || ""}`

                    );


                if(
                    !gabungan.includes(
                        search
                    )
                ){

                    return false;

                }

            }


            return true;

        }
    );

}

/* =========================================================

function groupByBank(data){

    const groups = {};


    data.forEach(
        soal => {

            const key =
                String(
                    soal.ujian_id
                );


            if(
                !groups[key]
            ){

                groups[key] = [];

            }


            groups[key].push(
                soal
            );

        }
    );


    return groups;

}

                                        <th>
                                            Kognitif
                                        </th>

                                        <th>
                                            Kategori
                                        </th>

                                        <th>
                                            Kesukaran
                                        </th>

                                        <th>
                                            Literasi
                                        </th>

                                    </tr>

                                </thead>


                                <tbody>

                `;


                bank.forEach(
                    (soal,index) => {

                        const kelasKognitif =

                            soal.kategori === "HOTS"

                                ? "purple-bg"

                                : soal.kategori === "MOTS"

                                    ? "orange-bg"

                                    : "blue-bg";


                        const kelasKesukaran =

                            soal.kesukaran === "Sukar"

                                ? "red-bg"

                                : soal.kesukaran === "Sedang"

                                    ? "orange-bg"

                                    : "green-bg";


                        const teksPertanyaan =
                            stripHTML(
                                soal.pertanyaan ||
                                ""
                            );


                        html += `

                            <tr>

                                <td>

                                    ${escapeHTML(
                                        soal.nomor ??
                                        index + 1
                                    )}

                                </td>


                                <td>

                                    <div
                                        class="question-text"
                                    >

                                        ${escapeHTML(
                                            teksPertanyaan
                                        )}

                                    </div>

                                </td>


                                <td>

                                    <span
                                        class="badge purple-bg"
                                    >

                                        ${soal.kognitif}

                                    </span>

                                </td>


                                <td>

                                    <span
                                        class="badge ${kelasKognitif}"
                                    >

                                        ${soal.kategori}

                                    </span>

                                </td>


                                <td>

                                    <span
                                        class="badge ${kelasKesukaran}"
                                    >

                                        ${soal.kesukaran}

                                    </span>

                                </td>


                                <td>

                                    <span
                                        class="badge ${
                                            soal.literasi ===
                                            "Literasi"
                                                ? "green-bg"
                                                : ""
                                        }"
                                    >

                                        ${soal.literasi}

                                    </span>

                                </td>

                            </tr>

                        `;

                    }
                );


                html += `

                                </tbody>

                            </table>

                        </div>

                    </div>

                `;

            }
        );


    document.getElementById(
        "questionList"
    ).innerHTML =
        html;

}


/* =========================================================
   EVENT FILTER
========================================================= */

[
    "ujianFilter",
    "guruFilter",
    "kognitifFilter",
    "kategoriFilter",
    "kesukaranFilter",
    "literasiFilter"

].forEach(
    id => {

        document.getElementById(id)
            .addEventListener(
                "change",
                renderAll
            );

    }
);


document.getElementById(
    "searchInput"
).addEventListener(
    "input",
    renderAll
);


/* =========================================================
   MULAI
========================================================= */

loadData();

</script>

</body>
</html>
