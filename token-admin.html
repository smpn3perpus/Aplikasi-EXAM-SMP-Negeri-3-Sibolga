<body>

<header class="header">

    <div>
        <h1>🔑 TOKEN UJIAN</h1>
        <p>RUANG EXAM — SMP Negeri 3 Sibolga</p>
    </div>

    <div class="header-buttons">

        <button
            class="btn btn-back"
            onclick="kembaliDashboard()">
            ← Dashboard
        </button>

        <button
            class="btn btn-refresh"
            onclick="loadData()">
            🔄 Refresh
        </button>

    </div>

</header>


<main class="container">

    <div id="message" class="message"></div>

    <section class="exam-box">

        <label>Pilih Ujian</label>

        <div class="exam-row">

            <select id="ujianSelect">
                <option value="">
                    ⏳ Memuat daftar ujian...
                </option>
            </select>

            <button
                class="btn btn-generate"
                onclick="buatToken()">
                🔑 Generate Token
            </button>

        </div>

    </section>


    <div id="tokenContainer">

        <div class="empty">
            ⏳ Memuat token...
        </div>

    </div>

</main>


<footer class="footer">

    RUANG EXAM Online<br>
    Dibuat oleh Mr. Rahmat Batubara, S.T.P

</footer>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://sztfucrmjexoalyiwwnq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_j724cUM7NNHl8wbxq9ZHKw_FLFJAuGn";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   SESSION
===================================================== */

const sessionRaw =
    localStorage.getItem("exam_user");

if(!sessionRaw){

    window.location.href = "login.html";

}

let currentUser = null;

try{

    currentUser = JSON.parse(sessionRaw);

    if(currentUser.role !== "admin"){

        localStorage.removeItem("exam_user");

        window.location.href = "login.html";

    }

}catch(error){

    localStorage.removeItem("exam_user");

    window.location.href = "login.html";

}


/* =====================================================
   DATA
===================================================== */

let semuaUjian = [];

let semuaToken = [];


/* =====================================================
   PESAN
===================================================== */

function showMessage(text,type){

    const el =
        document.getElementById("message");

    el.textContent = text;

    el.className =
        "message " + type;

}

function hideMessage(){

    const el =
        document.getElementById("message");

    el.textContent = "";

    el.className = "message";

}


/* =====================================================
   LOAD DATA
===================================================== */

async function loadData(){

    hideMessage();

    try{

        const hasilUjian =
            await supabaseClient
            .from("ujian")
            .select(`
                id,
                judul,
                status
            `)
            .order(
                "created_at",
                {ascending:false}
            );

        if(hasilUjian.error){

            throw hasilUjian.error;

        }

        semuaUjian =
            hasilUjian.data || [];

        isiDropdown();

        await loadToken();

    }catch(error){

        console.error(error);

        showMessage(
            "Gagal memuat data: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   DROPDOWN
===================================================== */

function isiDropdown(){

    const select =
        document.getElementById(
            "ujianSelect"
        );

    select.innerHTML = `
        <option value="">
            -- Pilih Ujian --
        </option>
    `;

    semuaUjian.forEach(ujian=>{

        select.innerHTML += `
            <option value="${ujian.id}">
                ${escapeHtml(ujian.judul)}
            </option>
        `;

    });

}


/* =====================================================
   LOAD TOKEN
===================================================== */

async function loadToken(){

    const hasil =
        await supabaseClient
        .from("token_ujian")
        .select(`
            id,
            ujian_id,
            token,
            aktif,
            berlaku_mulai,
            berlaku_sampai,
            created_at
        `)
        .order(
            "created_at",
            {ascending:false}
        );

    if(hasil.error){

        throw hasil.error;

    }

    semuaToken =
        hasil.data || [];

    tampilkanToken();

}


/* =====================================================
   TAMPILKAN TOKEN
===================================================== */

function tampilkanToken(){

    const container =
        document.getElementById(
            "tokenContainer"
        );

    if(!semuaToken.length){

        container.innerHTML = `
            <div class="empty">
                🔑 Belum ada token ujian.
                <br><br>
                Pilih ujian kemudian klik
                <strong>Generate Token</strong>.
            </div>
        `;

        return;

    }

    container.innerHTML =
        semuaToken.map(token=>{

            const ujian =
                semuaUjian.find(
                    u => u.id === token.ujian_id
                );

            const judul =
                ujian
                ? ujian.judul
                : "Ujian";

            const statusClass =
                token.aktif
                ? "active"
                : "inactive";

            const statusText =
                token.aktif
                ? "AKTIF"
                : "NONAKTIF";

            return `

                <div class="token-card">

                    <div class="token-top">

                        <div>

                            <h2>
                                ${escapeHtml(judul)}
                            </h2>

                            <div style="margin-top:12px">

                                <span class="badge ${statusClass}">
                                    ${statusText}
                                </span>

                            </div>

                        </div>


                        <div class="token-value">

                            ${escapeHtml(token.token)}

                        </div>


                        <div class="token-actions">

                            <button
                                class="btn btn-copy"
                                onclick="salinToken('${escapeJs(token.token)}')">

                                📋 Salin

                            </button>

                            <button
                                class="btn btn-toggle"
                                onclick="toggleToken('${token.id}',${token.aktif})">

                                ${token.aktif
                                    ? "🔴 Nonaktifkan"
                                    : "🟢 Aktifkan"}

                            </button>

                            <button
                                class="btn btn-delete"
                                onclick="hapusToken('${token.id}')">

                                🗑️ Hapus

                            </button>

                        </div>

                    </div>


                    <div class="token-info">

                        <div class="info-item">

                            <strong>
                                Berlaku Mulai
                            </strong>

                            <span>
                                ${formatTanggal(token.berlaku_mulai)}
                            </span>

                        </div>


                        <div class="info-item">

                            <strong>
                                Berlaku Sampai
                            </strong>

                            <span>
                                ${formatTanggal(token.berlaku_sampai)}
                            </span>

                        </div>


                        <div class="info-item">

                            <strong>
                                Dibuat
                            </strong>

                            <span>
                                ${formatTanggal(token.created_at)}
                            </span>

                        </div>

                    </div>

                </div>

            `;

        }).join("");

}


/* =====================================================
   BUAT TOKEN
===================================================== */

async function buatToken(){

    const ujianId =
        document.getElementById(
            "ujianSelect"
        ).value;

    if(!ujianId){

        alert(
            "Silakan pilih ujian terlebih dahulu."
        );

        return;

    }


    const ujian =
        semuaUjian.find(
            u => u.id === ujianId
        );


    const token =
        generateToken();


    try{

        /*
           Token baru berlaku mulai sekarang
           dan berlaku selama 24 jam.
        */

        const mulai =
            new Date();

        const selesai =
            new Date(
                mulai.getTime()
                + 24 * 60 * 60 * 1000
            );


        const hasil =
            await supabaseClient
            .from("token_ujian")
            .insert({

                ujian_id:
                    ujianId,

                token:
                    token,

                aktif:
                    true,

                berlaku_mulai:
                    mulai.toISOString(),

                berlaku_sampai:
                    selesai.toISOString()

            });


        if(hasil.error){

            throw hasil.error;

        }


        showMessage(
            "Token untuk " +
            (ujian
                ? ujian.judul
                : "ujian") +
            " berhasil dibuat.",
            "success"
        );


        await loadToken();

    }catch(error){

        console.error(error);

        showMessage(
            "Gagal membuat token: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   GENERATE TOKEN
===================================================== */

function generateToken(){

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let hasil = "";

    for(let i=0;i<6;i++){

        hasil +=
            chars.charAt(
                Math.floor(
                    Math.random() *
                    chars.length
                )
            );

    }

    return hasil;

}


/* =====================================================
   SALIN TOKEN
===================================================== */

async function salinToken(token){

    try{

        await navigator.clipboard.writeText(
            token
        );

        showMessage(
            "Token " +
            token +
            " berhasil disalin.",
            "success"
        );

    }catch(error){

        alert(
            "Token: " +
            token
        );

    }

}


/* =====================================================
   TOGGLE
===================================================== */

async function toggleToken(id,status){

    try{

        const hasil =
            await supabaseClient
            .from("token_ujian")
            .update({

                aktif:
                    !status

            })
            .eq(
                "id",
                id
            );

        if(hasil.error){

            throw hasil.error;

        }

        showMessage(
            !status
            ? "Token berhasil diaktifkan."
            : "Token berhasil dinonaktifkan.",
            "success"
        );

        await loadToken();

    }catch(error){

        console.error(error);

        showMessage(
            "Gagal mengubah status token: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   HAPUS
===================================================== */

async function hapusToken(id){

    const yakin =
        confirm(
            "Yakin ingin menghapus token ini?"
        );

    if(!yakin){

        return;

    }

    try{

        const hasil =
            await supabaseClient
            .from("token_ujian")
            .delete()
            .eq(
                "id",
                id
            );

        if(hasil.error){

            throw hasil.error;

        }

        showMessage(
            "Token berhasil dihapus.",
            "success"
        );

        await loadToken();

    }catch(error){

        console.error(error);

        showMessage(
            "Gagal menghapus token: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   FORMAT TANGGAL
===================================================== */

function formatTanggal(value){

    if(!value){

        return "-";

    }

    try{

        return new Date(value)
        .toLocaleString(
            "id-ID",
            {
                dateStyle:"medium",
                timeStyle:"short"
            }
        );

    }catch(error){

        return value;

    }

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function escapeJs(value){

    return String(value)
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");

}


/* =====================================================
   DASHBOARD
===================================================== */

function kembaliDashboard(){

    window.location.href =
        "admin.html";

}


/* =====================================================
   LOAD AWAL
===================================================== */

loadData();

</script>

</body>
</html>
