/* =========================================================
   CARI LITERASI
========================================================= */

function cariLiterasi(soal){

    if(soal.literasi_id){

        const found =
            daftarLiterasiSoal.find(
                x =>
                    String(x.id) ===
                    String(soal.literasi_id)
            );

        if(found){

            return {
                isLiterasi:true,
                data:found
            };
        }
    }

    const nomor =
        Number(
            soal.nomor
        );

    if(
        Number.isFinite(nomor)
    ){

        const found =
            daftarLiterasiSoal.find(
                x=>{

                    if(
                        String(x.ujian_id) !==
                        String(soal.ujian_id)
                    ){

                        return false;
                    }

                    const mulai =
                        Number(
                            x.nomor_mulai
                        );

                    const selesai =
                        Number(
                            x.nomor_selesai
                        );

                    if(
                        !Number.isFinite(mulai) ||
                        !Number.isFinite(selesai)
                    ){

                        return false;
                    }

                    return (
                        nomor >= mulai &&
                        nomor <= selesai
                    );
                }
            );

        if(found){

            return {
                isLiterasi:true,
                data:found
            };
        }
    }

    if(
        Number.isFinite(nomor)
    ){

        const foundLegacy =
            daftarLiterasiLegacy.find(
                x=>{

                    if(
                        !x.ujian_id
                    ){

                        return false;
                    }

                    if(
                        String(x.ujian_id) !==
                        String(soal.ujian_id)
                    ){

                        return false;
                    }

                    const mulai =
                        Number(
                            x.nomor_mulai
                        );

                    const selesai =
                        Number(
                            x.nomor_selesai
                        );

                    if(
                        !Number.isFinite(mulai) ||
                        !Number.isFinite(selesai)
                    ){

                        return false;
                    }

                    return (
                        nomor >= mulai &&
                        nomor <= selesai
                    );
                }
            );

        if(foundLegacy){

            return {
                isLiterasi:true,
                data:foundLegacy
            };
        }
    }

    return {
        isLiterasi:false,
        data:null
    };
}


/* =========================================================
   AMBIL PILIHAN JAWABAN
========================================================= */

function ambilPilihan(soal){

    const huruf = [
        "a",
        "b",
        "c",
        "d",
        "e"
    ];

    const hasil = [];

    huruf.forEach(
        huruf=>{

            const kandidat = [

                `pilihan_${huruf}`,
                `pilihan${huruf}`,
                `opsi_${huruf}`,
                `opsi${huruf}`,
                `option_${huruf}`,
                `option${huruf}`,
                `jawaban_${huruf}`,
                `jawaban${huruf}`,
                `choice_${huruf}`,
                `choice${huruf}`,
                `answer_${huruf}`,
                `answer${huruf}`

            ];

            let nilai = "";

            for(
                const key of kandidat
            ){

                if(
                    soal[key] !== undefined &&
                    soal[key] !== null &&
                    String(soal[key]).trim() !== ""
                ){

                    nilai =
                        String(
                            soal[key]
                        ).trim();

                    break;
                }
            }

            if(nilai){

                hasil.push({

                    huruf:
                        huruf.toUpperCase(),

                    teks:
                        nilai

                });

            }

        }
    );

    if(
        hasil.length === 0 &&
        soal.pilihan
    ){

        try{

            let dataPilihan =
                soal.pilihan;

            if(
                typeof dataPilihan ===
                "string"
            ){

                dataPilihan =
                    JSON.parse(
                        dataPilihan
                    );

            }

            if(
                Array.isArray(
                    dataPilihan
                )
            ){

                dataPilihan
                    .slice(0,5)
                    .forEach(
                        (nilai,index)=>{

                            if(
                                nilai !== null &&
                                nilai !== undefined &&
                                String(nilai).trim()
                            ){

                                hasil.push({

                                    huruf:
                                        String.fromCharCode(
                                            65 + index
                                        ),

                                    teks:
                                        String(
                                            nilai
                                        ).trim()

                                });

                            }

                        }
                    );

            }

        }catch(error){

            console.warn(
                "Format pilihan tidak dapat dibaca:",
                error
            );

        }

    }

    return hasil;
}


/* =========================================================
   BERSIHKAN TEKS PILIHAN
========================================================= */

function bersihkanPilihan(text){

    return String(
        text || ""
    )
    .replace(
        /^[A-Ea-e][\.\):\-]\s*/,
        ""
    )
    .replace(
        /\s+/g,
        " "
    )
    .trim();

}


/* =========================================================
   ANALISIS PILIHAN JAWABAN
========================================================= */

function analisisPilihanJawaban(soal){

    const pilihan =
        ambilPilihan(
            soal
        )
        .map(
            x=>({

                huruf:x.huruf,

                teks:
                    bersihkanPilihan(
                        x.teks
                    )

            })
        )
        .filter(
            x =>
                x.teks.length > 0
        );

    if(
        pilihan.length === 0
    ){

        return {

            jumlah:0,
            skor:0,

            alasan:
                "Pilihan jawaban tidak tersedia pada data soal."

        };

    }

    let skor = 0;
    let alasan = [];


    if(
        pilihan.length >= 5
    ){

        skor += 3;

    }else if(
        pilihan.length >= 4
    ){

        skor += 2;

    }


    const panjang =
        pilihan.map(
            x =>
                x.teks
                    .split(/\s+/)
                    .filter(Boolean)
                    .length
        );


    const rataRata =
        panjang.reduce(
            (a,b)=>a+b,
            0
        ) /
        panjang.length;


    /*
       Panjang pilihan hanya menjadi indikator kecil.
    */

    if(
        rataRata >= 15
    ){

        skor += 3;

        alasan.push(
            "pilihan jawaban memuat penjelasan cukup kompleks"
        );

    }else if(
        rataRata >= 8
    ){

        skor += 1;

    }


    const opsiPenalaran =
        pilihan.filter(
            x =>
                /\bkarena\b|\bsehingga\b|\bagar\b|\bdengan demikian\b|\bapabila\b|\bjika\b/i
                .test(x.teks)
        ).length;

    if(
        opsiPenalaran >= 2
    ){

        skor += 4;

        alasan.push(
            "alternatif jawaban memuat alasan atau hubungan logis"
        );

    }


    const maxPanjang =
        Math.max(
            ...panjang
        );

    const minPanjang =
        Math.min(
            ...panjang
        );

    if(
        maxPanjang -
        minPanjang >= 12
    ){

        alasan.push(
            "panjang pilihan jawaban tidak terlalu seragam"
        );

    }


    const opsiKompleks =
        pilihan.filter(
            x =>
                /\bdan\b|\bserta\b|\bkemudian\b|\bsehingga\b|\bkarena\b/i
                .test(x.teks)
        ).length;

    if(
        opsiKompleks >= 3
    ){

        skor += 3;

        alasan.push(
            "beberapa alternatif memiliki lebih dari satu unsur"
        );

    }


    return {

        jumlah:
            pilihan.length,

        skor:
            Math.min(
                skor,
                15
            ),

        alasan:
            alasan.length
                ? alasan.join(", ") + "."
                : "Pilihan jawaban relatif sederhana."

    };

}


/* =========================================================

function normalisasiTeks(text){

    return String(
        text || ""
    )
    .toLowerCase()
    .replace(
        /\s+/g,
        " "
    )
    .trim();

}


function hitungKata(text){

    return normalisasiTeks(text)
        .split(/\s+/)
        .filter(Boolean)
        .length;

}


function hitungKemunculan(text, regex){

    const hasil =
        text.match(regex);

    return hasil
        ? hasil.length
        : 0;

}

/* =========================================================
   DETEKSI C5
   LEBIH KETAT
========================================================= */

function deteksiC5(text){

    /*
       Jangan menganggap:
       "manakah yang paling tepat"
       sebagai C5.

       Harus ada tindakan evaluasi,
       kriteria, pertimbangan,
       efektivitas, kelayakan,
       atau justifikasi.
    */

    const polaKuat = [

        /\bevaluasi\b/i,
        /\bmengevaluasi\b/i,
        /\bnilailah\b/i,
        /\bmenilai\b.*\bberdasarkan\b/i,
        /\bkritisi\b/i,
        /\bkritikilah\b/i,
        /\bsetujukah\b/i,
        /\btepatkah\b/i,
        /\blayakkah\b/i,
        /\bsejauh mana\b/i,
        /\bberikan justifikasi\b/i,
        /\bberikan alasan atas pilihan\b/i,
        /\bjelaskan alasan pilihan\b/i,
        /\bpaling efektif\b.*\bmengapa\b/i,
        /\bpaling tepat\b.*\bmengapa\b/i,
        /\bpaling sesuai\b.*\bmengapa\b/i,
        /\bpilihan yang lebih efektif\b/i,
        /\bpilihan yang paling efektif\b/i,
        /\bkelayakan\b/i

    ];

    return polaKuat.some(
        p =>
            p.test(text)
    );

}


/* =========================================================
   DETEKSI C4
   TIDAK HANYA BERDASARKAN KATA "ANALISIS"
========================================================= */

function deteksiC4(text){

    /*
       C4 kuat:
       soal meminta hubungan antar informasi,
       penerapan aturan pada situasi,
       perbandingan, konsekuensi,
       sebab-akibat, pola, atau ketidaksesuaian.
    */

    const polaKuat = [

        /\banalisislah\b/i,
        /\bmenganalisis\b/i,

        /\bbandingkan\b/i,
        /\bmembandingkan\b/i,

        /\bhubungkan\b/i,
        /\bmenghubungkan\b/i,
        /\bhubungan antara\b/i,
        /\bketerkaitan\b/i,

        /\bsebab dan akibat\b/i,
        /\bsebab-akibat\b/i,

        /\bkemungkinan yang terjadi\b/i,
        /\bkemungkinan terjadi\b/i,

        /\bapa yang terjadi jika\b/i,
        /\bapa akibatnya jika\b/i,
        /\bapa dampaknya jika\b/i,

        /\bberdasarkan kondisi\b/i,
        /\bberdasarkan informasi\b/i,
        /\bberdasarkan data\b/i,
        /\bberdasarkan tabel\b/i,
        /\bberdasarkan grafik\b/i,

        /\bkesalahan\b/i,
        /\bketidaksesuaian\b/i,
        /\bbertentangan\b/i,

        /\bpola\b.*\bperubahan\b/i,
        /\bperubahan\b.*\bpola\b/i,

        /\bmengapa .* terjadi\b/i,
        /\bmengapa .* dapat terjadi\b/i

    ];

    if(
        polaKuat.some(
            p =>
                p.test(text)
        )
    ){

        return true;

    }


    /*
       Kombinasi beberapa indikator juga
       dapat menunjukkan analisis walaupun
       tidak menggunakan kata "analisis".
    */

    const indikatorKombinasi = [

        /\bjika\b|\bapabila\b|\bseandainya\b/i,
        /\bnamun\b|\bsedangkan\b|\bmeskipun\b|\bwalaupun\b/i,
        /\bkarena\b|\bsehingga\b|\bakibatnya\b/i,
        /\bdibandingkan\b|\bperbedaan\b/i,
        /\bdua\b|\bkedua\b|\bkeduanya\b/i,
        /\bkemungkinan\b|\bdampak\b|\bkonsekuensi\b/i

    ];

    let jumlah = 0;

    indikatorKombinasi.forEach(
        p=>{

            if(
                p.test(text)
            ){

                jumlah++;

            }

        }
    );


    /*
       Minimal dua indikator yang saling
       berkaitan agar dianggap C4.
    */

    return jumlah >= 2;

}


/* =========================================================
   DETEKSI C3
========================================================= */

function deteksiC3(text){

    const pola = [

        /\bhitunglah\b/i,
        /\bhitung\b/i,
        /\bgunakan rumus\b/i,
        /\bgunakan konsep\b/i,
        /\bterapkan\b/i,
        /\bmenerapkan\b/i,
        /\bgunakan prinsip\b/i,
        /\btentukan dengan rumus\b/i,
        /\bpraktikkan\b/i,
        /\bterapkan pada\b/i

    ];

    return pola.some(
        p =>

    );

}

/* =========================================================
   HITUNG STRUKTUR PENALARAN
   INI YANG MENENTUKAN KESUKARAN
========================================================= */

function hitungIndikatorPenalaran(text){

    let skor = 0;
    let jumlah = 0;
    let alasan = [];


    /*
       1. KONDISI
    */

    const kondisi =
        hitungKemunculan(
            text,
            /\b(jika|apabila|seandainya|ketika)\b/gi
        );

    if(kondisi){

        skor += Math.min(
            kondisi * 6,
            10
        );

        jumlah++;

        alasan.push(
            "memuat kondisi yang harus dipertimbangkan"
        );

    }


    /*
       2. KONTRAS
    */

    const kontras =
        hitungKemunculan(
            text,
            /\b(namun|sedangkan|meskipun|walaupun|sebaliknya)\b/gi
        );

    if(kontras){

        skor += Math.min(
            kontras * 6,
            10
        );

        jumlah++;

        alasan.push(
            "memuat kontras atau perbedaan kondisi"
        );

    }


    /*
       3. SEBAB-AKIBAT
    */

    const sebab =
        hitungKemunculan(
            text,
            /\b(karena|sehingga|akibatnya|disebabkan|berdampak)\b/gi
        );

    if(sebab){

        skor += Math.min(
            sebab * 6,
            10
        );

        jumlah++;

        alasan.push(
            "memuat hubungan sebab-akibat"
        );

    }


    /*
       4. PERBANDINGAN
    */

    const banding =
        hitungKemunculan(
            text,
            /\b(bandingkan|dibandingkan|perbedaan|berbeda|lebih .* daripada|sedangkan)\b/gi
        );

    if(banding){

        skor += Math.min(
            banding * 6,
            10
        );

        jumlah++;

        alasan.push(
            "memerlukan perbandingan informasi"
        );

    }


    /*
       5. KONSEKUENSI / PREDIKSI
    */

    const konsekuensi =
        hitungKemunculan(
            text,
            /\b(kemungkinan|dampak|konsekuensi|akibat|apa yang terjadi)\b/gi
        );

    if(konsekuensi){

        skor += Math.min(
            konsekuensi * 6,
            10
        );

        jumlah++;

        alasan.push(
            "memerlukan prediksi atau penentuan konsekuensi"
        );

    }


    /*
       6. KETIDAKSESUAIAN
    */

    const tidakSesuai =
        hitungKemunculan(
            text,
            /\b(kesalahan|tidak sesuai|bertentangan|keliru|ketidaksesuaian)\b/gi
        );

    if(tidakSesuai){

        skor += Math.min(
            tidakSesuai * 7,
            10
        );

        jumlah++;

        alasan.push(
            "memerlukan identifikasi ketidaksesuaian"
        );

    }


    /*
       7. BEBERAPA OBJEK / KASUS
    */

    const beberapaObjek =
        /\b(dua|kedua|keduanya|masing-masing|dua kondisi|dua kasus|beberapa)\b/i
        .test(text);

    if(beberapaObjek){

        skor += 5;

        jumlah++;

        alasan.push(
            "melibatkan lebih dari satu objek atau kondisi"
        );

    }


    /*
       8. URUTAN PROSES
    */

    const urutan =
        hitungKemunculan(
            text,
            /\b(sebelum|setelah|kemudian|selanjutnya|pada saat)\b/gi
        );

    if(
        urutan >= 2
    ){

        skor += 6;

        jumlah++;

        alasan.push(
            "memerlukan pengolahan urutan informasi"
        );

    }


    /*
       9. DATA / INFORMASI
    */

    const data =
        /\bberdasarkan data\b|\bberdasarkan tabel\b|\bberdasarkan grafik\b|\bberdasarkan informasi\b/i
        .test(text);

    if(data){

        skor += 5;

        jumlah++;

        alasan.push(
            "menggunakan informasi atau data sebagai dasar"
        );

    }


    /*
       10. BANYAK KEPUTUSAN
    */

    const keputusan =
        hitungKemunculan(
            text,
            /\b(pilih|tentukan|tentukanlah|manakah|strategi|solusi)\b/gi
        );

    if(
        keputusan >= 2
    ){

        skor += 5;

        jumlah++;

        alasan.push(
            "memerlukan lebih dari satu pertimbangan keputusan"
        );

    }


    return {

        skor:
            Math.min(
                skor,
                50
            ),

        jumlah,

        alasan

    };

}


/* =========================================================
   ANALISIS KOGNITIF
========================================================= */

function analisisKognitif(soal){

    const text =
        normalisasiTeks(
            soal.pertanyaan
        );


    /*
       C6
    */

    if(
        deteksiC6(text)
    ){

        return {

            level:"C6",
            nama:"Mencipta",
            kategori:"HOTS",

            alasan:
                "Menuntut peserta didik merancang, menciptakan, mengembangkan, memodifikasi, atau menghasilkan solusi/produk."

        };
    }


    /*
       C5
    */

    if(
        deteksiC5(text)
    ){

        return {

            level:"C5",
            nama:"Mengevaluasi",
            kategori:"HOTS",

            alasan:
                "Menuntut peserta didik memberikan penilaian berdasarkan pertimbangan, kriteria, efektivitas, kelayakan, atau justifikasi."

        };
    }


    /*
       C4
    */

    if(
        deteksiC4(text)
    ){

        return {

            level:"C4",
            nama:"Menganalisis",
            kategori:"HOTS",

            alasan:
                "Menuntut peserta didik menghubungkan informasi, membandingkan kondisi, menemukan sebab-akibat, menentukan konsekuensi, atau mengenali ketidaksesuaian."

        };
    }


    /*
       C3
    */

    if(
        deteksiC3(text)
    ){

        return {

            level:"C3",
            nama:"Menerapkan",
            kategori:"MOTS",

            alasan:
                "Menuntut peserta didik menerapkan konsep, prinsip, rumus, atau prosedur pada suatu situasi."

        };
    }


    /*
       C2
    */

    if(
        deteksiC2(text)
    ){

        return {

            level:"C2",
            nama:"Memahami",
            kategori:"LOTS",

            alasan:
                "Menuntut peserta didik menjelaskan, menguraikan, menerangkan, atau menunjukkan pemahaman terhadap suatu konsep."

        };
    }


    /*
       C1
    */

    if(
        deteksiC1(text)
    ){

        return {

            level:"C1",
            nama:"Mengingat",
            kategori:"LOTS",

            alasan:
                "Menuntut peserta didik mengingat fakta, istilah, nama, definisi, atau informasi."

        };
    }


    return {

        level:"C2",
        nama:"Memahami",
        kategori:"LOTS",

        alasan:
            "Tidak ditemukan tuntutan analisis, evaluasi, penerapan, atau penciptaan yang cukup kuat; soal diklasifikasikan sebagai pemahaman."

    };

}


/* =========================================================
   ANALISIS KESUKARAN BARU
========================================================= */

function analisisKesukaran(soal){

    const text =
        normalisasiTeks(
            soal.pertanyaan
        );


    if(!text){

        return {

            tingkat:"Sedang",
            skor:50,

            alasan:
                "Teks soal belum tersedia."

        };

    }


    const kognitif =
        analisisKognitif(
            soal
        );


    const penalaran =
        hitungIndikatorPenalaran(
            text
        );


    const pilihan =
        analisisPilihanJawaban(
            soal
        );


    /*
       =====================================================
       DASAR KOGNITIF
       =====================================================

       C1  -> sangat rendah
       C2  -> rendah
       C3  -> menengah
       C4  -> dapat mudah/sedang/sukar
       C5  -> tinggi
       C6  -> tinggi
    */

    const base = {

        C1:15,
        C2:20,
        C3:28,
        C4:32,
        C5:45,
        C6:50

    };


    let skor =
        base[
            kognitif.level
        ] || 20;


    let alasan = [];


    /*
       PENALARAN ADALAH FAKTOR UTAMA
    */

    skor +=
        penalaran.skor;


    if(
        penalaran.alasan.length
    ){

        alasan.push(
            penalaran.alasan.join(", ")
        );

    }


    /*
       PILIHAN JAWABAN HANYA BONUS KECIL
    */

    skor +=
        Math.min(
            pilihan.skor,
            10
        );


    if(
        pilihan.jumlah > 0
    ){

        alasan.push(
            `${pilihan.jumlah} pilihan jawaban dianalisis`
        );

    }


    /*
       PANJANG TEKS TIDAK LAGI MENENTUKAN LEVEL.

       Hanya jika sangat panjang sekali,
       beri bonus maksimal 2 poin.
    */

    const jumlahKata =
        hitungKata(
            text
        );


    if(
        jumlahKata >= 100
    ){

        skor += 2;

        alasan.push(
            "stimulus sangat panjang, tetapi panjang teks hanya menjadi faktor kecil"
        );

    }


    /*
       =====================================================
       KHUSUS C4
       =====================================================

       C4 + penalaran sedikit
       -> Mudah

       C4 + penalaran sedang
       -> Sedang

       C4 + penalaran banyak
       -> Sukar
    */

    if(
        kognitif.level === "C4"
    ){

        if(
            penalaran.skor <= 10
        ){

            alasan.push(
                "analisis C4 masih sederhana"
            );

        }else if(
            penalaran.skor <= 25
        ){

            alasan.push(
                "analisis C4 melibatkan beberapa hubungan informasi"
            );

        }else{

            alasan.push(
                "analisis C4 melibatkan beberapa proses penalaran"
            );

        }

    }


    /*
       =====================================================
       KHUSUS C5
       =====================================================
    */

    if(
        kognitif.level === "C5"
    ){

        if(
            penalaran.jumlah >= 2
        ){

            skor += 5;

            alasan.push(
                "evaluasi melibatkan beberapa pertimbangan"
            );

        }

    }


    /*
       =====================================================
       KHUSUS C6
       =====================================================
    */

    if(
        kognitif.level === "C6"
    ){

        if(
            penalaran.jumlah >= 2
        ){

            skor += 6;

            alasan.push(
                "penciptaan memerlukan beberapa pertimbangan"
            );

        }

    }


    /*
       BATAS NILAI
    */

    skor =
        Math.max(
            0,
            Math.min(
                100,
                Math.round(
                    skor
                )
            )
        );


    let tingkat;


    /*
       0–39   MUDAH
       40–64  SEDANG
       65–100 SUKAR
    */

    if(
        skor < 40
    ){

        tingkat =
            "Mudah";

    }else if(
        skor < 65
    ){

        tingkat =
            "Sedang";

    }else{

        tingkat =
            "Sukar";

    }


    /*
       KETERANGAN KHUSUS HOTS
    */

    if(
        kognitif.kategori ===
        "HOTS"
    ){

        if(
            tingkat ===
            "Mudah"
        ){

            alasan.push(
                "soal HOTS memiliki tuntutan penalaran sederhana sehingga tetap dapat dikategorikan Mudah"
            );

        }else if(
            tingkat ===
            "Sedang"
        ){

            alasan.push(
                "soal HOTS memerlukan beberapa langkah penalaran tetapi belum sangat kompleks"
            );

        }else{

            alasan.push(
                "soal HOTS memerlukan beberapa hubungan informasi, pertimbangan, atau proses penalaran yang kompleks"
            );

        }

    }


    if(
        alasan.length === 0
    ){

        alasan.push(
            "karakteristik soal relatif sederhana"
        );

    }


    return {

        tingkat,

        skor,

        alasan:
            alasan.join(". ") + "."

    };

}


/* =========================================================
   BUAT ANALISIS
========================================================= */

function buatAnalisis(){

    dataAnalisis =
        daftarSoal.map(
            soal=>{

                const kognitif =
                    analisisKognitif(
                        soal
                    );

                const kesukaran =
                    analisisKesukaran(
                        soal
                    );

                const literasi =
                    cariLiterasi(
                        soal
                    );

                const isLiterasi =
                    literasi.isLiterasi;

                const literasiHOTS =
                    isLiterasi &&
                    kognitif.kategori ===
                    "HOTS";


                return {

                    ...soal,

                    kognitif,
                    kesukaran,

                    literasi,

                    isLiterasi,

                    literasiHOTS

                };

            }
        );

}


/* =========================================================
   FILTER DATA
========================================================= */

function getFilteredData(){

    const ujian =
        document.getElementById(
            "filterUjian"
        ).value;

    const kognitif =
        document.getElementById(
            "filterKognitif"
        ).value;

    const kategori =
        document.getElementById(
            "filterKategori"
        ).value;

    const kesukaran =
        document.getElementById(
            "filterKesukaran"
        ).value;

    const literasi =
        document.getElementById(
            "filterLiterasi"
        ).value;

    const search =
        document.getElementById(
            "search"
        ).value
        .toLowerCase()
        .trim();


    return dataAnalisis.filter(
        item=>{

            if(
                ujian &&
                String(item.ujian_id) !==
                String(ujian)
            ){

                return false;
            }


            if(
                kognitif &&
                item.kognitif.level !==
                kognitif
            ){

                return false;
            }


            if(
                kategori &&
                item.kognitif.kategori !==
                kategori
            ){

                return false;
            }


            if(
                kesukaran &&
                item.kesukaran.tingkat !==
                kesukaran
            ){

                return false;
            }


            if(
                literasi ===
                "Literasi" &&
                !item.isLiterasi
            ){

                return false;
            }


            if(
                literasi ===
                "Non-Literasi" &&
                item.isLiterasi
            ){

                return false;
            }


            if(
                literasi ===
                "Literasi HOTS" &&
                !item.literasiHOTS
            ){

                return false;
            }


            if(search){

                const gabungan =
                    [

                        item.pertanyaan,
                        item.nomor,
                        item.tipe

                    ]
                    .join(" ")
                    .toLowerCase();


                if(
                    !gabungan.includes(
                        search
                    )
                ){

                    return false;
                }
            }


            return true;

        }
    );

}

        data.length;

    const literasi =
        data.filter(
            x=>x.isLiterasi
        ).length;

    const nonLiterasi =
        total -
        literasi;

    const lots =
        data.filter(
            x =>
                x.kognitif.kategori ===
                "LOTS"
        ).length;

    const mots =
        data.filter(
            x =>
                x.kognitif.kategori ===
                "MOTS"
        ).length;

    const hots =
        data.filter(
            x =>
                x.kognitif.kategori ===
                "HOTS"
        ).length;

    const literasiHOTS =
        data.filter(
            x =>
                x.literasiHOTS
        ).length;


    document.getElementById(
        "totalSoal"

        total;

    document.getElementById(
        "totalLiterasi"

    document.getElementById(
        "totalNonLiterasi"

    document.getElementById(
        "totalLOTS"
    ).textContent =
        lots;

    document.getElementById(
        "totalMOTS"
    ).textContent =
        mots;

    document.getElementById(
        "totalHOTS"
    ).textContent =
        hots;

    document.getElementById(
        "totalLiterasiHOTS"
    ).textContent =
        literasiHOTS;

}

/* =========================================================

========================================================= */

function renderCognitive(data){

    const total =
        data.length;

    const levels = [

        ["C1","Mengingat"],
        ["C2","Memahami"],
        ["C3","Menerapkan"],
        ["C4","Menganalisis"],
        ["C5","Mengevaluasi"],
        ["C6","Mencipta"]

    ];

    const container =
        document.getElementById(
            "cognitiveBars"
        );

    container.innerHTML = "";


    levels.forEach(
        ([level,nama])=>{

            const jumlah =
                data.filter(
                    x =>
                        x.kognitif.level ===
                        level
                ).length;


            const persen =
                total
                    ? Math.round(
                        jumlah /
                        total *
                        100
                    )
                    : 0;


            container.innerHTML += `

                <div class="bar-row">

                    <div class="bar-head">

                        <span>
                            ${level} - ${nama}
                        </span>

                        <span>
                            ${jumlah} soal

                    </div>

                    <div class="bar-container">

                        <div
                            class="bar bar-cognitive"

                        </div>

                    </div>

    );

                                tingkatNama

                        kategoriNama.toLowerCase() +

                }

            const total =

                        kategoriNama
                ).length;


            const element =
                document.getElementById(
                    kategoriNama.toLowerCase() +
                    "Total"
                );


            if(element){

                element.textContent =
                    total;

            }

        }
    );


    const mudah =
        data.filter(
            x =>
                x.kesukaran.tingkat ===
                "Mudah"
        ).length;


    const sedang =
        data.filter(
            x =>
                x.kesukaran.tingkat ===
                "Sedang"
        ).length;


    const sukar =
        data.filter(
            x =>
                x.kesukaran.tingkat ===
                "Sukar"
        ).length;


    document.getElementById(
        "totalMudahMatrix"
    ).textContent =
        mudah;


    document.getElementById(
        "totalSedangMatrix"
    ).textContent =
        sedang;


    document.getElementById(
        "totalSukarMatrix"
    ).textContent =

    document.getElementById(
        "grandTotalMatrix"
    ).textContent =

}


/* =========================================================
   LITERASI
========================================================= */

function renderLiterasi(data){

    const total =
        data.length;

    const jumlah =
        data.filter(
            x =>
                x.isLiterasi
        ).length;


    const persen =
        total
            ? Math.round(
                jumlah /
                total *
                100
            )
            : 0;


    document.getElementById(
        "persenLiterasi"
    ).textContent =
        persen + "%";


    document.getElementById(
        "barLiterasi"
    ).style.width =
        persen + "%";

}


/* =========================================================
   KELAYAKAN NASKAH
========================================================= */

function renderKelayakan(data){

    const container =
        document.getElementById(
            "kelayakanBox"
        );

    if(!container){
        return;
    }


    const total =
        data.length;


    if(total === 0){

        container.innerHTML = `

            <div class="kelayakan-box">

                <div class="kelayakan-status">

                    ⚪ BELUM DAPAT DINILAI

                </div>

                <div class="kelayakan-deskripsi">

                    Belum terdapat soal milik guru
                    yang dapat dianalisis.

                </div>

            </div>

        `;

        return;
    }


    const jumlah =
        categoria =>

            data.filter(
                x =>
                    x.kognitif.kategori ===
                    categoria
            ).length;


    const lots =
        jumlah("LOTS");

    const mots =
        jumlah("MOTS");

    const hots =
        jumlah("HOTS");


    const lotsMots =
        lots + mots;


    const literasi =
        data.filter(
            x =>
                x.isLiterasi
        ).length;


    const mudah =
        data.filter(
            x =>
                x.kesukaran.tingkat ===
                "Mudah"
        ).length;


    const sedang =
        data.filter(
            x =>
                x.kesukaran.tingkat ===
                "Sedang"
        ).length;


    const sukar =
        data.filter(
            x =>
                x.kesukaran.tingkat ===
                "Sukar"
        ).length;


    const mudahSedang =
        mudah + sedang;


    const persen =
        nilai =>
            Math.round(
                nilai /
                total *
                100
            );


    const pLOTSMOTS =
        persen(
            lotsMots
        );

    const pHOTS =
        persen(
            hots
        );

    const pLiterasi =
        persen(
            literasi
        );

    const pMudahSedang =
        persen(
            mudahSedang
        );

    const pSukar =
        persen(
            sukar
        );


    const okLOTSMOTS =
        pLOTSMOTS >= 40 &&
        pLOTSMOTS <= 50;


    const okHOTS =
        pHOTS >= 50 &&
        pHOTS <= 60;


    const okLiterasi =
        pLiterasi >= 50;


    const targetMudahSedang =
        total * 0.75;


    const toleransi =
        Math.max(
            1,
            Math.round(
                total * 0.05
            )
        );


    const okMudahSedang =
        Math.abs(
            mudahSedang -
            targetMudahSedang
        ) <= toleransi;


    const targetSukar =
        total * 0.25;


    const okSukar =
        Math.abs(
            sukar -
            targetSukar
        ) <= toleransi;


    const totalKognitif =
        lotsMots +
        hots;


    const okKognitif =
        totalKognitif ===
        total;


    const totalKesukaran =
        mudah +
        sedang +
        sukar;


    const okKesukaran =
        totalKesukaran ===
        total;


    const indikatorUtama = [

        okLOTSMOTS,
        okHOTS,
        okLiterasi,
        okMudahSedang,
        okSukar,
        okKognitif,
        okKesukaran

    ];


    const memenuhi =
        indikatorUtama.filter(
            x => x
        ).length;


    const layak =
        memenuhi >= 6;


    const rekomendasi = [];


    if(!okLOTSMOTS){

        rekomendasi.push(
            `LOTS + MOTS saat ini ${pLOTSMOTS}%. Standar yang diharapkan adalah 40–50%.`
        );

    }


    if(!okHOTS){

        if(pHOTS < 50){

            rekomendasi.push(
                `HOTS saat ini ${pHOTS}%. Tambahkan soal HOTS hingga minimal 50%.`
            );

        }else{

            rekomendasi.push(
                `HOTS saat ini ${pHOTS}%. Komposisi HOTS sebaiknya berada pada rentang 50–60%.`
            );

        }

    }


    if(!okLiterasi){

        rekomendasi.push(
            `Literasi saat ini ${pLiterasi}%. Tambahkan soal berbasis literasi hingga minimal 50%.`
        );

    }


    if(!okMudahSedang){

        rekomendasi.push(
            `Mudah + Sedang saat ini ${pMudahSedang}%. Target komposisi adalah sekitar 75%.`
        );

    }


    if(!okSukar){

        rekomendasi.push(
            `Sukar saat ini ${pSukar}%. Target komposisi adalah sekitar 25%.`
        );

    }


    if(!okKognitif){

        rekomendasi.push(
            `Total klasifikasi kognitif belum mencapai 100%. Periksa kembali klasifikasi soal.`
        );

    }


    if(!okKesukaran){

        rekomendasi.push(
            `Total klasifikasi kesukaran belum mencapai 100%. Periksa kembali analisis kesukaran.`
        );

    }


    function indikator(
        nama,
        nilai,
        target,
        status
    ){

        return `

            <div class="standar-item">

                <div class="standar-header">

                    <div class="standar-nama">
                        ${nama}
                    </div>

                    <div class="standar-persen">
                        ${nilai}%
                    </div>

                </div>

                <div class="standar-target">

                    Target:
                    ${target}

                </div>

                <div class="${
                    status
                        ? "standar-ok"
                        : "standar-warning"
                }">

                    ${
                        status
                            ? "✅ Terpenuhi"
                            : "❌ Belum Terpenuhi"
                    }

                </div>

            </div>

        `;

    }


    const statusClass =
        layak
            ? "kelayakan-layak"
            : "kelayakan-tidak";


    const statusText =
        layak
            ? "🟢 LAYAK DIUJIKAN"
            : "🔴 BELUM LAYAK DIUJIKAN";


    let deskripsi;


    if(layak){

        deskripsi = `

            Naskah memenuhi
            <b>${memenuhi} dari 7 indikator</b>.

            <br><br>

            Karena minimal
            <b>6 dari 7 indikator</b>
            telah terpenuhi,
            naskah dinyatakan
            <b>LAYAK DIUJIKAN</b>.

        `;

    }else{

        deskripsi = `

            Naskah baru memenuhi
            <b>${memenuhi} dari 7 indikator</b>.

            <br><br>

            Naskah dinyatakan
            <b>BELUM LAYAK</b>
            karena minimal
            <b>6 dari 7 indikator</b>
            harus terpenuhi.

        `;

    }


    container.innerHTML = `

        <div class="kelayakan-box ${statusClass}">

            <div class="kelayakan-status">

                ${statusText}

            </div>

            <div class="kelayakan-deskripsi">

                ${deskripsi}

            </div>

            <div class="standar-grid">

                ${indikator(
                    "LOTS + MOTS",
                    pLOTSMOTS,
                    "40–50%",
                    okLOTSMOTS
                )}

                ${indikator(
                    "HOTS",
                    pHOTS,
                    "50–60%",
                    okHOTS
                )}

                ${indikator(
                    "Literasi",
                    pLiterasi,
                    "Minimal 50%",
                    okLiterasi
                )}

                ${indikator(
                    "Mudah + Sedang",
                    pMudahSedang,
                    "75%",
                    okMudahSedang
                )}

                ${indikator(
                    "Sukar",
                    pSukar,
                    "25%",
                    okSukar
                )}

                ${indikator(
                    "Keseimbangan Kognitif",
                    100,
                    "LOTS+MOTS + HOTS = 100%",
                    okKognitif
                )}

                ${indikator(
                    "Keseimbangan Kesukaran",
                    100,
                    "Mudah+Sedang+Sukar = 100%",
                    okKesukaran
                )}

            </div>


            <div class="rekomendasi-box">

                <h4>
                    📋 Kesimpulan & Rekomendasi
                </h4>


                ${
                    rekomendasi.length

                        ?

                        `

                        <ul>

                            ${
                                rekomendasi
                                    .map(
                                        x =>
                                            `<li>${escapeHTML(x)}</li>`
                                    )
                                    .join("")
                            }

                        </ul>

                        `

                        :

                        `

                        <p style="font-size:12px">

                            ✅ Semua indikator
                            telah memenuhi standar.

                        </p>

                        `
                }


                <br>


                <div style="display:flex;flex-wrap:wrap;gap:6px">


                    <span class="badge ${
                        okHOTS
                            ? "badge-ok"
                            : "badge-warning"
                    }">

                        ${
                            okHOTS
                                ? "✅ HOTS 50–60%"
                                : "❌ HOTS di luar 50–60%"
                        }

                    </span>


                    <span class="badge ${
                        okLiterasi
                            ? "badge-ok"
                            : "badge-warning"
                    }">

                        ${
                            okLiterasi
                                ? "✅ Literasi ≥50%"
                                : "❌ Literasi <50%"
                        }

                    </span>


                    <span class="badge ${
                        okLOTSMOTS
                            ? "badge-ok"
                            : "badge-warning"
                    }">

                        ${
                            okLOTSMOTS
                                ? "✅ LOTS + MOTS 40–50%"
                                : "❌ LOTS + MOTS di luar 40–50%"
                        }

                    </span>


                    <span class="badge ${
                        okMudahSedang
                            ? "badge-ok"
                            : "badge-warning"
                    }">

                        ${
                            okMudahSedang
                                ? "✅ Mudah + Sedang ≈75%"
                                : "❌ Mudah + Sedang ≠75%"
                        }

                    </span>


                    <span class="badge ${
                        okSukar
                            ? "badge-ok"
                            : "badge-warning"
                    }">

                        ${
                            okSukar
                                ? "✅ Sukar ≈25%"
                                : "❌ Sukar ≠25%"
                        }

                    </span>


                </div>

            </div>

        </div>

    `;

}


/* =========================================================
   RENDER QUESTIONS
========================================================= */

function renderQuestions(data){

    const container =
        document.getElementById(
            "questionList"
        );


    document.getElementById(
        "jumlahTampil"
    ).textContent =
        `${data.length} soal`;


    if(!data.length){

        container.innerHTML = `

            <div class="empty">

                📭 Tidak ada soal milik Anda
                yang sesuai dengan filter.

            </div>

        `;

        return;
    }


    container.innerHTML = "";


    data.forEach(
        item=>{

            let badgeKategori;


            if(
                item.kognitif.kategori ===
                "LOTS"
            ){

                badgeKategori = `

                    <span class="badge badge-lots">
                        LOTS
                    </span>

                `;

            }else if(
                item.kognitif.kategori ===
                "MOTS"
            ){

                badgeKategori = `

                    <span class="badge badge-mots">
                        MOTS
                    </span>

                `;

            }else{

                badgeKategori = `

                    <span class="badge badge-hots">
                        HOTS
                    </span>

                `;

            }


            let badgeKesukaran;


            if(
                item.kesukaran.tingkat ===
                "Mudah"
            ){

                badgeKesukaran = `

                    <span class="badge badge-easy">
                        Mudah
                    </span>

                `;

            }else if(
                item.kesukaran.tingkat ===
                "Sedang"
            ){

                badgeKesukaran = `

                    <span class="badge badge-medium">
                        Sedang
                    </span>

                `;

            }else{

                badgeKesukaran = `

                    <span class="badge badge-hard">
                        Sukar
                    </span>

                `;

            }


            const badgeLiterasi =
                item.isLiterasi

                    ?

                    `
                    <span class="badge badge-literasi">
                        Literasi
                    </span>
                    `

                    :

                    `
                    <span class="badge badge-non">

                    `;


            const badgeLiterasiHOTS =
                item.literasiHOTS

                    ?

                    `
                    <span class="badge badge-literasi">

                    </span>
                    `

                    :

                    "";


            const teksSoal =
                escapeHTML(
                    item.pertanyaan ||
                    "(Soal tidak tersedia)"
                );


            const pilihan =
                ambilPilihan(
                    item
                );


            let pilihanHTML = "";


            if(
                pilihan.length
            ){

                pilihanHTML = `

                    <div
                        style="
                            margin-top:14px;
                            padding:13px;
                            background:#f8fafc;
                            border:1px solid #e2e8f0;
                            border-radius:9px;
                        ">

                        <div
                            style="
                                font-size:10px;
                                font-weight:900;
                                color:#64748b;
                                margin-bottom:8px;
                            ">

                            PILIHAN JAWABAN YANG DIANALISIS

                        </div>

                        ${
                            pilihan
                                .map(
                                    p=>`

                                    <div
                                        style="
                                            font-size:12px;
                                            line-height:1.6;
                                            margin-bottom:5px;
                                        ">

                                        <b>${escapeHTML(p.huruf)}.</b>

                                        ${escapeHTML(p.teks)}

                                    </div>

                                    `
                                )
                                .join("")
                        }

                    </div>

                `;

            }


            let namaLiterasi =
                "-";

            let isiLiterasi =

            if(
                item.literasi &&

            ){

                namaLiterasi =
                    escapeHTML(

                    );


                isiLiterasi =
                    escapeHTML(

                        item.literasi.data.isi ||
                        ""
                    );

            }


            let literasiBox = "";


            if(
                item.isLiterasi &&
                isiLiterasi
            ){

                literasiBox = `

                    <div class="literasi-box">

                        <div class="literasi-title">

                            📖 ${namaLiterasi}

                        </div>

                        <div class="literasi-content">

                            ${isiLiterasi}

                        </div>

                    </div>

                `;

            }


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "question-card";


            card.innerHTML = `

                <div class="question-header">

                    <div class="question-number">

                        📝 Soal No.
                        ${escapeHTML(
                            item.nomor
                        )}

                    </div>


                    <div class="badges">

                        <span class="badge badge-c">

                            ${item.kognitif.level}
                            -
                            ${item.kognitif.nama}

                        </span>


                        ${badgeKategori}


                        ${badgeKesukaran}


                        ${badgeLiterasi}


                        ${badgeLiterasiHOTS}

                    </div>

                </div>


                <div class="question-body">

                    ${literasiBox}


                    <div class="question-text">

                    </div>


                    ${pilihanHTML}


                    <div class="analysis-grid">


                        <div class="analysis-item">

                            <div class="title">
                                LEVEL KOGNITIF
                            </div>

                            <div class="value">

                                ${item.kognitif.level}
                                -
                                ${item.kognitif.nama}

                            </div>

                        </div>


                        <div class="analysis-item">

                            <div class="title">
                                KATEGORI
                            </div>

                            <div class="value">

                                ${item.kognitif.kategori}

                            </div>

                        </div>


                        <div class="analysis-item">

                            <div class="title">
                                LITERASI
                            </div>

                            <div class="value">

                                        : "Tidak"

                        </div>

                                SKOR PREDIKSI
                            </div>

                            <div class="value">

                                ${item.kesukaran.skor}/100

                            </div>

                        </div>


                    </div>


                    <div class="reason">

                        <b>Alasan kognitif:</b>

                        ${escapeHTML(
                            item.kognitif.alasan
                        )}

                        <br><br>


                        <b>Indikator kesukaran:</b>

                        ${escapeHTML(
                            item.kesukaran.alasan
                        )}

                        <br><br>


                        <b>Literasi:</b>

                        ${namaLiterasi}

                    </div>

                </div>

            `;


            container.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}
