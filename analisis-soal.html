        value === null ||
        value === undefined

        return "";
    }

        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")

/* =====================================================
   10. NORMALISASI KUNCI
   ===================================================== */

function normalisasiKunci(value){

    const v =
        plainText(value)
        .replace(/[.)]/g,"")
        .trim();


    const map = {

        "a":"A",
        "pilihan a":"A",
        "option a":"A",
        "jawaban a":"A",

        "b":"B",
        "pilihan b":"B",
        "option b":"B",
        "jawaban b":"B",

        "c":"C",
        "pilihan c":"C",
        "option c":"C",
        "jawaban c":"C",

        "d":"D",
        "pilihan d":"D",
        "option d":"D",
        "jawaban d":"D"

    };


    if(map[v]){
        return map[v];
    }


    const match =
        v.match(
            /(?:jawaban|pilihan|option)?\s*([abcd])\b/i
        );


    if(match){
        return match[1].toUpperCase();
    }


    return "";

}

    }

    if(kognitif === "C5"){
        skor += 2;
    }

    if(kognitif === "C6"){
        skor += 3;
    }


    /* =================================================
       B. LITERASI / STIMULUS
       ================================================= */

    if(literasi){
        skor += 1;
    }


    /* =================================================
       C. PANJANG DAN KOMPLEKSITAS SOAL
       ================================================= */

    if(pertanyaan.length > 250){
        skor += 1;
    }

    if(pertanyaan.length > 500){
        skor += 1;
    }

    if(
        /berdasarkan data|berdasarkan tabel|berdasarkan grafik|berdasarkan informasi|perhatikan|dari kasus|dalam situasi|jika kondisi/.test(
            pertanyaan
        )
    ){

        skor += 1;

    }


    /* =================================================
       D. JIKA KUNCI JAWABAN TERSEDIA
       ================================================= */

    if(kunci){

        const jawabanBenar =
            pilihan[kunci] || "";


        if(jawabanBenar){

            /* -----------------------------------------
               D1. Jawaban benar muncul langsung
               dalam pertanyaan
               ----------------------------------------- */

            const jawabanPendek =
                jawabanBenar
                    .replace(/[.,;:!?()[\]{}]/g," ")
                    .replace(/\s+/g," ")
                    .trim();


            if(
                jawabanPendek.length >= 4 &&
                pertanyaan.includes(
                    jawabanPendek
                )
            ){

                skor -= 3;

            }


            /* -----------------------------------------
               D2. Pilihan sangat pendek
               ----------------------------------------- */

            if(
                jawabanBenar.length < 20
            ){

                skor -= 1;

            }


            /* -----------------------------------------
               D3. Pengecoh sangat berbeda
               dari jawaban benar
               ----------------------------------------- */

            const tokenBenar =
                new Set(
                    jawabanBenar
                        .split(/\s+/)
                        .filter(
                            x =>
                                x.length > 3
                        )
                );


            let pilihanMirip = 0;


            Object.keys(pilihan)
                .forEach(
                    huruf => {

                        if(
                            huruf === kunci ||
                            !pilihan[huruf]
                        ){
                            return;
                        }


                        const tokenSalah =
                            new Set(
                                pilihan[huruf]
                                    .split(/\s+/)
                                    .filter(
                                        x =>
                                            x.length > 3
                                    )
                            );


                        let sama = 0;


                        tokenBenar.forEach(
                            kata => {

                                if(
                                    tokenSalah.has(
                                        kata
                                    )
                                ){

                                    sama++;

                                }

                            }
                        );


                        if(
                            sama >= 2
                        ){

                            pilihanMirip++;

                        }

                    }
                );


            /* Banyak pengecoh mirip =
               lebih sulit */

            if(pilihanMirip >= 2){
                skor += 2;
            }else if(pilihanMirip === 1){
                skor += 1;
            }


            /* -----------------------------------------
               D4. Pilihan panjang dan hampir seimbang
               ----------------------------------------- */

            const panjang =
                opsi.map(
                    x =>
                        x.length
                );


            if(panjang.length >= 3){

                const max =
                    Math.max(...panjang);

                const min =
                    Math.min(...panjang);


                if(
                    min > 0 &&
                    max / min < 2
                ){

                    skor += 1;

                }

            }


            /* -----------------------------------------
               D5. Jawaban yang membutuhkan penalaran
               ----------------------------------------- */

            if(
                /mengapa|alasan|paling tepat|paling efektif|paling sesuai|berdasarkan|dampak|hubungan|kesimpulan|solusi|strategi|kemungkinan|prediksi|evaluasi|analisis/.test(
                    pertanyaan
                )
            ){

                skor += 2;

            }

        }

    }else{

        /* =================================================
           JIKA KUNCI TIDAK ADA

           Jangan memaksakan soal menjadi Sukar hanya
           berdasarkan C6.

           Penilaian hanya menggunakan kompleksitas
           soal, stimulus, dan opsi.
           ================================================= */

        if(opsi.length >= 4){

            const panjang =
                opsi.map(
                    x =>
                        x.length
                );


            const max =
                Math.max(...panjang);

            const min =
                Math.min(...panjang);


            if(
                min > 0 &&
                max / min < 2
            ){

                skor += 1;

            }

        }

    }


    /* =================================================
       E. DETEKSI SOAL YANG SANGAT LANGSUNG
       ================================================= */

    if(
        /apa nama|siapa|kapan|di mana|dimana|sebutkan|definisi|pengertian|nama dari|istilah untuk/.test(
            pertanyaan
        )
    ){

        skor -= 2;

    }


    /* =================================================
       F. BATAS AKHIR KESUKARAN

       0 - 2  = Mudah
       3 - 5  = Sedang
       6+     = Sukar

       Ini INDEPENDEN dari C1-C6.
       ================================================= */

    if(skor <= 2){

        return "Mudah";

    }

    if(skor <= 5){

        return "Sedang";

    }

    return "Sukar";

}


/* =====================================================
   13. ANALISIS SOAL
   ===================================================== */

function analisisSoal(soal){

    const ujian =
        daftarUjian.find(
            u =>
                String(u.id) ===
                String(soal.ujian_id)
        ) || {};


    const pertanyaan =

        soal.pertanyaan ||
        soal.question ||
        soal.text ||
        soal.soal ||
        "";


    /* ================================================
       SEMUA MAPEL MENGGUNAKAN KKO YANG SAMA
       ================================================ */

    const kognitif =
        skorKKO(
            pertanyaan
        );


    const kategori =
        kategoriKognitif(
            kognitif
        );


    const literasi =
        cariLiterasi(
            soal
        );


    const kesukaran =
        tingkatKesukaran(
            soal,
            kognitif,
            literasi
        );


    return {

        ...soal,

        namaUjian:
            ujian.judul ||
            ujian.nama ||
            ujian.title ||
            "Bank Soal",

        kognitif,

        kategori,

        kesukaran,

        literasi:
            literasi
                ? "Literasi"
                : "Non-Literasi"

    };

}

   14. LOAD DATA
   ===================================================== */

async function loadData(){

    const user =
        getExamUser();


    if(!user){

        showError(
            "User belum login. Silakan login terlebih dahulu."
        );

        return;

    }


    if(
        user.role &&
        String(user.role).toLowerCase() !== "guru"
    ){

        showError(
            "Halaman ini hanya dapat digunakan oleh guru."
        );

        return;

    }


    try{

        let guruIds =
            getPossibleGuruIds(
                user
            );


        try{

            const {
                data:guruData,
                error:guruError
            } =
                await supabaseClient
                    .from("guru")
                    .select("*");


            if(
                !guruError &&
                guruData
            ){

                const cocok =
                    guruData.filter(
                        g => {

                            return guruIds.some(
                                id => {

                                    return [

                                        g.id,
                                        g.guru_id,
                                        g.username,
                                        g.nip,
                                        g.nik

                                    ]
                                    .filter(
                                        value =>
                                            value !== null &&
                                            value !== undefined
                                    )
                                    .map(
                                        value =>
                                            String(value)
                                    )
                                    .includes(
                                        String(id)
                                    );

                                }
                            );

                        }
                    );


                cocok.forEach(
                    g => {

                        [

                            g.id,
                            g.guru_id,
                            g.username,
                            g.nip,
                            g.nik

                        ].forEach(
                            value => {

                                if(
                                    value !== null &&
                                    value !== undefined
                                ){

                                    guruIds.push(
                                        String(value)
                                    );

                                }

                            }
                        );

                    }
                );

            }

        }catch(e){

            console.warn(
                "Data guru tidak dapat dimuat:",
                e
            );

        }


        guruIds =
            [
                ...new Set(
                    guruIds
                )
            ];


        /* =============================================
           AMBIL SEMUA UJIAN
           ============================================= */

        const {
            data:ujianData,
            error:ujianError
        } =
            await supabaseClient
                .from("ujian")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending:false
                    }
                );


        if(ujianError){

            throw ujianError;

        }


        /* =============================================
           FILTER UJIAN MILIK GURU
           ============================================= */

        const ownerFields = [

            "guru_id",
            "guruId",
            "guru",
            "teacher_id",
            "teacherId",
            "created_by",
            "createdBy",
            "pembuat_id",
            "pembuatId",
            "user_id",
            "userId",
            "username",
            "nip",
            "nik",
            "guru_username",
            "guruUsername",
            "guru_nip",
            "guruNip"

        ];


        daftarUjian =
            (ujianData || [])
            .filter(
                u => {

                    return ownerFields.some(
                        field => {

                            const value =
                                u[field];


                            if(
                                value === null ||
                                value === undefined
                            ){

                                return false;

                            }


                            return guruIds.includes(
                                String(value)
                            );

                        }
                    );

                }
            );


        if(
            daftarUjian.length === 0 &&
            user.username
        ){

            daftarUjian =
                (ujianData || [])
                .filter(
                    u => {

                        const values =
                            ownerFields
                            .map(
                                field =>
                                    u[field]
                            )
                            .filter(
                                value =>
                                    value !== null &&
                                    value !== undefined
                            )
                            .map(
                                value =>
                                    String(value)
                            );


                        return values.includes(
                            String(
                                user.username
                            )
                        );

                    }
                );

        }


        /* =============================================
           AMBIL SOAL
           ============================================= */

        const semuaUjianId =
            daftarUjian.map(
                u =>
                    String(u.id)
            );


        if(
            semuaUjianId.length === 0
        ){

            daftarSoal = [];

        }else{

            const {
                data:soalData,
                error:soalError
            } =
                await supabaseClient
                    .from("soal")
                    .select("*");


            if(soalError){

                throw soalError;

            }


            daftarSoal =
                (soalData || [])
                .filter(
                    soal => {

                        return semuaUjianId.includes(
                            String(
                                soal.ujian_id
                            )
                        );

                    }
                );

        }


        /* =================================================
           MAKSIMAL 25 SOAL UNTUK SETIAP BANK SOAL
           ================================================= */

        const soalPerUjian =
            new Map();


        daftarSoal.forEach(
            soal => {

                const key =
                    String(
                        soal.ujian_id
                    );


                if(
                    !soalPerUjian.has(
                        key
                    )
                ){

                    soalPerUjian.set(
                        key,
                        []
                    );

                }


                soalPerUjian
                    .get(key)
                    .push(
                        soal
                    );

            }
        );


        daftarSoal = [];


        soalPerUjian.forEach(
            soalList => {

                daftarSoal.push(
                    ...soalList.slice(
                        0,
                        25
                    )
                );

            }
        );


        /* =============================================
           ANALISIS
           ============================================= */

        dataAnalisis =
            daftarSoal.map(
                soal =>
                    analisisSoal(
                        soal
                    )
            );


        renderUjianFilter();

        renderSemua();


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "mainContent"
        ).style.display =
            "block";


    }catch(error){

        console.error(error);


        showError(
            "Gagal mengambil data Bank Soal: " +
            (
                error.message ||
                error
            )
        );

    }

}

function getFilteredData(){

    let data =
        [
            ...dataAnalisis
        ];


    if(ujianAktif){

        data =
            data.filter(
                item =>
                    String(
                        item.ujian_id
                    ) ===
                    String(
                        ujianAktif
                    )
            );

    }


    const kognitif =
        document.getElementById(

        ).value;


    const kategori =
        document.getElementById(
            "kategoriFilter"
        ).value;


    const kesukaran =
        document.getElementById(
            "kesukaranFilter"
        ).value;


    const literasi =
        document.getElementById(
            "literasiFilter"
        ).value;


    const search =
        document.getElementById(
            "searchInput"
        ).value
        .toLowerCase()
        .trim();


    if(kognitif){

        data =
            data.filter(
                item =>
                    item.kognitif ===
                    kognitif
            );

    }


    if(kategori){

        data =
            data.filter(
                item =>
                    item.kategori ===
                    kategori
            );

    }


    if(kesukaran){

        data =
            data.filter(
                item =>
                    item.kesukaran ===
                    kesukaran
            );

    }


    if(literasi){

        data =
            data.filter(
                item =>
                    item.literasi ===
                    literasi
            );

    }


    if(search){

        data =
            data.filter(
                item => {

                    const text =
                        String(
                            item.pertanyaan ||
                            ""
                        )
                        .replace(
                            /<[^>]*>/g,
                            " "
                        )
                        .toLowerCase();


                    return text.includes(
                        search
                    );

                }
            );

    }


    return data;

}

   ===================================================== */

function progressHTML(
    label,
    count,
    total,
    barClass
){

    const percent =
        total > 0
            ? (
                count /
                total *
                100
            )
            : 0;


    return `

        <div class="progress-row">

            <div class="progress-head">

                <span>
                    ${label}
                </span>


                <strong>

                    ${count}
                    soal

                    (${percent.toFixed(1)}%)

                </strong>

            </div>


            <div class="progress">

                <div
                    class="progress-bar ${barClass}"
                    style="width:${percent}%"
                ></div>

            </div>

        </div>

    `;

}

            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>

                            <th width="50">
                                No
                            </th>

                            <th>
                                Bank Soal
                            </th>

                            <th>
                                Pertanyaan
                            </th>

                            <th>
                                Kognitif
                            </th>

                            <th>
                                Kategori
                            </th>

                            <th>
                                Kesukaran
                            </th>

                            <th>
                                Literasi
                            </th>

                        </tr>

                    </thead>


                    <tbody>

    `;


    if(
        data.length === 0
    ){

        html += `

            <tr>

                <td
                    colspan="7"
                    style="
                        text-align:center;
                        padding:30px;
                    "
                >

                    Tidak ada soal
                    yang sesuai filter.

                </td>

            </tr>

        `;

    }else{

        data.forEach(
            (item,index) => {

                html += `

                    <tr>

                        <td>
                            ${index + 1}
                        </td>


                        <td>
                            ${escapeHtml(
                                item.namaUjian
                            )}
                        </td>


                        <td class="question-text">

                            ${escapeHtml(
                                item.pertanyaan ||
                                item.question ||
                                item.text ||
                                item.soal ||
                                ""
                            )}

                        </td>


                        <td>

                            <span class="badge ${
                                item.kognitif === "C1" ||
                                item.kognitif === "C2"

                                    ? "badge-lots"

                                    : item.kognitif === "C3"

                                        ? "badge-mots"

                                        : "badge-hots"
                            }">

                                ${item.kognitif}

                            </span>

                        </td>


                        <td>

                            <span class="badge ${
                                item.kategori === "LOTS"

                                    ? "badge-lots"

                                    : item.kategori === "MOTS"

                                        ? "badge-mots"

                                        : "badge-hots"
                            }">

                                ${item.kategori}

                            </span>

                        </td>


                        <td>

                            <span class="badge ${
                                item.kesukaran === "Mudah"

                                    ? "badge-easy"

                                    : item.kesukaran === "Sedang"

                                        ? "badge-medium"

                                        : "badge-hard"
                            }">

                                ${item.kesukaran}

                            </span>

                        </td>


                        <td>

                            <span class="badge ${
                                item.literasi === "Literasi"

                                    ? "badge-literasi"

                                    : "badge-nonliterasi"
                            }">

                                ${item.literasi}

                            </span>

                        </td>

                    </tr>

                `;

            }
        );

    }


    html += `

                    </tbody>

                </table>

            </div>

        </div>

    `;


    document.getElementById(
        "questionList"
    ).innerHTML =
        html;

}
