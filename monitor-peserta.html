<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Monitor Peserta - Admin | RUANG EXAM</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#1e293b;
}

.header{
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
    color:white;
    padding:20px 25px;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.header-inner{
    max-width:1400px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.header h1{
    font-size:24px;
    margin-bottom:5px;
}

.header p{
    font-size:13px;
    opacity:.85;
}

.btn-kembali{
    background:white;
    color:#1e3a8a;
    border:none;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.container{
    max-width:1400px;
    margin:25px auto;
    padding:0 15px;
}

/* STATISTIK */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:white;
    border-radius:12px;
    padding:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    border-left:5px solid #2563eb;
}

.stat:nth-child(2){
    border-left-color:#16a34a;
}

.stat:nth-child(3){
    border-left-color:#f59e0b;
}

.stat:nth-child(4){
    border-left-color:#dc2626;
}

.stat-label{
    font-size:13px;
    color:#64748b;
    margin-bottom:8px;
}

.stat-value{
    font-size:28px;
    font-weight:bold;
}

/* FILTER */

.filter-box{
    background:white;
    border-radius:12px;
    padding:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.filter-title{
    font-size:17px;
    font-weight:bold;
    margin-bottom:15px;
}

.filters{
    display:grid;
    grid-template-columns:1.3fr 1.2fr 1fr 1fr 1.5fr;
    gap:12px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.field label{
    font-size:12px;
    color:#64748b;
    font-weight:bold;
}

.field select,
.field input{
    width:100%;
    padding:10px 11px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    outline:none;
    background:white;
}

.field select:focus,
.field input:focus{
    border-color:#2563eb;
}

/* ACTION */

.action-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    background:white;
    padding:15px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    margin-bottom:15px;
}

.action-left{
    display:flex;
    align-items:center;
    gap:10px;
}

.action-left select{
    padding:10px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    min-width:280px;
}

.btn{
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.btn-refresh{
    background:#2563eb;
    color:white;
}

.btn-reset{
    background:#dc2626;
    color:white;
}

.btn-reset:hover{
    background:#b91c1c;
}

.btn-refresh:hover{
    background:#1d4ed8;
}

/* TABLE */

.table-box{
    background:white;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    overflow:hidden;
}

.table-header{
    padding:16px 18px;
    border-bottom:1px solid #e2e8f0;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.table-title{
    font-weight:bold;
    font-size:17px;
}

.last-update{
    font-size:12px;
    color:#64748b;
}

.table-scroll{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1050px;
}

thead{
    background:#f8fafc;
}

th{
    text-align:left;
    padding:13px 12px;
    font-size:12px;
    color:#475569;
    border-bottom:1px solid #e2e8f0;
    white-space:nowrap;
}

td{
    padding:13px 12px;
    border-bottom:1px solid #eef2f7;
    font-size:13px;
    vertical-align:middle;
}

tbody tr:hover{
    background:#f8fafc;
}

/* STATUS */

.status{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:6px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
    white-space:nowrap;
}

.status-sedang{
    background:#dcfce7;
    color:#166534;
}

.status-selesai{
    background:#dbeafe;
    color:#1d4ed8;
}

.status-belum{
    background:#fef3c7;
    color:#92400e;
}

.status-lain{
    background:#e2e8f0;
    color:#475569;
}

.nilai{
    font-weight:bold;
    font-size:15px;
}

.nilai-kosong{
    color:#94a3b8;
}

/* RESET */

.btn-reset-small{
    border:none;
    background:#fee2e2;
    color:#b91c1c;
    padding:6px 9px;
    border-radius:6px;
    cursor:pointer;
    font-size:11px;
    font-weight:bold;
}

.btn-reset-small:hover{
    background:#fecaca;
}

/* EMPTY */

.empty{
    padding:50px 20px;
    text-align:center;
    color:#64748b;
}

.empty-icon{
    font-size:45px;
    margin-bottom:10px;
}

/* LOADING */

.loading{
    padding:35px;
    text-align:center;
    color:#64748b;
}

/* TOAST */

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#0f172a;
    color:white;
    padding:13px 17px;
    border-radius:8px;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
    z-index:9999;
    display:none;
    max-width:350px;
}

.toast.show{
    display:block;
}

.toast.success{
    background:#166534;
}

.toast.error{
    background:#b91c1c;
}

/* RESPONSIVE */

@media(max-width:1000px){
    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .filters{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    .header-inner{
        flex-direction:column;
        align-items:flex-start;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .filters{
        grid-template-columns:1fr;
    }

    .action-bar{
        flex-direction:column;
        align-items:stretch;
    }

    .action-left{
        flex-direction:column;
        align-items:stretch;
    }

    .action-left select{
        width:100%;
        min-width:0;
    }
}
</style>
</head>

<body>

<main class="container">

    <section class="stats">

        </div>

</main>


<div class="toast" id="toast"></div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://sztfucrmjexoalyiwwnq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_j724cUM7NNHl8wbxq9ZHKw_FLFJAuGn";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   AUTH ADMIN
========================================================= */

const examUser =
    JSON.parse(localStorage.getItem("exam_user") || "null");

if(!examUser || examUser.role !== "admin"){

    alert("Akses hanya untuk Admin.");

    window.location.href = "login.html";
}


/* =========================================================
   DATA
========================================================= */

let semuaPeserta = [];
let semuaSiswa = [];
let semuaUjian = [];
let semuaMapel = [];
let semuaHasil = [];

let semuaBaris = [];
let barisTampil = [];


/* =========================================================
   UTIL
========================================================= */

function escapeHTML(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function formatTanggal(value){

    if(!value){
        return "-";
    }

    const d = new Date(value);

    if(isNaN(d.getTime())){
        return "-";
    }

    return d.toLocaleString("id-ID",{
        day:"2-digit",
        month:"2-digit",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit"
    });
}


function formatJam(value){

    if(!value){
        return "-";
    }

    const d = new Date(value);

    if(isNaN(d.getTime())){
        return "-";
    }

    return d.toLocaleTimeString("id-ID",{
        hour:"2-digit",
        minute:"2-digit"
    });
}


function showToast(message,type="success"){

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.className =
        "toast show " + type;

    setTimeout(()=>{
        toast.className = "toast";
    },3000);
}


function normalisasi(value){

    return String(value || "")
        .trim()
        .toLowerCase();
}


/* =========================================================
   STATUS
========================================================= */

function tentukanStatus(peserta, hasil, ujian){

    /*
       HASIL UJIAN SELALU MENJADI PRIORITAS
       karena berarti siswa sudah submit.
    */

    if(hasil){
        return "selesai";
    }


    const statusPeserta =
        normalisasi(peserta?.status);


    if(
        statusPeserta === "aktif" ||
        statusPeserta === "sedang" ||
        statusPeserta === "sedang_ujian" ||
        statusPeserta === "in_progress" ||
        statusPeserta === "mengerjakan" ||
        statusPeserta === "berlangsung" ||
        statusPeserta === "jeda"
    ){

        return "sedang";
    }


    /*
       Kalau sudah punya waktu_mulai
       tetapi belum ada waktu_selesai,
       berarti sedang mengerjakan.
    */

    if(
        peserta?.waktu_mulai &&
        !peserta?.waktu_selesai
    ){

        return "sedang";
    }


    /*
       Cek jadwal ujian.
    */

    const sekarang = new Date();

    const mulai =
        ujian?.tanggal_mulai
            ? new Date(ujian.tanggal_mulai)
            : null;

    if(mulai && sekarang < mulai){

        return "belum";
    }


    /*
       Kalau peserta belum mulai.
    */

    return "belum";
}


/* =========================================================
   LABEL STATUS
========================================================= */

function statusHTML(status){

    if(status === "sedang"){

        return `
            <span class="status status-sedang">
                🟢 Sedang Ujian
            </span>
        `;
    }


    if(status === "selesai"){

        return `
            <span class="status status-selesai">
                ✅ Sudah Selesai
            </span>
        `;
    }


    if(status === "belum"){

        return `
            <span class="status status-belum">
                ⏳ Belum Mulai
            </span>
        `;
    }


    return `
        <span class="status status-lain">
            -
        </span>
    `;
}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadData(){

    try{

        document.getElementById("tableBody").innerHTML = `
            <tr>
                <td colspan="11">
                    <div class="loading">
                        🔄 Memuat data peserta...
                    </div>
                </td>
            </tr>
        `;


        /*
         * PESERTA
         */

        const pesertaResult =
            await supabaseClient
                .from("peserta_ujian")
                .select("*")
                .order("created_at",{ascending:false});


        if(pesertaResult.error){
            throw pesertaResult.error;
        }


        /*
         * SISWA
         */

        const siswaResult =
            await supabaseClient
                .from("siswa")
                .select("id,nama,nisn,kelas");


        if(siswaResult.error){
            throw siswaResult.error;
        }


        /*
         * UJIAN
         */

        const ujianResult =
            await supabaseClient
                .from("ujian")
                .select(`
                    id,
                    judul,
                    mata_pelajaran_id,
                    kelas_id,
                    guru_id,
                    durasi_menit,
                    tanggal_mulai,
                    tanggal_selesai,
                    status,
                    status_kontrol
                `)
                .order("created_at",{ascending:false});


        if(ujianResult.error){
            throw ujianResult.error;
        }


        /*
         * MATA PELAJARAN
         */

        const mapelResult =
            await supabaseClient
                .from("mata_pelajaran")
                .select("id,nama")
                .order("nama");


        if(mapelResult.error){
            throw mapelResult.error;
        }


        /*
         * HASIL UJIAN
         */

        const hasilResult =
            await supabaseClient
                .from("hasil_ujian")
                .select(`
                    id,
                    siswa_id,
                    ujian_id,
                    nama_siswa,
                    nisn,
                    kelas,
                    nilai,
                    jumlah_benar,
                    jumlah_soal,
                    jawaban,
                    waktu_mulai,
                    waktu_selesai
                `);


        if(hasilResult.error){
            throw hasilResult.error;
        }


        semuaPeserta =
            pesertaResult.data || [];

        semuaSiswa =
            siswaResult.data || [];

        semuaUjian =
            ujianResult.data || [];

        semuaMapel =
            mapelResult.data || [];

        semuaHasil =
            hasilResult.data || [];


        console.log("PESERTA:",semuaPeserta);
        console.log("SISWA:",semuaSiswa);
        console.log("UJIAN:",semuaUjian);
        console.log("MAPEL:",semuaMapel);
        console.log("HASIL:",semuaHasil);


        bangunRelasi();

        isiFilter();

        terapkanFilter();

        document.getElementById("lastUpdate").textContent =
            "Diperbarui " +
            new Date().toLocaleTimeString("id-ID");

    }
    catch(error){

        console.error(error);

        document.getElementById("tableBody").innerHTML = `
            <tr>
                <td colspan="11">
                    <div class="empty">
                        <div class="empty-icon">⚠️</div>
                        <b>Gagal memuat data</b>
                        <br>
                        <small>${escapeHTML(error.message || error)}</small>
                    </div>
                </td>
            </tr>
        `;

        showToast(
            "Gagal memuat data: " +
            (error.message || error),
            "error"
        );
    }

}


/* =========================================================
   BANGUN RELASI
========================================================= */

function bangunRelasi(){

    /*
       MAP BY ID
    */

    const siswaById =
        new Map(
            semuaSiswa.map(
                s => [String(s.id),s]
            )
        );


    const ujianById =
        new Map(
            semuaUjian.map(
                u => [String(u.id),u]
            )
        );


    const mapelById =
        new Map(
            semuaMapel.map(
                m => [String(m.id),m]
            )
        );


    /*
       INDEX HASIL
       siswa_id + ujian_id
       DAN
       nisn + ujian_id
    */

    const hasilBySiswaUjian =
        new Map();

    const hasilByNisnUjian =
        new Map();


    semuaHasil.forEach(h=>{

        if(
            h.siswa_id &&
            h.ujian_id
        ){

            hasilBySiswaUjian.set(
                String(h.siswa_id) +
                "|" +
                String(h.ujian_id),
                h
            );
        }


        if(
            h.nisn &&
            h.ujian_id
        ){

            hasilByNisnUjian.set(
                String(h.nisn).trim() +
                "|" +
                String(h.ujian_id),
                h
            );
        }

    });


    /*
       BENTUK BARIS MONITOR
    */

    semuaBaris =
        semuaPeserta.map(p=>{

            const siswa =
                siswaById.get(
                    String(p.siswa_id)
                );


            const ujian =
                ujianById.get(
                    String(p.ujian_id)
                );


            const mapel =
                ujian
                    ? mapelById.get(
                        String(
                            ujian.mata_pelajaran_id
                        )
                    )
                    : null;


            /*
               NISN DARI DATA SISWA
            */

            const nisn =
                String(
                    siswa?.nisn ||
                    ""
                ).trim();


            /*
               CARI HASIL
            */

            let hasil = null;


            if(
                siswa?.id &&
                ujian?.id
            ){

                hasil =
                    hasilBySiswaUjian.get(
                        String(siswa.id) +
                        "|" +
                        String(ujian.id)
                    ) || null;
            }


            /*
               FALLBACK KE NISN
            */

            if(
                !hasil &&
                nisn &&
                ujian?.id
            ){

                hasil =
                    hasilByNisnUjian.get(
                        nisn +
                        "|" +
                        String(ujian.id)
                    ) || null;
            }


            /*
               KELAS SISWA
               LANGSUNG DARI siswa.kelas
            */

            const kelas =
                String(
                    siswa?.kelas ||
                    hasil?.kelas ||
                    "-"
                ).trim();


            /*
               STATUS
            */

            const status =
                tentukanStatus(
                    p,
                    hasil,
                    ujian
                );


            /*
               WAKTU MULAI
            */

            const waktuMulai =
                hasil?.waktu_mulai ||
                p?.waktu_mulai ||
                null;


            /*
               WAKTU SELESAI
            */

            const waktuSelesai =
                hasil?.waktu_selesai ||
                p?.waktu_selesai ||
                null;


            return {

                peserta:p,

                siswa:siswa,

                ujian:ujian,

                mapel:mapel,

                hasil:hasil,

                nama:
                    siswa?.nama ||
                    hasil?.nama_siswa ||
                    "-",

                nisn:
                    nisn ||
                    String(
                        hasil?.nisn || ""
                    ).trim(),

                kelas:kelas,

                judul:
                    ujian?.judul ||
                    "-",

                mapelNama:
                    mapel?.nama ||
                    "-",

                waktuMulai:
                    waktuMulai,

                waktuSelesai:
                    waktuSelesai,

                nilai:
                    hasil?.nilai ??
                    null,

                status:status

            };

        });


    /*
       URUTKAN:
       SEDANG → BELUM → SELESAI
    */

    semuaBaris.sort((a,b)=>{

        const urutan = {
            sedang:1,
            belum:2,
            selesai:3
        };

        return (
            (urutan[a.status] || 9) -
            (urutan[b.status] || 9)
        );

    });


    console.log(
        "BARIS MONITOR:",
        semuaBaris
    );
}


/* =========================================================
   FILTER
========================================================= */

function isiFilter(){

    const selectUjian =
        document.getElementById("filterUjian");

    const selectMapel =
        document.getElementById("filterMapel");

    const selectKelas =
        document.getElementById("filterKelas");

    const resetUjian =
        document.getElementById("resetUjian");


    /*
       SIMPAN NILAI FILTER SEBELUM REFRESH
    */

    const oldUjian =
        selectUjian.value;

    const oldMapel =
        selectMapel.value;

    const oldKelas =
        selectKelas.value;


    /*
       UJIAN
    */

    selectUjian.innerHTML =
        `<option value="">Semua Ujian</option>`;


    resetUjian.innerHTML =
        `<option value="">Pilih ujian untuk Reset Semua</option>`;


    semuaUjian.forEach(u=>{

        const option =
            document.createElement("option");

        option.value = u.id;

        option.textContent =
            u.judul || "Ujian";

        selectUjian.appendChild(option);


        const resetOption =
            document.createElement("option");

        resetOption.value = u.id;

        resetOption.textContent =
            u.judul || "Ujian";

        resetUjian.appendChild(resetOption);

    });


    /*
       MATA PELAJARAN
    */

    selectMapel.innerHTML =
        `<option value="">Semua Mata Pelajaran</option>`;


    const mapelUnik = [];

    const mapelIds = new Set();


    semuaMapel.forEach(m=>{

        if(
            m?.id &&
            !mapelIds.has(
                String(m.id)
            )
        ){

            mapelIds.add(
                String(m.id)
            );

            mapelUnik.push(m);
        }

    });


    mapelUnik.forEach(m=>{

        const option =
            document.createElement("option");

        option.value = m.id;

        option.textContent =
            m.nama || "-";

        selectMapel.appendChild(option);

    });


    /*
       ROMBEL
       DIAMBIL LANGSUNG DARI siswa.kelas
    */

    selectKelas.innerHTML =
        `<option value="">Semua Rombel</option>`;


    const kelasSet =
        new Set();


    semuaSiswa.forEach(s=>{

        const kelas =
            String(
                s.kelas || ""
            ).trim();


        if(kelas){
            kelasSet.add(kelas);
        }

    });


    /*
       Tambahkan juga kelas dari hasil
       bila siswa sudah tidak ditemukan.
    */

    semuaHasil.forEach(h=>{

        const kelas =
            String(
                h.kelas || ""
            ).trim();


        if(kelas){
            kelasSet.add(kelas);
        }

    });


    /*
       Urutan rombel:
       7A...7G
       8A...8F
       9A...9H
    */

    const kelasArray =
        Array.from(kelasSet);


    kelasArray.sort(
        urutkanRombel
    );


    kelasArray.forEach(kelas=>{

        const option =
            document.createElement("option");

        option.value = kelas;

        option.textContent = kelas;

        selectKelas.appendChild(option);

    });


    /*
       KEMBALIKAN FILTER LAMA
    */

    if(
        [...selectUjian.options]
        .some(o=>o.value === oldUjian)
    ){

        selectUjian.value = oldUjian;
    }


    if(
        [...selectMapel.options]
        .some(o=>o.value === oldMapel)
    ){

        selectMapel.value = oldMapel;
    }


    if(
        [...selectKelas.options]
        .some(o=>o.value === oldKelas)
    ){

        selectKelas.value = oldKelas;
    }

}


/* =========================================================
   URUTAN ROMBEL
========================================================= */

function urutkanRombel(a,b){

    const pa =
        String(a)
        .trim()
        .match(/^(\d+)\s*([A-Za-z]*)/);

    const pb =
        String(b)
        .trim()
        .match(/^(\d+)\s*([A-Za-z]*)/);


    if(!pa || !pb){

        return String(a)
            .localeCompare(
                String(b),
                "id"
            );
    }


    const tingkatA =
        parseInt(pa[1],10);

    const tingkatB =
        parseInt(pb[1],10);


    if(
        tingkatA !==
        tingkatB
    ){

        return tingkatA - tingkatB;
    }


    return String(pa[2] || "")
        .toUpperCase()
        .localeCompare(
            String(pb[2] || "")
                .toUpperCase(),
            "id"
        );
}


/* =========================================================
   TERAPKAN FILTER
========================================================= */

function terapkanFilter(){

    const filterUjian =
        document.getElementById(
            "filterUjian"
        ).value;


    const filterMapel =
        document.getElementById(
            "filterMapel"
        ).value;


    const filterKelas =
        document.getElementById(
            "filterKelas"
        ).value;


    const filterStatus =
        document.getElementById(
            "filterStatus"
        ).value;


    const search =
        normalisasi(
            document.getElementById(
                "search"
            ).value
        );


    barisTampil =
        semuaBaris.filter(row=>{

            /*
               UJIAN
            */

            if(
                filterUjian &&
                String(row.ujian?.id) !==
                String(filterUjian)
            ){

                return false;
            }


            /*
               MAPEL
            */

            if(
                filterMapel &&
                String(
                    row.ujian?.mata_pelajaran_id
                ) !==
                String(filterMapel)
            ){

                return false;
            }


            /*
               KELAS
            */

            if(
                filterKelas &&
                normalisasi(row.kelas) !==
                normalisasi(filterKelas)
            ){

                return false;
            }


            /*
               STATUS
            */

            if(
                filterStatus &&
                row.status !==
                filterStatus
            ){

                return false;
            }


            /*
               PENCARIAN
            */

            if(search){

                const gabungan =
                    normalisasi(
                        row.nama +
                        " " +
                        row.nisn +
                        " " +
                        row.kelas +
                        " " +
                        row.judul +
                        " " +
                        row.mapelNama
                    );


                if(
                    !gabungan.includes(search)
                ){

                    return false;
                }

            }


            return true;

        });


    renderTable();

    updateStats();
}


/* =========================================================
   RENDER TABLE
========================================================= */

function renderTable(){

    const tbody =
        document.getElementById(
            "tableBody"
        );


    if(!barisTampil.length){

        tbody.innerHTML = `
            <tr>
                <td colspan="11">
                    <div class="empty">
                        <div class="empty-icon">📭</div>
                        <b>Tidak ada data peserta</b>
                        <br>
                        <small>
                            Coba ubah filter atau pastikan
                            peserta sudah terdaftar pada ujian.
                        </small>
                    </div>
                </td>
            </tr>
        `;

        return;
    }


    tbody.innerHTML =
        barisTampil.map(
            (row,index)=>{

                const pesertaId =
                    row.peserta?.id || "";

                const ujianId =
                    row.ujian?.id || "";

                const nisn =
                    row.nisn || "";


                const nilai =
                    row.nilai !== null &&
                    row.nilai !== undefined
                        ? Number(row.nilai)
                            .toLocaleString(
                                "id-ID",
                                {
                                    maximumFractionDigits:2
                                }
                            )
                        : "-";


                return `
                    <tr>

                        <td>
                            ${index + 1}
                        </td>

                        <td>
                            <b>
                                ${escapeHTML(row.nama)}
                            </b>
                        </td>

                        <td>
                            ${escapeHTML(row.nisn || "-")}
                        </td>

                        <td>
                            <b>
                                ${escapeHTML(row.kelas)}
                            </b>
                        </td>

                        <td>
                            ${escapeHTML(row.judul)}
                        </td>

                        <td>
                            ${escapeHTML(row.mapelNama)}
                        </td>

                        <td>
                            ${formatJam(
                                row.waktuMulai
                            )}
                        </td>

                        <td>
                            ${formatJam(
                                row.waktuSelesai
                            )}
                        </td>

                        <td>

                            ${
                                row.nilai !== null &&
                                row.nilai !== undefined

                                ?

                                `<span class="nilai">
                                    ${nilai}
                                </span>`

                                :

                                `<span class="nilai-kosong">
                                    -
                                </span>`
                            }

                        </td>

                        <td>
                            ${statusHTML(
                                row.status
                            )}
                        </td>

                        <td>

                            ${
                                row.hasil

                                ?

                                `<button
                                    class="btn-reset-small"
                                    onclick="resetSatu(
                                        '${escapeJS(ujianId)}',
                                        '${escapeJS(nisn)}',
                                        '${escapeJS(row.nama)}'
                                    )"
                                >
                                    ↻ Reset
                                </button>`

                                :

                                `<span
                                    style="
                                        color:#94a3b8;
                                        font-size:11px;
                                    "
                                >
                                    -
                                </span>`
                            }

                        </td>

                    </tr>
                `;

            }
        ).join("");

}


/* =========================================================
   ESCAPE JS
========================================================= */

function escapeJS(value){

    return String(value || "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/"/g,'\\"')
        .replace(/\n/g,"\\n")
        .replace(/\r/g,"\\r");
}


/* =========================================================
   STATISTIK
========================================================= */

function updateStats(){

    const total =
        barisTampil.length;


    const sedang =
        barisTampil.filter(
            x=>x.status === "sedang"
        ).length;


    const selesai =
        barisTampil.filter(
            x=>x.status === "selesai"
        ).length;


    const belum =
        barisTampil.filter(
            x=>x.status === "belum"
        ).length;


    document.getElementById(
        "totalPeserta"
    ).textContent = total;


    document.getElementById(
        "sedangUjian"
    ).textContent = sedang;


    document.getElementById(
        "sudahSelesai"
    ).textContent = selesai;


    document.getElementById(
        "belumMulai"
    ).textContent = belum;

}


/* =========================================================
   RESET SATU SISWA
========================================================= */

async function resetSatu(
    ujianId,
    nisn,
    nama
){

    if(!ujianId || !nisn){

        showToast(
            "Data ujian atau NISN tidak ditemukan.",
            "error"
        );

        return;
    }


    const yakin =
        confirm(
            "Reset hasil ujian siswa berikut?\n\n" +
            "Nama : " + nama + "\n" +
            "NISN : " + nisn + "\n\n" +
            "Setelah di-reset, siswa dapat mengikuti " +
            "ujian kembali."
        );


    if(!yakin){
        return;
    }


    try{

        const {error} =
            await supabaseClient
                .from("hasil_ujian")
                .delete()
                .eq("ujian_id",ujianId)
                .eq("nisn",nisn);


        if(error){
            throw error;
        }


        /*
           Hapus juga peserta_ujian
           milik siswa tersebut agar status
           monitor kembali bersih.
        */

        const siswa =
            semuaSiswa.find(
                s =>
                    String(s.nisn).trim() ===
                    String(nisn).trim()
            );


        if(siswa){

            await supabaseClient
                .from("peserta_ujian")
                .delete()
                .eq("ujian_id",ujianId)
                .eq("siswa_id",siswa.id);
        }


        showToast(
            "Hasil ujian " +
            nama +
            " berhasil di-reset."
        );


        await loadData();

    }
    catch(error){

        console.error(error);

        showToast(
            "Gagal reset: " +
            (error.message || error),
            "error"
        );

    }

}


/* =========================================================
   RESET SEMUA
========================================================= */

async function resetSemua(){

    const ujianId =
        document.getElementById(
            "resetUjian"
        ).value;


    if(!ujianId){

        showToast(
            "Pilih ujian terlebih dahulu.",
            "error"
        );

        return;
    }


    const ujian =
        semuaUjian.find(
            u =>
                String(u.id) ===
                String(ujianId)
        );


    const namaUjian =
        ujian?.judul ||
        "ujian";


    const jumlah =
        semuaHasil.filter(
            h =>
                String(h.ujian_id) ===
                String(ujianId)
        ).length;


    const yakin =
        confirm(
            "PERINGATAN!\n\n" +
            "Anda akan mereset SEMUA hasil " +
            "untuk ujian:\n\n" +
            namaUjian +
            "\n\n" +
            "Jumlah hasil: " +
            jumlah +
            "\n\n" +
            "Semua siswa yang sudah selesai " +
            "dapat mengikuti ujian kembali.\n\n" +
            "Lanjutkan?"
        );


    if(!yakin){
        return;
    }


    try{

        /*
           HAPUS HASIL
        */

        const hasilDelete =
            await supabaseClient
                .from("hasil_ujian")
                .delete()
                .eq("ujian_id",ujianId);


        if(hasilDelete.error){
            throw hasilDelete.error;
        }


        /*
           HAPUS PESERTA
        */

        const pesertaDelete =
            await supabaseClient
                .from("peserta_ujian")
                .delete()
                .eq("ujian_id",ujianId);


        if(pesertaDelete.error){

            console.warn(
                "Peserta ujian tidak dapat dihapus:",
                pesertaDelete.error
            );

        }


        showToast(
            "Semua hasil ujian berhasil di-reset."
        );


        await loadData();

    }
    catch(error){

        console.error(error);

        showToast(
            "Gagal reset semua: " +
            (error.message || error),
            "error"
        );

    }

}
