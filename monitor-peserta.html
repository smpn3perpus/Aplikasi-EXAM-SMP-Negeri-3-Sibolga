<style>
*{
    box-sizing:border-box;

body{

<script>

const SUPABASE_URL =
    "https://sztfucrmjexoalyiwwnq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_j724cUM7NNHl8wbxq9ZHKw_FLFJAuGn";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let semuaPeserta = [];
let semuaUjian = [];
let semuaMapel = [];
let semuaSiswa = [];
let semuaHasil = [];


/* =====================================================
   CEK LOGIN ADMIN
===================================================== */

function cekAdmin(){

    let user = null;

    try{
        user = JSON.parse(
            localStorage.getItem("exam_user") || "null"
        );
    }catch(e){
        user = null;
    }

    if(!user || user.role !== "admin"){

        alert("❌ Anda harus login sebagai Admin.");

        window.location.href = "login.html";

        return false;
    }

    return true;
}


/* =====================================================
   KEMBALI
===================================================== */

function kembaliAdmin(){

    window.location.href = "admin.html";

}


/* =====================================================
   ALERT
===================================================== */

function showAlert(message,type="success"){

    const box =
        document.getElementById("alertBox");

    box.textContent = message;

    box.className =
        "alert " + type;

    setTimeout(()=>{

        box.className = "alert";

    },4000);

}


/* =====================================================
   LOAD DATA UTAMA
===================================================== */

async function loadData(){

    const tbody =
        document.getElementById("tbodyPeserta");

    tbody.innerHTML = `
        <tr>
            <td colspan="10">
                <div class="loading">
                    ⏳ Memuat data...
                </div>
            </td>
        </tr>
    `;

    try{

        /*
         * 1. AMBIL PESERTA UJIAN
         */

        const pesertaResult =
            await supabaseClient
                .from("peserta_ujian")
                .select("*")
                .order("created_at",{ascending:false});

        if(pesertaResult.error)
            throw pesertaResult.error;


        semuaPeserta =
            pesertaResult.data || [];


        /*
         * 2. AMBIL SISWA
         */

        const siswaResult =
            await supabaseClient
                .from("siswa")
                .select("*");

        if(siswaResult.error)
            throw siswaResult.error;


        semuaSiswa =
            siswaResult.data || [];


        /*
         * 3. AMBIL UJIAN
         *
         * INI RELASI UTAMA KE MAPEL
         */

        const ujianResult =
            await supabaseClient
                .from("ujian")
                .select(`
                    id,
                    judul,
                    kelas_id,
                    mata_pelajaran_id,
                    tanggal_mulai,
                    tanggal_selesai,
                    durasi_menit,
                    status
                `);

        if(ujianResult.error)
            throw ujianResult.error;


        semuaUjian =
            ujianResult.data || [];


        /*
         * 4. AMBIL SEMUA MATA PELAJARAN
         */

        const mapelResult =
            await supabaseClient
                .from("mata_pelajaran")
                .select("id,nama")
                .order("nama",{ascending:true});

        if(mapelResult.error)
            throw mapelResult.error;


        semuaMapel =
            mapelResult.data || [];


        /*
         * 5. AMBIL HASIL UJIAN
         *
         * INI YANG MENENTUKAN
         * SUDAH SELESAI / BELUM
         */

        const hasilResult =
            await supabaseClient
                .from("hasil_ujian")
                .select(`
                    id,
                    siswa_id,
                    ujian_id,
                    nama_siswa,
                    nisn,
                    nilai,
                    jumlah_benar,
                    jumlah_soal,
                    waktu_mulai,
                    waktu_selesai
                `);

        if(hasilResult.error)
            throw hasilResult.error;


        semuaHasil =
            hasilResult.data || [];


        /*
         * 6. BENTUK DATA RELASI
         */

        semuaPeserta =
            semuaPeserta.map(p => {

                const siswa =
                    cariSiswa(p);

                const ujian =
                    cariUjian(p);

                const mapel =
                    ujian
                        ? cariMapel(ujian.mata_pelajaran_id)
                        : null;

                const hasil =
                    cariHasil(
                        p,
                        siswa,
                        ujian
                    );


                let status =
                    tentukanStatus(
                        p,
                        hasil,
                        ujian
                    );


                return {

                    ...p,

                    siswa_id:
                        siswa?.id ||
                        p.siswa_id ||
                        null,

                    nama_siswa:
                        siswa?.nama ||
                        p.nama_siswa ||
                        p.nama ||
                        "-",

                    nisn:
                        siswa?.nisn ||
                        p.nisn ||
                        "-",

                    kelas:
                        siswa?.kelas ||
                        p.kelas ||
                        p.nama_kelas ||
                        "-",

                    ujian_id:
                        ujian?.id ||
                        p.ujian_id ||
                        null,

                    ujian:
                        ujian?.judul ||
                        p.judul_ujian ||
                        "-",

                    mata_pelajaran_id:
                        ujian?.mata_pelajaran_id ||
                        null,

                    mata_pelajaran:
                        mapel?.nama ||
                        "-",

                    hasil:
                        hasil || null,

                    nilai:
                        hasil?.nilai ?? null,

                    waktu_selesai:
                        hasil?.waktu_selesai ||
                        null,

                    status_monitor:
                        status

                };

            });


        isiFilterUjian();

        isiFilterMapel();

        isiFilterKelas();

        render();


    }catch(error){

        console.error(error);

        tbody.innerHTML = `
            <tr>
                <td colspan="10">
                    <div class="empty">
                        ❌ Gagal memuat data.<br>
                        ${escapeHtml(error.message || "Unknown error")}
                    </div>
                </td>
            </tr>
        `;

        showAlert(
            "Gagal memuat data: " +
            (error.message || "Unknown error"),
            "error"
        );

    }

}


/* =====================================================
   CARI SISWA
===================================================== */

function cariSiswa(p){

    if(p.siswa_id){

        const byId =
            semuaSiswa.find(
                s => String(s.id) === String(p.siswa_id)
            );

        if(byId)
            return byId;

    }


    const nisn =
        String(
            p.nisn ||
            p.username ||
            ""
        ).trim();


    if(nisn){

        const byNisn =
            semuaSiswa.find(
                s =>
                    String(s.nisn || "").trim()
                    === nisn
            );

        if(byNisn)
            return byNisn;

    }


    return null;

}


/* =====================================================
   CARI UJIAN
===================================================== */

function cariUjian(p){

    if(!p.ujian_id)
        return null;


    return semuaUjian.find(
        u =>
            String(u.id)
            === String(p.ujian_id)
    ) || null;

}


/* =====================================================
   CARI MAPEL
===================================================== */

function cariMapel(mataPelajaranId){

    if(!mataPelajaranId)
        return null;


    return semuaMapel.find(
        m =>
            String(m.id)
            === String(mataPelajaranId)
    ) || null;

}


/* =====================================================
   CARI HASIL UJIAN
===================================================== */

function cariHasil(p,siswa,ujian){

    if(!ujian)
        return null;


    /*
     * PRIORITAS 1:
     * siswa_id + ujian_id
     */

    if(siswa?.id){

        const hasilBySiswa =
            semuaHasil.find(h =>

                String(h.ujian_id)
                    === String(ujian.id)

                &&

                String(h.siswa_id || "")
                    === String(siswa.id)

            );

        if(hasilBySiswa)
            return hasilBySiswa;

    }


    /*
     * PRIORITAS 2:
     * NISN + ujian_id
     */

    const nisn =
        String(
            siswa?.nisn ||
            p.nisn ||
            ""
        ).trim();


    if(nisn){

        const hasilByNisn =
            semuaHasil.find(h =>

                String(h.ujian_id)
                    === String(ujian.id)

                &&

                String(h.nisn || "").trim()
                    === nisn

            );

        if(hasilByNisn)
            return hasilByNisn;

    }


    return null;

}


/* =====================================================
   TENTUKAN STATUS
===================================================== */

function tentukanStatus(p,hasil,ujian){

    /*
     * JIKA SUDAH ADA HASIL
     * MAKA PASTI SELESAI
     */

    if(hasil){

        return "selesai";

    }


    /*
     * CEK STATUS PESERTA
     */

    const statusPeserta =
        String(
            p.status ||
            p.status_ujian ||
            ""
        ).toLowerCase();


    if(
        statusPeserta === "aktif" ||
        statusPeserta === "sedang" ||
        statusPeserta === "sedang_ujian" ||
        statusPeserta === "in_progress" ||
        statusPeserta === "mengerjakan" ||
        statusPeserta === "jeda"
    ){

        return "sedang";

    }


    /*
     * CEK DARI WAKTU
     */

    if(ujian){

        const sekarang =
            new Date();

        const mulai =
            ujian.tanggal_mulai
                ? new Date(ujian.tanggal_mulai)
                : null;

        const selesai =
            ujian.tanggal_selesai
                ? new Date(ujian.tanggal_selesai)
                : null;


        /*
         * JIKA UJIAN BELUM MULAI
         */

        if(
            mulai &&
            sekarang < mulai
        ){

            return "belum";

        }


        /*
         * JIKA UJIAN SUDAH BERLANGSUNG
         * tetapi peserta belum ada hasil
         */

        if(
            mulai &&
            sekarang >= mulai &&
            (!selesai || sekarang <= selesai)
        ){

            return "sedang";

        }

    }


    return "belum";

}


/* =====================================================
   FILTER UJIAN
===================================================== */

function isiFilterUjian(){

    const select =
        document.getElementById("filterUjian");


    select.innerHTML =
        `<option value="">Semua Ujian</option>`;


    const used =
        new Set();


    semuaPeserta.forEach(p => {

        if(!p.ujian_id)
            return;


        if(used.has(String(p.ujian_id)))
            return;


        const ujian =
            semuaUjian.find(
                u =>
                    String(u.id)
                    === String(p.ujian_id)
            );


        if(!ujian)
            return;


        used.add(String(ujian.id));


        const option =
            document.createElement("option");

        option.value =
            ujian.id;

        option.textContent =
            ujian.judul || "Ujian";


        select.appendChild(option);

    });

}


/* =====================================================
   FILTER MAPEL
===================================================== */

function isiFilterMapel(){

    const select =
        document.getElementById("filterMapel");


    select.innerHTML =
        `<option value="">Semua Mata Pelajaran</option>`;


    /*
     * MAPEL DIAMBIL DARI
     * UJIAN YANG BENAR-BENAR DIPAKAI
     */

    const mapelIds =
        new Set();


    semuaPeserta.forEach(p => {

        if(!p.ujian_id)
            return;


        const ujian =
            semuaUjian.find(
                u =>
                    String(u.id)
                    === String(p.ujian_id)
            );


        if(
            ujian &&
            ujian.mata_pelajaran_id
        ){

            mapelIds.add(
                String(
                    ujian.mata_pelajaran_id
                )
            );

        }

    });


    const daftarMapel =
        semuaMapel
            .filter(m =>
                mapelIds.has(
                    String(m.id)
                )
            )
            .sort(
                (a,b) =>
                    String(a.nama || "")
                    .localeCompare(
                        String(b.nama || ""),
                        "id"
                    )
            );


    daftarMapel.forEach(mapel => {

        const option =
            document.createElement("option");

        option.value =
            mapel.id;

        option.textContent =
            mapel.nama;

        select.appendChild(option);

    });

}


/* =====================================================
   FILTER ROMBEL
===================================================== */

function isiFilterKelas(){

    const select =
        document.getElementById("filterKelas");


    select.innerHTML =
        `<option value="">Semua Rombel</option>`;


    const kelasSet =
        new Set();


    semuaPeserta.forEach(p => {

        const kelas =
            String(
                p.kelas || ""
            ).trim();


        if(kelas)
            kelasSet.add(kelas);

    });


    Array.from(kelasSet)
        .sort((a,b) =>
            a.localeCompare(
                b,
                "id",
                {numeric:true}
            )
        )
        .forEach(kelas => {

            const option =
                document.createElement("option");

            option.value =
                kelas;

            option.textContent =
                kelas;

            select.appendChild(option);

        });

}


/* =====================================================
   RENDER
===================================================== */

function render(){

    const filterUjian =
        document.getElementById(
            "filterUjian"
        ).value;


    const filterMapel =
        document.getElementById(
            "filterMapel"
        ).value;


    const filterKelas =
        document.getElementById(
            "filterKelas"
        ).value;


    const filterStatus =
        document.getElementById(
            "filterStatus"
        ).value;


    const search =
        document.getElementById(
            "search"
        ).value
        .toLowerCase()
        .trim();


    const data =
        semuaPeserta.filter(p => {

            /*
             * FILTER UJIAN
             */

            if(
                filterUjian &&
                String(p.ujian_id)
                    !== String(filterUjian)
            ){

                return false;

            }


            /*
             * FILTER MAPEL
             *
             * BERDASARKAN
             * ujian.mata_pelajaran_id
             */

            if(
                filterMapel &&
                String(p.mata_pelajaran_id)
                    !== String(filterMapel)
            ){

                return false;

            }


            /*
             * FILTER ROMBEL
             */

            if(
                filterKelas &&
                String(p.kelas || "")
                    !== String(filterKelas)
            ){

                return false;

            }


            /*
             * FILTER STATUS
             */

            if(
                filterStatus &&
                p.status_monitor
                    !== filterStatus
            ){

                return false;

            }


            /*
             * PENCARIAN
             */

            if(search){

                const nama =
                    String(
                        p.nama_siswa || ""
                    ).toLowerCase();


                const nisn =
                    String(
                        p.nisn || ""
                    ).toLowerCase();


                if(
                    !nama.includes(search) &&
                    !nisn.includes(search)
                ){

                    return false;

                }

            }


            return true;

        });


    updateStats(data);

    renderTable(data);

}


/* =====================================================
   STATISTIK
===================================================== */

function updateStats(data){

    const total =
        data.length;


    const sedang =
        data.filter(
            p =>
                p.status_monitor
                === "sedang"
        ).length;


    const selesai =
        data.filter(
            p =>
                p.status_monitor
                === "selesai"
        ).length;


    const belum =
        data.filter(
            p =>
                p.status_monitor
                === "belum"
        ).length;


    document.getElementById(
        "totalPeserta"
    ).textContent =
        total;


    document.getElementById(
        "totalSedang"
    ).textContent =
        sedang;


    document.getElementById(
        "totalSelesai"
    ).textContent =
        selesai;


    document.getElementById(
        "totalBelum"
    ).textContent =
        belum;

}


/* =====================================================
   RENDER TABLE
===================================================== */

function renderTable(data){

    const tbody =
        document.getElementById(
            "tbodyPeserta"
        );


    if(!data.length){

        tbody.innerHTML = `
            <tr>
                <td colspan="10">
                    <div class="empty">
                        📭 Tidak ada peserta
                        sesuai filter.
                    </div>
                </td>
            </tr>
        `;

        return;

    }


    tbody.innerHTML =
        data.map((p,index) => {

            let statusHtml = "";

            if(
                p.status_monitor
                === "sedang"
            ){

                statusHtml = `
                    <span class="status sedang">
                        🟢 Sedang Ujian
                    </span>
                `;

            }
            else if(
                p.status_monitor
                === "selesai"
            ){

                statusHtml = `
                    <span class="status selesai">
                        ✅ Sudah Selesai
                    </span>
                `;

            }
            else{

                statusHtml = `
                    <span class="status belum">
                        ⏳ Belum Mulai
                    </span>
                `;

            }


            let waktu = "-";


            if(p.waktu_selesai){

                waktu =
                    formatTanggal(
                        p.waktu_selesai
                    );

            }
            else if(
                p.status_monitor
                === "sedang"
            ){

                waktu = "Sedang mengerjakan";

            }


            let nilai = "-";


            if(
                p.nilai !== null &&
                p.nilai !== undefined
            ){

                nilai =
                    Number(p.nilai)
                    .toFixed(0);

            }


            return `

                <tr>

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        <div class="nama">
                            ${escapeHtml(
                                p.nama_siswa
                            )}
                        </div>
                    </td>

                    <td>
                        <span class="nisn">
                            ${escapeHtml(
                                p.nisn
                            )}
                        </span>
                    </td>

                    <td>
                        <strong>
                            ${escapeHtml(
                                p.kelas
                            )}
                        </strong>
                    </td>

                    <td>
                        <div class="exam-info">

                            <span class="ujian">
                                ${escapeHtml(
                                    p.ujian
                                )}
                            </span>

                        </div>
                    </td>

                    <td>
                        <span class="mapel">
                            ${escapeHtml(
                                p.mata_pelajaran
                            )}
                        </span>
                    </td>

                    <td>
                        <span class="nilai">
                            ${nilai}
                        </span>
                    </td>

                    <td>
                        ${statusHtml}
                    </td>

                    <td>
                        ${waktu}
                    </td>

                    <td>

                        <button
                            class="btn-reset"
                            onclick='resetPeserta(
                                ${JSON.stringify(
                                    p.ujian_id
                                )},
                                ${JSON.stringify(
                                    p.nisn
                                )},
                                ${JSON.stringify(
                                    p.nama_siswa
                                )}
                            )'
                        >
                            🔄 Reset
                        </button>

                    </td>

                </tr>

            `;

        }).join("");

}


/* =====================================================
   RESET SATU PESERTA
===================================================== */

async function resetPeserta(
    ujianId,
    nisn,
    nama
){

    if(!ujianId){

        alert(
            "❌ Ujian peserta tidak ditemukan."
        );

        return;

    }


    const konfirmasi =
        confirm(
            "Reset ujian siswa?\n\n" +
            "Nama: " + nama + "\n" +
            "NISN: " + nisn + "\n\n" +
            "Hasil ujian siswa akan dihapus " +
            "dan siswa dapat mengikuti ujian kembali."
        );


    if(!konfirmasi)
        return;


    try{

        /*
         * RESET BERDASARKAN
         * UJIAN + NISN
         */

        const result =
            await supabaseClient
                .from("hasil_ujian")
                .delete()
                .eq(
                    "ujian_id",
                    ujianId
                )
                .eq(
                    "nisn",
                    String(nisn).trim()
                );


        if(result.error)
            throw result.error;


        showAlert(
            "✅ Ujian " +
            nama +
            " berhasil di-reset."
        );


        await loadData();


    }catch(error){

        console.error(error);

        showAlert(
            "❌ Gagal reset: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   RESET SEMUA
===================================================== */

async function resetSemuaPeserta(){

    const ujianId =
        document.getElementById(
            "filterUjian"
        ).value;


    if(!ujianId){

        alert(
            "⚠️ Pilih satu ujian terlebih dahulu."
        );

        return;

    }


    const ujian =
        semuaUjian.find(
            u =>
                String(u.id)
                === String(ujianId)
        );


    if(!ujian){

        alert(
            "❌ Data ujian tidak ditemukan."
        );

        return;

    }


    const jumlah =
        semuaPeserta.filter(
            p =>
                String(p.ujian_id)
                === String(ujianId)
        ).length;


    const konfirmasi =
        confirm(
            "⚠️ RESET SEMUA PESERTA\n\n" +

            "Ujian: " +
            (ujian.judul || "-") +
            "\n\n" +

            "Jumlah peserta: " +
            jumlah +
            "\n\n" +

            "Semua hasil ujian untuk ujian ini " +
            "akan dihapus.\n\n" +

            "Peserta dapat mengikuti ujian kembali.\n\n" +

            "Lanjutkan?"
        );


    if(!konfirmasi)
        return;


    try{

        /*
         * HANYA HASIL DARI UJIAN YANG DIPILIH
         */

        const result =
            await supabaseClient
                .from("hasil_ujian")
                .delete()
                .eq(
                    "ujian_id",
                    ujianId
                );


        if(result.error)
            throw result.error;


        showAlert(
            "✅ Semua hasil peserta pada ujian " +
            (ujian.judul || "") +
            " berhasil di-reset."
        );


        await loadData();


    }catch(error){

        console.error(error);

        showAlert(
            "❌ Gagal reset semua: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   FORMAT TANGGAL
===================================================== */

function formatTanggal(value){

    if(!value)
        return "-";


    try{

        const d =
            new Date(value);


        return d.toLocaleString(
            "id-ID",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }catch(e){

        return value;

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   EVENT FILTER
===================================================== */

document
    .getElementById("filterUjian")
    .addEventListener(
        "change",
        render
    );


document
    .getElementById("filterMapel")
    .addEventListener(
        "change",

    );


document
    .getElementById("filterKelas")
    .addEventListener(
        "change",

    );


document
    .getElementById("filterStatus")

        "change",
        render
    );


document
    .getElementById("search")
    .addEventListener(
