<body>

<!-- HEADER -->

<header class="header">

    <div>

        <h1>
            👨‍🏫 DAFTAR GURU
        </h1>

        <p>
            RUANG EXAM — SMP Negeri 3 Sibolga
        </p>

    </div>

    <div class="header-buttons">

        <button
            class="btn btn-back"
            onclick="kembaliDashboard()">
            ← Dashboard
        </button>

        <button
            class="btn btn-refresh"
            onclick="loadGuru()">
            🔄 Refresh
        </button>

<main class="container">

    <div id="message" class="message"></div>


    <!-- TOOLBAR -->

    <div class="toolbar">

        <div class="search">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Cari nama atau NIP/NIK..."
                oninput="filterGuru()">

        </div>

            class="btn btn-add"
            onclick="bukaTambah()">

    <!-- TABLE -->

        <table>

            <thead>

                <tr>

                    <th>Password</th>
                    <th>Aksi</th>

            <tbody id="guruBody">

                <tr>

                        class="empty">

<div
    class="modal"
    id="modal">

    <div class="modal-box">

        <h2 id="modalTitle">
            Tambah Guru
        </h2>


        <div class="modal-info">

            <strong>Login Guru:</strong><br>

            Username = NIP/NIK<br>

            Password awal = NIP/NIK

        <div class="modal-buttons">

            <button

                onclick="tutupModal()">

                Batal

            <button
                class="btn save"
                onclick="simpanGuru()">

                💾 Simpan

            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://sztfucrmjexoalyiwwnq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_j724cUM7NNHl8wbxq9ZHKw_FLFJAuGn";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   CEK ADMIN
===================================================== */

const sessionRaw =
    localStorage.getItem("exam_user");


if(!sessionRaw){

    window.location.href =
        "login.html";

}


let currentUser = null;

try{

    currentUser =
        JSON.parse(sessionRaw);

    if(currentUser.role !== "admin"){

        localStorage.removeItem(
            "exam_user"
        );

        window.location.href =
            "login.html";

    }

}catch(error){

    localStorage.removeItem(
        "exam_user"
    );

    window.location.href =
        "login.html";

}


/* =====================================================
   DATA
===================================================== */

let semuaGuru = [];

let editId = null;


/* =====================================================
   PESAN
===================================================== */

function showMessage(text,type){

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message " + type;

}

function hideMessage(){

    const message =
        document.getElementById("message");

    message.textContent = "";

    message.className =
        "message";

}


/* =====================================================
   LOAD GURU
===================================================== */

async function loadGuru(){

    hideMessage();

    const body =
        document.getElementById("guruBody");

    body.innerHTML = `
        <tr>
            <td colspan="5" class="empty">
                ⏳ Memuat data guru...
            </td>
        </tr>
    `;


    try{

        const { data,error } =
            await supabaseClient
            .from("guru")
            .select("id,nama,nip,password,user_id,created_at")
            .order("nama",{ascending:true});


        if(error){

            console.error(error);

            body.innerHTML = `
                <tr>
                    <td colspan="5" class="empty">
                        Gagal memuat data guru.
                    </td>
                </tr>
            `;

            showMessage(
                "Gagal mengambil data guru: " +
                error.message,
                "error"
            );

            return;

        }


        semuaGuru =
            data || [];

        tampilkanGuru(
            semuaGuru
        );


    }catch(error){

        console.error(error);

        showMessage(
            "Terjadi kesalahan sistem: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   TAMPILKAN
===================================================== */

function tampilkanGuru(data){

    const body =
        document.getElementById("guruBody");


    if(!data.length){

        body.innerHTML = `
            <tr>
                <td colspan="5" class="empty">
                    Belum ada data guru.
                </td>
            </tr>
        `;

        return;

    }


    body.innerHTML =
        data.map((guru,index)=>{

            return `

                <tr>

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        <strong>
                            ${escapeHtml(guru.nama || "-")}
                        </strong>
                    </td>

                    <td>
                        ${escapeHtml(guru.nip || "-")}
                    </td>

                    <td>
                        ${escapeHtml(guru.password || "-")}
                    </td>

                    <td>

                        <div class="action">

                            <button
                                class="edit"
                                onclick="editGuru('${guru.id}')">

                                ✏️ Edit

                            </button>

                            <button
                                class="reset"
                                onclick="resetPassword('${guru.id}')">

                                🔑 Reset

                            </button>

                            <button
                                class="delete"
                                onclick="hapusGuru('${guru.id}')">

                                🗑️ Hapus

                            </button>

                        </div>

                    </td>

                </tr>

            `;

        }).join("");

}


/* =====================================================
   SEARCH
===================================================== */

function filterGuru(){

    const keyword =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    if(!keyword){

        tampilkanGuru(
            semuaGuru
        );

        return;

    }


    const hasil =
        semuaGuru.filter(guru=>{

            return (

                (guru.nama || "")
                .toLowerCase()
                .includes(keyword)

                ||

                (guru.nip || "")
                .toLowerCase()
                .includes(keyword)

            );

        });


    tampilkanGuru(
        hasil
    );

}


/* =====================================================
   TAMBAH GURU
===================================================== */

function bukaTambah(){

    editId = null;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Tambah Guru";


    document.getElementById(
        "nama"
    ).value = "";


    document.getElementById(
        "nip"
    ).value = "";


    document.getElementById(
        "modal"
    ).style.display =
        "flex";

}


/* =====================================================
   EDIT GURU
===================================================== */

function editGuru(id){

    const guru =
        semuaGuru.find(
            item => item.id === id
        );


    if(!guru){

        showMessage(
            "Data guru tidak ditemukan.",
            "error"
        );

        return;

    }


    editId = id;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Edit Guru";


    document.getElementById(
        "nama"
    ).value =
        guru.nama || "";


    document.getElementById(
        "nip"
    ).value =
        guru.nip || "";


    document.getElementById(
        "modal"
    ).style.display =
        "flex";

}


/* =====================================================
   SIMPAN GURU
===================================================== */

async function simpanGuru(){

    const nama =
        document.getElementById("nama")
        .value
        .trim();

    const nip =
        document.getElementById("nip")
        .value
        .trim();


    if(!nama || !nip){

        alert(
            "Nama dan NIP/NIK wajib diisi."
        );

        return;

    }


    try{

        /* ===============================
           TAMBAH
        =============================== */

        if(!editId){

            const { error } =
                await supabaseClient
                .from("guru")
                .insert({

                    nama:nama,

                    nip:nip,

                    password:nip

                });


            if(error){

                console.error(error);

                alert(
                    "Gagal menambah guru:\n" +
                    error.message
                );

                return;

            }


            showMessage(
                "Guru berhasil ditambahkan. Password awal = NIP/NIK.",
                "success"
            );

        }


        /* ===============================
           EDIT
        =============================== */

        else{

            const { error } =
                await supabaseClient
                .from("guru")
                .update({

                    nama:nama,

                    nip:nip

                })
                .eq("id",editId);


            if(error){

                console.error(error);

                alert(
                    "Gagal mengubah guru:\n" +
                    error.message
                );

                return;

            }


            showMessage(
                "Data guru berhasil diperbarui.",
                "success"
            );

        }


        tutupModal();

        await loadGuru();


    }catch(error){

        console.error(error);

        alert(
            "Terjadi kesalahan:\n" +
            error.message
        );

    }

}


/* =====================================================
   RESET PASSWORD
===================================================== */

async function resetPassword(id){

    const guru =
        semuaGuru.find(
            item => item.id === id
        );


    if(!guru){

        return;

    }


    const yakin =
        confirm(
            "Reset password guru:\n\n" +
            guru.nama +
            "\n\n" +
            "Password akan dikembalikan menjadi:\n" +
            guru.nip
        );


    if(!yakin){

        return;

    }


    try{

        const { error } =
            await supabaseClient
            .from("guru")
            .update({

                password:
                    guru.nip

            })
            .eq("id",id);


        if(error){

            console.error(error);

            alert(
                "Gagal reset password:\n" +
                error.message
            );

            return;

        }


        showMessage(
            "Password guru berhasil direset menjadi NIP/NIK.",
            "success"
        );


        await loadGuru();


    }catch(error){

        console.error(error);

        alert(
            "Terjadi kesalahan:\n" +
            error.message
        );

    }

}


/* =====================================================
   HAPUS GURU
===================================================== */

async function hapusGuru(id){

    const guru =
        semuaGuru.find(
            item => item.id === id
        );


    if(!guru){

        return;

    }


    const yakin =
        confirm(
            "Hapus guru berikut?\n\n" +
            guru.nama +
            "\n" +
            guru.nip +
            "\n\n" +
            "Data yang dihapus tidak dapat dikembalikan."
        );


    if(!yakin){

        return;

    }


    try{

        const { error } =
            await supabaseClient
            .from("guru")
            .delete()
            .eq("id",id);


        if(error){

            console.error(error);

            alert(
                "Gagal menghapus guru:\n" +
                error.message
            );

            return;

        }


        showMessage(
            "Guru berhasil dihapus.",
            "success"
        );


        await loadGuru();


    }catch(error){

        console.error(error);

        alert(
            "Terjadi kesalahan:\n" +
            error.message
        );

    }

}


/* =====================================================
   MODAL
===================================================== */

function tutupModal(){

    document.getElementById(
        "modal"
    ).style.display =
        "none";

    editId = null;

}


/* =====================================================
   KEMBALI
===================================================== */

function kembaliDashboard(){

    window.location.href =
        "admin.html";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   LOAD AWAL
===================================================== */

loadGuru();

</script>

</body>
</html>
```
